<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>三年級面積</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: unit hub — one row per lesson, big finger-sized cards for students, small teacher links underneath */
:root{--paper:#f7f9fc;--sheet:#fff;--ink:#1f2d3d;--muted:#5b6b7d;--grid:#9cc3e8;--blue:#3d8bd4;--qnum:#f26b3a;--chip:#e8f1fb;
  --display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;--body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#121a24;--sheet:#1a2533;--ink:#e8eef5;--muted:#9fb0c3;--grid:#2f4d6b;--blue:#6db3f2;--qnum:#ff8a5c;--chip:#21344a;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#121a24;--sheet:#1a2533;--ink:#e8eef5;--muted:#9fb0c3;--grid:#2f4d6b;--blue:#6db3f2;--qnum:#ff8a5c;--chip:#21344a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:19px;line-height:1.55;
  background-image:linear-gradient(var(--chip) 1px,transparent 1px),linear-gradient(90deg,var(--chip) 1px,transparent 1px);background-size:40px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 40px}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--display);font-size:clamp(30px,5vw,44px);margin:0}
h1 small{display:block;font-size:.45em;color:var(--muted);font-family:var(--body);font-weight:500}
.unit{background:var(--sheet);border:2px solid var(--grid);border-radius:20px;padding:18px 22px;display:flex;flex-direction:column;gap:14px}
.unit h2{margin:0;font-family:var(--display);font-size:26px;display:flex;align-items:center;gap:12px}
.unit h2 span{font-size:22px;color:#fff;background:var(--qnum);border-radius:10px;padding:0 12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
a.card{display:flex;align-items:center;gap:14px;min-height:96px;padding:14px 18px;border-radius:16px;text-decoration:none;color:var(--ink);
  background:var(--chip);border:2px solid transparent;font:700 24px var(--display)}
a.card:hover,a.card:focus-visible{border-color:var(--blue);outline:none}
a.card .ic{flex:none;width:56px;height:56px;border-radius:12px;display:grid;place-items:center;background:var(--sheet)}
a.card small{display:block;font:500 16px var(--body);color:var(--muted)}
.teacher{font-size:16px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}
.teacher a{color:var(--blue)}
</style>
</head>
<body>
<div class="wrap">
  <h1>第六單元　面積<small>點一下就可以開始</small></h1>

  <section class="unit">
    <h2><span>6-1</span>認識平方公分</h2>
    <div class="cards">
      <a class="card" href="../math6-1/"><span class="ic"><svg width="36" height="36" viewBox="0 0 36 36"><rect x="4" y="4" width="28" height="28" fill="#fff" stroke="#3d8bd4" stroke-width="3"/><text x="18" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">cm²</text></svg></span><span>課本互動教學<small>跟著課本一題一題操作</small></span></a>
      <a class="card" href="../math6-1/practice.html"><span class="ic"><svg width="36" height="36" viewBox="0 0 36 36"><rect x="4" y="8" width="12" height="12" fill="#fff" stroke="#3d8bd4" stroke-width="2.5"/><rect x="16" y="8" width="12" height="12" fill="#fff" stroke="#3d8bd4" stroke-width="2.5"/><rect x="4" y="20" width="12" height="12" fill="#ffd95a" stroke="#3d8bd4" stroke-width="2.5"/></svg></span><span>類題練習<small>排方瓦、量面積</small></span></a>
    </div>
    <div class="teacher">老師用：<a href="../math6-1/stats.html">6-1 類題作答統計</a></div>
  </section>

  <section class="unit">
    <h2><span>6-2</span>切割拼湊算面積</h2>
    <div class="cards">
      <a class="card" href="../math6-2/practice.html"><span class="ic"><svg width="36" height="36" viewBox="0 0 36 36"><polygon points="4,30 18,30 18,16" fill="#bfe3a0" stroke="#3d8bd4" stroke-width="2.5"/><polygon points="18,30 32,30 18,16" fill="#8fbf6a" stroke="#3d8bd4" stroke-width="2.5"/><rect x="18" y="4" width="12" height="12" fill="none" stroke="#f26b3a" stroke-width="2.5" stroke-dasharray="3 2"/></svg></span><span>類題練習<small>半格拼整格、方格點</small></span></a>
    </div>
    <div class="teacher">老師用：<a href="../math6-2/stats.html">6-2 類題作答統計</a></div>
  </section>
</div>
</body>
</html>
