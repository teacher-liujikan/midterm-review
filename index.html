<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>段考複習遊戲大廳｜115 學年度期中評量</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E4F3FB; --cell:#FFFFFF; --ink:#1F2A44; --muted:#5A6680;
  --ch:#F28B9B; --en:#5DADE2; --ma:#F5C542; --sc:#7DC67A; --so:#B39DDB;
  --display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#14202B; --cell:#243241; --ink:#EAF0F8; --muted:#A9B6C8; }
}
:root[data-theme="dark"]{ --bg:#14202B; --cell:#243241; --ink:#EAF0F8; --muted:#A9B6C8; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.6;
  background-image:radial-gradient(circle at 1px 1px, rgba(31,42,68,.08) 1px, transparent 0);background-size:22px 22px}
main{max-width:900px;margin:0 auto;padding:20px 14px 40px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,44px);margin:0;line-height:1.2}
.sub{margin:4px 0 6px;color:var(--muted)}
.count{display:inline-block;font-family:var(--display);background:var(--cell);border:2px solid var(--ink);border-radius:999px;padding:2px 14px;margin-bottom:22px}
.count b{font-size:1.4em;color:#E0413A;margin:0 2px}
.lead{margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.subj{background:var(--cell);border:2px solid var(--ink);border-radius:14px;overflow:hidden}
.subj header{background:var(--c);color:#1F2A44;font-family:var(--display);font-size:22px;padding:8px 18px;border-bottom:2px solid var(--ink)}
.subj header small{font-family:var(--body);font-size:14px;margin-left:8px;font-weight:500}
.subj .scope{margin:12px 16px 0;font-size:14px;color:var(--muted)}
.games{list-style:none;margin:0;padding:12px 16px 16px;display:grid;gap:10px}
.games a{display:flex;align-items:center;gap:10px;padding:12px 16px;border:2px solid var(--ink);border-radius:10px;
  color:var(--ink);text-decoration:none;font-weight:700;font-size:17px;background:color-mix(in srgb,var(--c) 22%,var(--cell))}
.games a:hover{background:color-mix(in srgb,var(--c) 45%,var(--cell))}
.games a:focus-visible{outline:3px solid #3E7BD6;outline-offset:2px}
.empty{margin:12px 16px 16px;padding:14px;border:2px dashed var(--muted);border-radius:10px;color:var(--muted);text-align:center}
.top{position:relative;padding-right:100px}
.qr-thumb{position:absolute;top:0;right:0;width:84px;padding:6px 6px 2px;background:#fff;border:2px solid var(--ink);border-radius:12px;
  cursor:zoom-in;font:inherit;color:#1F2A44;text-align:center;box-shadow:0 3px 0 var(--ink)}
.qr-thumb:focus-visible{outline:3px solid #3E7BD6;outline-offset:3px}
.qr-thumb .qr img,.qr-thumb .qr canvas{width:100%!important;height:auto!important;display:block}
.qr-thumb span{display:block;font-size:11px;font-weight:700;line-height:1.6}
.qr-overlay{position:fixed;inset:0;z-index:50;background:rgba(20,30,45,.75);display:none;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.qr-overlay.open{display:flex}
.qr-big{background:#fff;color:#1F2A44;border:3px solid #1F2A44;border-radius:20px;padding:24px;text-align:center;width:min(90vw,460px)}
.qr-big .qr img,.qr-big .qr canvas{width:100%!important;height:auto!important;display:block}
.qr-big h2{font-family:var(--display);font-weight:400;font-size:clamp(22px,5vw,32px);margin:0 0 12px}
.qr-big p{margin:12px 0 0;font-size:14px;word-break:break-all;color:#5A6680}
@media (max-width:480px){.top{padding-right:86px}.qr-thumb{width:72px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<main>
  <div class="top">
    <h1>段考複習遊戲大廳</h1>
    <p class="sub">115 學年度期中定期評量　11/5（四）、11/6（五）</p>
    <div class="count" id="count"></div>
    <button class="qr-thumb" id="qrThumb" aria-label="放大 QR Code"><div class="qr" id="qrSmall"></div><span>掃我進來</span></button>
  </div>
  <p class="lead">所有複習遊戲都在這裡，點一下就能開始玩</p>
  <div class="grid" id="grid"></div>
</main>
<div class="qr-overlay" id="qrOverlay" role="dialog" aria-modal="true" aria-label="QR Code">
  <div class="qr-big"><h2>掃描進入遊戲大廳</h2><div class="qr" id="qrBig"></div><p id="qrUrl"></p></div>
</div>
<script>
const SUBJ = [
  {name:"國語", pub:"南一", color:"var(--ch)", scope:"第一課～第六課＋語文天地一、二",
   games:[{name:"成語練功房", url:"https://teacher-liujikan.github.io/idiompractice/", icon:"📜"}]},
  {name:"英語", pub:"康軒", color:"var(--en)", scope:"Classroom English (P8)～Review 1 (P46)",
   games:[{name:"英文拼字遊戲", url:"https://teacher-liujikan.github.io/spellgame/", icon:"🔤"}]},
  {name:"數學", pub:"康軒", color:"var(--ma)", scope:"單元一～單元 5-2",
   games:[{name:"公分毫米換算", url:"https://teacher-liujikan.github.io/cm-mm/", icon:"📏"},
          {name:"數線估算練習", url:"https://teacher-liujikan.github.io/number-line-rounding/", icon:"🎯"}]},
  {name:"自然", pub:"康軒", color:"var(--sc)", scope:"單元一、單元二", games:[]},
  {name:"社會", pub:"南一", color:"var(--so)", scope:"單元一、單元二", games:[]}
];
const grid = document.getElementById("grid");
SUBJ.forEach(S=>{
  const d = document.createElement("section"); d.className="subj"; d.style.setProperty("--c",S.color);
  d.innerHTML = `<header>${S.name}<small>${S.games.length} 個遊戲</small></header>
    <p class="scope">範圍：${S.scope}（${S.pub}版）</p>` + (S.games.length
    ? `<ul class="games">${S.games.map(g=>`<li><a href="${g.url}" target="_blank" rel="noopener">${g.icon} ${g.name}</a></li>`).join("")}</ul>`
    : `<p class="empty">遊戲準備中</p>`);
  grid.appendChild(d);
});
/* QR Code：留空會自動使用目前網頁的網址；也可以填入固定網址 */
const PAGE_URL = "";
(function(){
  const url = PAGE_URL || location.href.split("#")[0];
  document.getElementById("qrUrl").textContent = url;
  if(typeof QRCode === "undefined"){ document.getElementById("qrThumb").style.display="none"; return; }
  new QRCode(document.getElementById("qrSmall"), {text:url, width:160, height:160, correctLevel:QRCode.CorrectLevel.M});
  new QRCode(document.getElementById("qrBig"), {text:url, width:512, height:512, correctLevel:QRCode.CorrectLevel.M});
  const ov = document.getElementById("qrOverlay"), th = document.getElementById("qrThumb");
  th.onclick = ()=>ov.classList.add("open");
  ov.onclick = ()=>{ ov.classList.remove("open"); th.focus(); };
  document.addEventListener("keydown", e=>{ if(e.key==="Escape") ov.classList.remove("open"); });
})();
(function(){
  const exam = new Date(2026,10,5), t = new Date(); t.setHours(0,0,0,0);
  const d = Math.round((exam - t)/864e5), el = document.getElementById("count");
  el.innerHTML = d>0 ? `距離段考還有<b>${d}</b>天` : d===0 ? "今天段考，加油！" : (d===-1 ? "段考第二天，加油！" : "段考結束，辛苦了！");
})();
</script>
</body>
</html>
