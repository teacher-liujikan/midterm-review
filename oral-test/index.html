:root{
  --bg:#EAF0FA; --dot:rgba(36,58,110,.07);
  --paper:#FFFFFF; --ink:#1F2A4A; --muted:#5D6886; --line:#D3DCEE; --rule:#C9D6EE;
  --tag:#E0473A; --tag-d:#B5352A;
  --sun:#FFC83D; --sun-d:#D69800; --sun-soft:#FFF1C7;
  --leaf:#2FA864; --leaf-d:#22844A; --leaf-soft:#E2F5EA;
  --sky:#E6EEFB;
  --kai:"EduKaiSub","TW-MOE-Std-Kai","BiauKai","DFKai-SB","Kaiti TC","KaiTi",serif;
  --round:"Nunito",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131B30; --dot:rgba(255,255,255,.05);
  --paper:#1E2843; --ink:#EEF2FF; --muted:#A9B4D3; --line:#34436B; --rule:#2F3D63;
  --sun-soft:#4A3D17; --leaf-soft:#173B29; --sky:#26335A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131B30; --dot:rgba(255,255,255,.05);
  --paper:#1E2843; --ink:#EEF2FF; --muted:#A9B4D3; --line:#34436B; --rule:#2F3D63;
  --sun-soft:#4A3D17; --leaf-soft:#173B29; --sky:#26335A; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);background-image:radial-gradient(var(--dot) 2px,transparent 2.5px);background-size:24px 24px;
  color:var(--ink);font-family:var(--kai);font-size:18px;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}

/* name tag */
.tag{background:var(--tag);border-radius:22px;overflow:hidden;box-shadow:0 8px 0 var(--tag-d);max-width:520px;width:100%;justify-self:center}
.tag-top{color:#fff;text-align:center;padding:14px 12px 10px}
.tag-top .hello{font:900 clamp(36px,10vw,54px)/1 var(--round);letter-spacing:4px}
.tag-top .mni{font:800 20px var(--round);opacity:.95;margin-top:2px}
.tag-name{background:#fff;color:#1F2A4A;margin:0 12px;border-radius:12px 12px 0 0;min-height:96px;display:grid;place-items:center;padding:10px;font-size:clamp(34px,9vw,48px)}
.tag-name .empty{font:700 20px var(--kai);color:#8A93AE}
.tag-foot{height:14px}

/* steps */
.steps{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.step{border:3px solid var(--line);background:var(--paper);border-radius:16px;padding:12px 10px;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.step b{font:900 18px var(--round);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--sky)}
.step.on{border-color:var(--tag);background:var(--tag);color:#fff}
.step.on b{background:#fff;color:var(--tag)}
.step:disabled{opacity:.45;cursor:not-allowed}

.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar .lbl{font-size:18px;color:var(--muted)}
.meter{flex:1;min-width:140px;height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--leaf);border-radius:99px;transition:width .3s}
.count{font:900 18px var(--round);font-variant-numeric:tabular-nums}

/* fill cards */
.cards{display:grid;gap:14px}
.qc{background:var(--paper);border-radius:20px;padding:16px;border:3px solid transparent;display:grid;gap:10px}
.qc.done{border-color:var(--leaf)}
.qhead{display:flex;align-items:center;gap:10px}
.qnum{font:900 16px var(--round);width:30px;height:30px;border-radius:50%;background:var(--sky);display:grid;place-items:center;flex:none}
.qc.done .qnum{background:var(--leaf);color:#fff}
.qzh{font-size:19px;color:var(--muted)}
.qen{font-size:clamp(26px,6.4vw,34px);line-height:1.9;display:flex;flex-wrap:wrap;align-items:center;column-gap:.32em}
.slot{display:inline-flex;align-items:center;min-width:3.2em;min-height:1.5em;border-bottom:4px solid var(--tag);padding:0 .15em;justify-content:center}
.slot.filled{background:var(--sun-soft);border-color:var(--sun-d);border-radius:8px 8px 0 0}
.slot .q{font:900 .7em var(--round);color:var(--tag)}
.qask{font-size:17px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;display:flex;align-items:center;gap:6px;min-height:44px}
.chip small{font-size:15px;color:var(--muted)}
.chip.on{background:var(--sun);border-color:var(--sun-d);color:#1F2A4A}
.chip.on small{color:#1F2A4A}
.chip .ink{height:1.35em}
.own{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.own input{font:800 20px var(--round);border:3px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--sky);flex:1;min-width:0;max-width:340px}
.own input:focus{border-color:var(--sun);outline:none}
.own .err{color:var(--tag);font-size:15px;font-weight:700;flex-basis:100%}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;font-size:18px;background:var(--sky);color:var(--ink);box-shadow:0 4px 0 var(--line);display:inline-flex;align-items:center;gap:6px;min-height:48px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.go{background:var(--leaf);color:#fff;box-shadow:0 5px 0 var(--leaf-d)}
.btn.red{background:var(--tag);color:#fff;box-shadow:0 5px 0 var(--tag-d)}
.btn.big{font-size:22px;padding:14px 24px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.center{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.hint{font-size:16px;color:var(--muted);text-align:center}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:16px;padding:6px}

/* read view */
.ctrl{background:var(--paper);border-radius:20px;padding:14px;display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--sky);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:10px;padding:8px 14px;font-weight:700;font-size:17px;min-height:40px}
.seg button.on{background:var(--sun);color:#1F2A4A}
.tog{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px;background:var(--paper);font-size:17px;font-weight:700;min-height:44px}
.tog i{width:40px;height:24px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.tog i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.tog[aria-pressed="true"] i{background:var(--leaf)}
.tog[aria-pressed="true"] i::after{left:19px}

.essay{background:var(--paper);border-radius:6px 22px 22px 6px;box-shadow:0 8px 0 rgba(0,0,0,.08);padding:22px 18px 26px 30px;position:relative;
  border-left:6px solid var(--tag)}
.essay h2{margin:0 0 6px;font-size:clamp(28px,7vw,36px);text-align:center;font-weight:400}
.essay .by{text-align:center;color:var(--muted);font-size:16px;margin-bottom:10px}
.sent{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:12px;padding:6px 8px;margin:2px 0;position:relative}
.sent .en{font-size:clamp(25px,6.2vw,33px);line-height:1.95;display:flex;flex-wrap:wrap;column-gap:.3em;align-items:center}
.sent .zh{font-size:18px;color:var(--muted);padding-left:2px}
.sent:hover{background:var(--sky)}
.sent.now{background:var(--sun-soft)}
.sent.turn{background:var(--leaf-soft)}
.sent .mine{background:var(--sun-soft);border-radius:6px;padding:0 .1em}
.sent.now .mine{background:var(--sun)}
.sent .badge{position:absolute;right:8px;top:-12px;background:var(--leaf);color:#fff;border-radius:999px;padding:3px 12px;font-size:16px;font-weight:700}
.hidezh .zh{display:none}
.blur .sent .en{filter:blur(9px);transition:filter .2s}
.blur .sent.peek .en{filter:none}
.ink{height:1.5em;width:auto;display:inline-block;vertical-align:middle;overflow:visible;flex:none}
.word{display:inline-flex;align-items:center;flex:none}
.nb{display:inline-flex;align-items:center;column-gap:.06em}
.slot,.mine,.ws{display:inline-flex;flex-wrap:wrap;align-items:center;column-gap:.3em}

@media (max-width:420px){.essay{padding-left:20px}.steps .step{font-size:17px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <div class="tag" aria-label="名牌">
    <div class="tag-top"><div class="hello">HELLO</div><div class="mni">my name is</div></div>
    <div class="tag-name" id="tagName"></div>
    <div class="tag-foot"></div>
  </div>

  <div class="steps">
    <button class="step on" id="tabFill"><b>1</b>填空寫文章</button>
    <button class="step" id="tabRead" disabled><b>2</b>聽讀練習</button>
  </div>

  <section id="fill" class="cards">
    <div class="bar"><span class="lbl">完成進度</span><div class="meter"><i id="meter"></i></div><span class="count" id="count"></span></div>
    <div class="cards" id="cards"></div>
    <div class="center"><button class="btn big go" id="finish" disabled>完成文章，去聽讀練習 →</button></div>
    <p class="hint" id="finishHint"></p>
    <div class="center"><button class="linkbtn" id="sample">先看範例（會蓋掉目前填的內容）</button><button class="linkbtn" id="reset">全部清空重填</button></div>
    <p class="hint" id="resetConfirm" hidden></p>
  </section>

  <section id="read" class="cards" hidden>
    <div class="ctrl">
      <div class="row">
        <button class="btn red big" id="playAll">▶ 播放全文</button>
        <button class="btn" id="stop">⏹ 停止</button>
        <div class="seg" role="group" aria-label="速度"><button data-r="0.65">🐢 慢速</button><button data-r="0.9">正常</button></div>
      </div>
      <div class="row">
        <button class="tog" id="togZh" aria-pressed="true"><i></i>顯示中文</button>
        <button class="tog" id="togEcho" aria-pressed="false"><i></i>跟讀模式</button>
        <button class="tog" id="togBlur" aria-pressed="false"><i></i>背背看（遮住英文）</button>
      </div>
      <p class="hint" style="text-align:left;margin:0" id="modeHint">點任何一句就會唸那一句。</p>
    </div>
    <article class="essay" id="essay"></article>
    <div class="center"><button class="btn" id="back">✏️ 回去修改</button></div>
  </section>
</div>

<script>
/* ===== School-print letters on a 4-line grid (0 = top line, 1 = second line, 2 = red baseline, 3 = bottom line) ===== */
const LETTERS = {

"C":[1.2,"M1.02,.29 A.6,1 0 1 0 1.02,1.71"],

"Q":[1.35,"M1.3,1 A.65,1 0 1 1 0,1 A.65,1 0 1 1 1.3,1 M.8,1.5 L1.35,2.1"],

"S":[.92,"M.88,.35 C.75,-.05 .05,-.05 .05,.5 C.05,1 .9,.95 .9,1.5 C.9,2.1 .1,2.1 .02,1.62"],
"T":[1,"M0,0 L1,0 M.5,0 L.5,2"],
"U":[1,"M0,0 L0,1.5 A.5,.5 0 0 0 1,1.5 L1,0"],
"V":[1.1,"M0,0 L.55,2 L1.1,0"],
"W":[1.6,"M0,0 L.4,2 L.8,.6 L1.2,2 L1.6,0"],
"X":[1,"M0,0 L1,2 M1,0 L0,2"],
"Y":[1,"M0,0 L.5,1 L1,0 M.5,1 L.5,2"],

".":[.2,"M.1,1.98 L.1,2"],
",":[.25,"M.17,1.9 L.05,2.35"],
"!":[.2,"M.1,0 L.1,1.4 M.1,1.98 L.1,2"],
"?":[.8,"M.05,.4 C.1,-.1 .8,-.1 .78,.4 C.76,.8 .4,.85 .4,1.35 M.4,1.98 L.4,2"],
"'":[.2,"M.1,0 L.1,.45"],
"-":[.6,"M0,1.4 L.6,1.4"]
};
const GAP=.42, TIGHT=new Set(['.',',','!','?',"'"]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ink(word,cls){
  word=String(word); let x=0, parts='', prev=null;
  for(const c of word){
    if(prev!==null) x+= TIGHT.has(c)?0.18:GAP;
    const L=LETTERS[c];
    if(L) parts+=`<path transform="translate(${x.toFixed(2)},0)" d="${L[1]}"/>`;
    else parts+=`<text x="${(x+0.45).toFixed(2)}" y="2" font-size="2.3" text-anchor="middle" fill="currentColor" stroke="none" font-family="Nunito,sans-serif" font-weight="800">${esc(c)}</text>`;
    x+= L?L[0]:0.9; prev=c;
  }
  const W=x;
  return `<svg class="ink ${cls||''}" viewBox="-0.2 -0.15 ${(W+0.4).toFixed(2)} 3.3" style="aspect-ratio:${((W+0.4)/3.3).toFixed(3)}" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="0.22" stroke-linecap="round" stroke-linejoin="round">${parts}</g></svg>`;
}
function inkText(text,cls){ return text.split(/\s+/).filter(Boolean).map(w=>`<span class="word">${ink(w,cls)}</span>`).join(''); }

/* ===== The fixed essay ===== */
const Q = [
 {k:'greet', ask:'選一個打招呼的方式', zh:['','！'], en:['','!'],
  opts:[['Hi','嗨'],['Hello','哈囉']], noOwn:true},
 {k:'name', ask:'你的英文名字', zh:['我的名字是','。'], en:['My name is','.'], cap:true,
  opts:[]},
 {k:'gender', ask:'你是男生還是女生？', zh:['我是','。'], en:["I'm a",'.'],
  opts:[['boy','男生','👦'],['girl','女生','👧']], noOwn:true},
 {k:'age', ask:'你幾歲？', zh:['我','歲。'], en:["I'm",'.'],
  opts:[['seven','7'],['eight','8'],['nine','9'],['ten','10']], noOwn:true}
];
const SAMPLE={greet:'Hello',name:'Amy',gender:'girl',age:'nine'};

let A={};
try{ A=JSON.parse(localStorage.getItem('selfintro-v1')||'{}')||{}; }catch(e){ A={}; }
function save(){ try{ localStorage.setItem('selfintro-v1',JSON.stringify(A)); }catch(e){} }
const $=s=>document.querySelector(s);
const done=()=>Q.filter(q=>A[q.k]).length;

function zhFor(q){ const o=q.opts.find(o=>o[0]===A[q.k]); return o?o[1]:A[q.k]; }
function enSentence(q){ const b=q.en[1]; return `${q.en[0]} ${A[q.k]}${/^[A-Za-z]/.test(b)?' ':''}${b}`.trim(); }
/* keeps the filled-in word and any punctuation right after it together on one line */
function glue(b, inner){
  const t=b.split(' '); let punct='';
  if(t[0] && TIGHT.has(t[0][0])) punct=`<span class="word">${ink(t.shift())}</span>`;
  return `<span class="nb">${inner}${punct}</span>`+(t.length&&t[0]?inkText(t.join(' ')):'');
}
function clean(q,v){
  v=v.trim().replace(/\s+/g,' ');
  if(!v) return {err:''};
  if(!/^[A-Za-z][A-Za-z '\-]*$/.test(v)) return {err:'只能用英文字母和空格喔'};
  if(v.length>24) return {err:'太長了，最多 24 個字母'};
  v = q.cap ? v.split(' ').map(w=>w[0].toUpperCase()+w.slice(1)).join(' ') : v.toLowerCase();
  return {v};
}

/* ===== Fill view ===== */
function slotHTML(q){
  return A[q.k] ? `<span class="slot filled">${inkText(A[q.k])}</span>` : `<span class="slot"><span class="q">?</span></span>`;
}
function cardHTML(q,i){
  const filled=!!A[q.k], own = filled && !q.opts.some(o=>o[0]===A[q.k]);
  const [a,b]=q.en;
  const head=inkText(a);
  return `<div class="qc ${filled?'done':''}" data-k="${q.k}">
    <div class="qhead"><span class="qnum">${filled?'✓':i+1}</span><span class="qzh">${esc(q.zh[0])}＿＿${esc(q.zh[1])}</span></div>
    <div class="qen">${head}${glue(b,slotHTML(q))}</div>
    ${q.opts.length?`<div class="qask">${esc(q.ask)}：點一個</div>
    <div class="chips">${q.opts.map(o=>`<button class="chip ${A[q.k]===o[0]?'on':''}" data-v="${esc(o[0])}">${o[2]?`<span aria-hidden="true">${o[2]}</span>`:''}${ink(o[0])}<small>${esc(o[1])}</small></button>`).join('')}</div>`:''}
    ${q.noOwn?'':`<div class="own">
      <label class="qask" for="in-${q.k}">${q.opts.length?'或自己寫：':esc(q.ask)+'：'}</label>
      <input id="in-${q.k}" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="30" placeholder="${esc(q.ph||'')}" value="${own?esc(A[q.k]):''}">
      <button class="btn" data-ok>好了</button>
      <span class="err" hidden></span>
    </div>`}
  </div>`;
}
function renderTag(){
  $('#tagName').innerHTML = A.name ? `<span class="ws">${inkText(A.name)}</span>` : `<span class="empty">寫好名字會出現在這裡</span>`;
}
function renderProgress(){
  const n=done();
  $('#meter').style.width=(n/Q.length*100)+'%';
  $('#count').textContent=`${n} / ${Q.length}`;
  $('#finish').disabled = n<Q.length;
  $('#tabRead').disabled = n<Q.length;
  $('#finishHint').textContent = n<Q.length ? `還有 ${Q.length-n} 格沒填` : '全部填好了！';
  renderTag();
}
function renderCard(k){
  const i=Q.findIndex(q=>q.k===k);
  const el=document.querySelector(`.qc[data-k="${k}"]`);
  const tmp=document.createElement('div'); tmp.innerHTML=cardHTML(Q[i],i);
  const nu=tmp.firstElementChild; el.replaceWith(nu); bindCard(nu); renderProgress();
}
function bindCard(el){
  const q=Q.find(q=>q.k===el.dataset.k);
  el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
    A[q.k]=b.dataset.v; save(); say(enSentence(q)); renderCard(q.k);
  });
  const inp=el.querySelector('input'), err=el.querySelector('.err');
  if(!inp) return;
  const commit=()=>{
    const r=clean(q,inp.value);
    if(r.err!==undefined){ err.textContent=r.err||'先打字再按「好了」'; err.hidden=false; return; }
    A[q.k]=r.v; save(); say(enSentence(q)); renderCard(q.k);
  };
  el.querySelector('[data-ok]').onclick=commit;
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') commit(); });
  inp.addEventListener('input',()=>{ err.hidden=true; });
}
function renderFill(){
  $('#cards').innerHTML=Q.map(cardHTML).join('');
  document.querySelectorAll('.qc').forEach(bindCard);
  renderProgress();
}

/* ===== Speech ===== */
let rate=0.9;
try{ rate=+localStorage.getItem('selfintro-rate')||0.9; }catch(e){}
let voice=null;
function pickVoice(){ try{ const vs=speechSynthesis.getVoices(); voice=vs.find(v=>/^en[-_]US/i.test(v.lang)&&/samantha|google|female/i.test(v.name))||vs.find(v=>/^en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null; }catch(e){} }
try{ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }catch(e){}
let runId=0;
function speak(text){
  return new Promise(res=>{
    try{
      const u=new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=rate; if(voice) u.voice=voice;
      let t=setTimeout(res, 1500+text.length*140/rate);
      u.onend=u.onerror=()=>{ clearTimeout(t); res(); };
      speechSynthesis.speak(u);
    }catch(e){ res(); }
  });
}
function say(text){ stopAll(); speak(text); }
function stopAll(){ runId++; try{ speechSynthesis.cancel(); }catch(e){} clearMarks(); }
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* ===== Read view ===== */
let showZh=true, echo=false, blur=false;
function lines(){ return Q.map(q=>({en:enSentence(q), zh:q.zh[0]+zhFor(q)+q.zh[1], q})); }
function sentHTML(l,i){
  let en;
  if(l.q){
    const [a,b]=l.q.en;
    en = inkText(a) + glue(b,`<span class="mine">${inkText(A[l.q.k])}</span>`);
  } else en=inkText(l.en);
  return `<button class="sent" data-i="${i}" aria-label="${esc(l.en)}"><span class="en">${en}</span><span class="zh">${esc(l.zh)}</span></button>`;
}
function renderRead(){
  const L=lines();
  $('#essay').innerHTML = `<h2><span class="ws">${inkText('About Me')}</span></h2><div class="by">我的英文自我介紹</div>${L.map(sentHTML).join('')}`;
  $('#essay').classList.toggle('hidezh',!showZh);
  $('#essay').classList.toggle('blur',blur);
  document.querySelectorAll('.sent').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;
    if(blur && !b.classList.contains('peek')){ b.classList.add('peek'); }
    playFrom(i,true);
  });
  document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',+b.dataset.r===rate));
}
function clearMarks(){ document.querySelectorAll('.sent').forEach(s=>{ s.classList.remove('now','turn'); const b=s.querySelector('.badge'); if(b) b.remove(); }); }
async function playFrom(start,onlyOne){
  stopAll(); const id=runId; const L=lines();
  const end = onlyOne ? start+1 : L.length;
  for(let i=start;i<end;i++){
    if(id!==runId) return;
    const el=document.querySelector(`.sent[data-i="${i}"]`);
    clearMarks(); el.classList.add('now');
    el.scrollIntoView({block:'nearest',behavior:'smooth'});
    const t0=Date.now();
    await speak(L[i].en);
    if(id!==runId) return;
    if(echo){
      el.classList.remove('now'); el.classList.add('turn');
      el.insertAdjacentHTML('beforeend','<span class="badge">換你唸！</span>');
      await wait(Math.max(1800,(Date.now()-t0)*1.4));
      if(id!==runId) return;
    }else await wait(350);
  }
  if(id===runId) clearMarks();
}
function setTog(el,v){ el.setAttribute('aria-pressed',v); }
$('#togZh').onclick=()=>{ showZh=!showZh; setTog($('#togZh'),showZh); $('#essay').classList.toggle('hidezh',!showZh); };
$('#togEcho').onclick=()=>{ echo=!echo; setTog($('#togEcho'),echo); updHint(); };
$('#togBlur').onclick=()=>{ blur=!blur; setTog($('#togBlur'),blur); document.querySelectorAll('.sent').forEach(s=>s.classList.remove('peek')); $('#essay').classList.toggle('blur',blur); updHint(); };
function updHint(){
  $('#modeHint').textContent = blur ? '英文被遮住了，看中文試著唸出來。想不起來就點那一句，會打開並唸給你聽。'
    : echo ? '跟讀模式：每唸完一句會停下來，換你大聲唸一次。' : '點任何一句就會唸那一句。';
}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ rate=+b.dataset.r; try{localStorage.setItem('selfintro-rate',rate)}catch(e){} renderRead(); });
$('#playAll').onclick=()=>playFrom(0,false);
$('#stop').onclick=stopAll;

/* ===== Navigation ===== */
function show(view){
  stopAll();
  $('#fill').hidden = view!=='fill'; $('#read').hidden = view!=='read';
  $('#tabFill').classList.toggle('on',view==='fill'); $('#tabRead').classList.toggle('on',view==='read');
  if(view==='read') renderRead();
  window.scrollTo({top:0,behavior:'smooth'});
}
$('#tabFill').onclick=()=>show('fill');
$('#tabRead').onclick=()=>{ if(done()===Q.length) show('read'); };
$('#finish').onclick=()=>show('read');
$('#back').onclick=()=>show('fill');
$('#sample').onclick=()=>{ A={...SAMPLE}; save(); renderFill(); };
let armed=false;
$('#reset').onclick=()=>{
  if(!armed){ armed=true; $('#reset').textContent='再按一次確定清空'; setTimeout(()=>{ armed=false; $('#reset').textContent='全部清空重填'; },3000); return; }
  armed=false; $('#reset').textContent='全部清空重填'; A={}; save(); renderFill();
};

renderFill();
if(done()===Q.length) show('read');
</script>
