<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>魔法理髮店：語詞大改造</title>
<link rel="stylesheet" href="../fonts/bpmf/bpmf.css">
<style>
@font-face{font-family:"EduKai";src:url("https://teacher-liujikan.github.io/idiompractice/fonts/edukai-4.0.ttf") format("truetype");font-display:swap}
:root{
  --bg:#fbf4ea; --paper:#fffdf8; --ink:#2d2420; --muted:#86766a; --line:#eadccb;
  --pole-r:#d8443a; --pole-b:#2f6fb5;
  --ok:#2e9a5c; --no:#d8443a; --gold:#e6a817;
  --kai:"Bpmf Zihi Kai Std","EduKai","BiauKai","DFKai-SB","Kaiti TC",serif;
  --sans:"Bpmf Zihi Kai Std","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow-x:hidden}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--pole-b);outline-offset:3px}
.app{height:100vh;min-height:560px;display:flex;flex-direction:column;gap:1.2vh;padding:1.6vh 2vw}
/* 頂部：理髮店招牌 */
.sign{display:flex;align-items:center;gap:14px;flex:0 0 auto}
.pole{width:22px;height:64px;border-radius:11px;border:3px solid var(--ink);background:repeating-linear-gradient(135deg,var(--pole-r) 0 8px,#fff 8px 16px,var(--pole-b) 16px 24px,#fff 24px 32px);background-size:100% 45px;animation:spin 1.6s linear infinite;flex:0 0 auto}
@keyframes spin{to{background-position:0 45px}}
.sign h1{font-family:var(--kai);font-size:clamp(24px,min(3vw,5.5vh),44px);line-height:1.2;margin:0;letter-spacing:.06em}
.sign .prog{margin-left:auto;font-size:clamp(16px,1.6vw,22px);color:var(--muted);font-variant-numeric:tabular-nums}
/* 題目區 */
.qbox{background:var(--paper);border:3px solid var(--ink);border-radius:22px;padding:1.6vh 2.4vw;display:flex;flex-direction:column;gap:1.4vh;flex:0 0 auto}
.qtag{font-size:clamp(14px,1.4vw,20px);color:var(--muted);font-weight:700;letter-spacing:.1em}
.qtag.bonus{color:var(--gold)}
.qtag.turn{align-self:flex-start;display:inline-flex;align-items:center;gap:.4em;background:var(--c);color:#fff;font-size:clamp(24px,min(2.8vw,5vh),44px);letter-spacing:.04em;padding:.25em .9em;border-radius:999px;box-shadow:0 4px 0 rgba(0,0,0,.15);animation:turnIn .5s ease-out}
.qtag.turn b{font-size:1.2em;background:#fff;color:var(--c);border-radius:.4em;padding:0 .3em;margin:0 .1em}
.qtag.turn .gi{width:1.3em;height:1.3em}
.qtag .bn{color:#fff;opacity:.9;font-size:.8em}
.who-line{display:flex;flex-wrap:wrap;gap:.5em 1em;font-size:clamp(20px,min(2.2vw,4vh),36px)}.who-line span{color:var(--c);font-weight:700}.who-line b{font-size:1.25em}
@keyframes turnIn{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.06)}100%{transform:none;opacity:1}}
.sent{font-family:var(--kai);font-size:clamp(28px,3.8vw,58px);line-height:1.4}
.blank{display:inline-block;min-width:3.4em;border-bottom:5px solid var(--ink);text-align:center;margin:0 .15em}
.blank.fill{color:var(--ok)}
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.4vw}
.opt{font-family:var(--kai);font-size:clamp(28px,3.6vw,54px);background:#fff;border:3px solid var(--ink);border-radius:18px;padding:1.4vh .6vw;color:var(--ink);transition:transform .15s}
.opt:hover:not(:disabled){transform:translateY(-3px)}
.opt.no{background:#fde4e1;border-color:var(--no);color:var(--no);text-decoration:line-through;animation:shake .4s}
.opt.ok{background:#dff3e7;border-color:var(--ok);color:var(--ok)}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;min-height:56px}
.msg{font-size:clamp(18px,2vw,28px);font-weight:700}
.msg.ok{color:var(--ok)} .msg.no{color:var(--no)}
.btn{border:3px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:14px;padding:10px 20px;font-size:clamp(16px,1.6vw,22px);font-weight:700}
.btn.ghost{background:transparent;color:var(--ink)}
.who{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.who .btn{background:var(--c);border-color:var(--c)}
/* 客人 */
.shop{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:1.4vw;flex:1;min-height:0}
.chair{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:1vh .8vw;display:flex;flex-direction:column;align-items:center;gap:.4vh;position:relative}
.chair.lead{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold) inset}
.chair h2{margin:0;font-size:clamp(18px,1.9vw,28px);color:var(--c)}
.chair .sc{font-size:clamp(16px,1.6vw,22px);font-weight:700;font-variant-numeric:tabular-nums}
.chair svg.guest{width:100%;max-width:240px;flex:1 1 0;min-height:0}
.chair{min-height:0;overflow:hidden}
.cover .shop{flex:0 0 auto;height:32vh}
.strand{transition:opacity .5s,transform .5s;transform-box:fill-box;transform-origin:50% 100%}
.strand.cut{opacity:0;transform:translateY(40px) rotate(25deg)}
.scis{position:absolute;top:18%;left:50%;width:64px;height:64px;transform:translate(-50%,0);pointer-events:none;opacity:0}
.scis.go{animation:snip 0.9s ease-out}
@keyframes snip{0%{opacity:1;transform:translate(-90%,0) rotate(-20deg)}50%{opacity:1;transform:translate(-30%,-10%) rotate(10deg)}100%{opacity:0;transform:translate(30%,0) rotate(-10deg)}}
.crown{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:44px;display:none}
.chair.win .crown{display:block}
/* 開始 / 結束畫面 */
.cover{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:1.4vh;text-align:center}
.cover>h2{font-family:var(--kai);font-size:clamp(28px,min(3.6vw,6vh),56px);margin:0;line-height:1.25}
.cover p{font-size:clamp(16px,min(1.6vw,2.8vh),24px);color:var(--muted);margin:0;line-height:1.7;max-width:44em}
.set{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:clamp(16px,min(1.6vw,2.8vh),24px)}
.set .seg{border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:12px;padding:8px 16px;font-weight:700}
.set .seg[aria-pressed="true"]{background:var(--ink);color:#fff}
.foot{font-size:12px;color:var(--muted);text-align:right}
@media (max-width:760px){.opts{grid-template-columns:repeat(2,minmax(0,1fr))}.shop{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){.pole,.scis.go,.opt.no{animation:none}.strand{transition:none}}
.gi{width:1.15em;height:1.15em;vertical-align:-.2em;display:inline-block}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
// ===== 題目 =====
const WORDS = [
  ['理髮店', '我的頭髮太長了，下課後要去巷口的＿＿剪頭髮。'],
  ['圍巾', '冬天出門好冷，記得󠇡圍上溫暖的＿＿。'],
  ['籃框', '他用力一󠇢投，球「咚」的一󠇢聲打到＿＿，又彈了出來。'],
  ['近視眼', '哥哥󠇡開玩笑說：「一󠇡定是那顆球有＿＿，才沒有進。」'],
  ['失誤', '比賽時一󠇡個󠇡小＿＿，讓我們輸了一󠇢分。'],
  ['愉快', '祝你週末＿＿，玩得󠇡開開心心！'],
  ['全數', '掃地時間，我們把地上的紙屑＿＿撿起來。'],
  ['垃圾桶', '吃完的餅乾袋，要丟進＿＿裡。'],
  ['剪刀', '美勞課要剪紙，記得󠇡帶一󠇢把＿＿。'],
  ['曾經', '我＿＿在海邊看過美麗的日出。'],
  ['機會', '這次輸了沒關係󠇡，下次還有＿＿！'],
  ['鏡子󠇡', '出門前，姊姊󠇡站在＿＿前整理頭髮。'],
  ['整齊', '大家把鞋子󠇡排得󠇡好＿＿，老師誇我們很棒。']
];
const IDIOMS = [
  ['一󠇡視同仁', '老師對每個󠇡同學都＿＿，從來不偏心。'],
  ['牛刀小試', '剛學會游泳的他，先在淺水區＿＿，游了一󠇢小段。'],
  ['當機立斷', '看到冒煙，他＿＿，馬上打電話叫消防車。'],
  ['參󠇢差󠇢不齊', '剛長󠇡出來的頭髮長長短短，＿＿的。']
];
const COLORS = ['#d8443a', '#2f6fb5', '#2e9a5c', '#9b59b6'];
// 各組（異質分組）裡的四種同學：剪刀、梳子󠇡、吹風機、魔鏡
const LCOLORS = ['#d2553f', '#c4870f', '#3c9a6a', '#5468c9'];
const LNAMES = ['剪刀', '梳子󠇡', '吹風機', '魔鏡'];
// 異質分組：每組都有剪刀、梳子󠇡、吹風機、魔鏡各一󠇡位同學
// 教師端「分組」排好的第 1～4 組名單（同一󠇢台電腦開過教師端才會有）
function homeNow() { try { const h = JSON.parse(localStorage.getItem('l8-home-now') || 'null'); return h && h.groups ? h.groups : null; } catch (e) { return null; } }
function whoLine(g) {
  const hs = homeNow(); if (!hs || g < 0) return '';
  const role = 'ABCD'[g];
  return `<div class="who-line">${hs.map((m, i) => { const ps = m.filter(x => x.lv === role).map(x => x.seat);
    return `<span style="--c:${COLORS[i % COLORS.length]}">第 ${i + 1} 組 <b>${ps.length ? ps.join('、') + ' 號' : '任一󠇢人'}</b></span>`; }).join('')}</div>`;
}
const GNAMES = ['第 1 組', '第 2 組', '第 3 組', '第 4 組'];
// 組別圖示用畫的（有些電腦沒有梳子󠇡、鏡子󠇡的表情符號）
const SVGI = p => `<svg class="gi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const GICON = [
  SVGI('<circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M8 15 17 3M16 15 7 3"/>'),
  SVGI('<rect x="3" y="5" width="18" height="5" rx="2"/><path d="M5 10v8M8 10v8M11 10v8M14 10v8M17 10v8M20 10v6"/>'),
  SVGI('<path d="M3 6h11a4 4 0 0 1 0 8H8"/><path d="M8 14l-1 7h3l1-7"/><path d="M18 8h3M18 11h3"/>'),
  SVGI('<ellipse cx="12" cy="9" rx="6" ry="7"/><path d="M12 16v5M9 21h6"/><path d="M10 6.5l1.5 1.5"/>')
];
// 每題由各組的哪一󠇢種同學回答（-1 = 全班搶答）。剪刀最簡單、魔鏡最難；每種同學 4 題，最後 1 題全班搶答
const ASSIGN = { '剪刀': 0, '垃圾桶': 0, '鏡子󠇡': 0, '圍巾': 0,
  '理髮店': 1, '籃框': 1, '愉快': 1, '整齊': 1,
  '近視眼': 2, '失誤': 2, '機會': 2, '曾經': 2,
  '全數': 3, '一󠇡視同仁': 3, '牛刀小試': 3, '當機立斷': 3,
  '參󠇢差󠇢不齊': -1 };
const HAIR = ['#3b2a20', '#7a4a22', '#1f1f2e', '#a0522d', '#4a3426', '#2b2b2b'];
const SKIN = ['#f6d3b3', '#efc39d', '#f8dcc4', '#e8b88f', '#f3cfae', '#eebf98'];
const STRANDS = 5; // 亂髮撮數

let G = { n: 4, bonus: true, phase: 'start', qs: [], i: 0, score: [], tried: [], pick: null, solved: false };

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function buildQs() {
  const pool = [...WORDS.map(([w, s]) => ({ w, s, bonus: false })), ...IDIOMS.map(([w, s]) => ({ w, s, bonus: true }))];
  const all = { w: WORDS, i: IDIOMS };
  pool.forEach(q => { const src = q.bonus ? IDIOMS : WORDS; q.o = shuffle([q.w, ...shuffle(src.filter(x => x[0] !== q.w)).slice(0, 3).map(x => x[0])]); q.g = ASSIGN[q.w] ?? -1; });
  // 輪流：剪刀 → 梳子󠇡 → 吹風機 → 魔鏡，每組同一󠇢輪內順序打亂；最後全班搶答
  const by = [0, 1, 2, 3].map(g => shuffle(pool.filter(q => q.g === g)));
  const out = []; for (let r = 0; r < 4; r++) for (let g = 0; g < 4; g++) if (by[g][r]) out.push(by[g][r]);
  return [...out, ...pool.filter(q => q.g === -1)];
}
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ===== 音效（剪刀聲）=====
let AC = null;
function ac() { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} return AC; }
function snipSound() {
  const a = ac(); if (!a) return;
  [0, 0.16].forEach(t0 => {
    const len = 0.06, buf = a.createBuffer(1, a.sampleRate * len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    f.type = 'highpass'; f.frequency.value = 2500; g.gain.value = 0.6;
    s.buffer = buf; s.connect(f); f.connect(g); g.connect(a.destination); s.start(a.currentTime + t0);
  });
}
function tone(freqs, dur = 0.12) {
  const a = ac(); if (!a) return;
  freqs.forEach((fq, k) => { const o = a.createOscillator(), g = a.createGain(); o.type = 'triangle'; o.frequency.value = fq; g.gain.setValueAtTime(0.18, a.currentTime + k * dur); g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + (k + 1) * dur); o.connect(g); g.connect(a.destination); o.start(a.currentTime + k * dur); o.stop(a.currentTime + (k + 1) * dur); });
}

// ===== 客人 =====
// 亂髮：從頭頂往外亂翹的一󠇡撮一撮
const STRAND_D = [
  'M70 70 C55 40 40 30 22 18 C38 40 48 55 58 78Z',
  'M86 58 C82 25 75 10 66 -4 C78 18 86 35 96 60Z',
  'M104 54 C108 20 112 6 122 -8 C118 14 116 34 116 56Z',
  'M124 56 C138 28 150 16 168 6 C152 26 142 42 134 62Z',
  'M140 70 C162 52 176 46 196 44 C176 56 162 66 148 82Z'
];
function guestSVG(g, score) {
  const cut = Math.min(score, STRANDS);
  const extra = Math.max(0, score - STRANDS);
  const hair = HAIR[g % HAIR.length], skin = SKIN[g % SKIN.length], c = COLORS[g % COLORS.length];
  const neat = cut >= STRANDS;
  const smile = score >= 3 ? 'M86 150 Q100 166 114 150' : score >= 1 ? 'M88 154 Q100 160 112 154' : 'M88 158 Q100 152 112 158';
  return `<svg class="guest" viewBox="-10 -14 220 250" role="img" aria-label="${GNAMES[g]}的客人，剪掉 ${cut} 撮頭髮">
    <!-- 理髮披巾 -->
    <path d="M30 236 C34 196 62 180 100 180 C138 180 166 196 170 236Z" fill="${c}" opacity=".9"/>
    <path d="M84 182 L100 200 L116 182" fill="#fff" opacity=".8"/>
    <!-- 臉 -->
    <rect x="88" y="160" width="24" height="24" fill="${skin}"/>
    <ellipse cx="52" cy="122" rx="10" ry="14" fill="${skin}"/><ellipse cx="148" cy="122" rx="10" ry="14" fill="${skin}"/>
    <ellipse cx="100" cy="120" rx="48" ry="54" fill="${skin}"/>
    <!-- 整齊的底髮 -->
    <path d="M52 112 C50 70 72 52 100 52 C128 52 150 70 148 112 C140 92 124 82 100 82 C76 82 60 92 52 112Z" fill="${hair}"/>
    ${neat ? `<path d="M64 84 C80 70 104 66 132 78" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none" opacity=".35"/>` : ''}
    <!-- 眼睛、嘴巴󠇡 -->
    <ellipse cx="82" cy="122" rx="5" ry="${score >= 1 ? 5 : 2}" fill="#2d2420"/><ellipse cx="118" cy="122" rx="5" ry="${score >= 1 ? 5 : 2}" fill="#2d2420"/>
    <ellipse cx="72" cy="140" rx="7" ry="4" fill="#f19a8e" opacity="${score >= 2 ? .7 : 0}"/><ellipse cx="128" cy="140" rx="7" ry="4" fill="#f19a8e" opacity="${score >= 2 ? .7 : 0}"/>
    <path d="${smile}" stroke="#2d2420" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- 亂髮 -->
    ${STRAND_D.map((d, k) => `<path class="strand${k < cut ? ' cut' : ''}" data-k="${k}" d="${d}" fill="${hair}"/>`).join('')}
    <!-- 超過 7 題的加碼造型 -->
    ${extra >= 1 ? `<g fill="${'#e6a817'}"><path d="M30 40 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4z"/><path d="M172 30 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3z"/></g>` : ''}
    ${extra >= 2 ? `<path d="M88 196 L100 204 L112 196 L112 212 L100 204 L88 212Z" fill="#2d2420"/>` : ''}
    ${extra >= 3 ? `<g><rect x="66" y="112" width="28" height="18" rx="6" fill="#2d2420"/><rect x="106" y="112" width="28" height="18" rx="6" fill="#2d2420"/><path d="M94 118 H106" stroke="#2d2420" stroke-width="4"/></g>` : ''}
  </svg>`;
}
const SCIS = `<svg class="scis" viewBox="0 0 24 24" fill="none" stroke="#2d2420" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="18" r="3" fill="#fff"/><circle cx="18" cy="18" r="3" fill="#fff"/><path d="M8 16 17 3M16 16 7 3"/></svg>`;

// ===== 畫面 =====
function render() {
  const app = document.getElementById('app');
  if (G.phase === 'start') {
    app.innerHTML = `${sign('')}
    <section class="cover">
      <h2>今天店裡來了 ${G.n} 位頭髮亂糟糟的客人！</h2>
      <p>每一󠇢題選出正確的語詞。答對的組，就可以幫自己的客人剪掉一󠇡撮亂髮。<br>題目做完，看看哪一󠇢組的客人造型最帥！</p>
      <p>每一󠇢組都有剪刀、梳子󠇡、吹風機、魔鏡四位同學。每一󠇢題會指定由哪一󠇢種同學搶答，最後一󠇢題全班搶答！</p>
      <div class="shop" style="--n:${G.n};width:100%;max-width:1200px">${Array.from({ length: G.n }, (_, g) => chair(g, 0)).join('')}</div>
      <button class="btn" id="go">開店囉󠇢！</button>
    </section>${foot()}`;
    return;
  }
  if (G.phase === 'end') {
    const max = Math.max(...G.score);
    app.innerHTML = `${sign('')}
    <section class="cover">
      <h2>改造完成！</h2>
      <p>${G.score.filter(s => s === max).length > 1 ? '好幾組並列第一，造型都超帥！' : `${GNAMES[G.score.indexOf(max)]}的客人最帥！`}　大家都會用這 ${WORDS.length} 個󠇡語詞了嗎？</p>
      <div class="shop" style="--n:${G.n};width:100%">${G.score.map((s, g) => chair(g, s, s === max)).join('')}</div>
      <button class="btn ghost" id="again">再玩一󠇡次</button>
    </section>${foot()}`;
    return;
  }
  const q = G.qs[G.i];
  const lead = Math.max(...G.score);
  app.innerHTML = `${sign(`第 ${G.i + 1} / ${G.qs.length} 題`)}
  <section class="qbox">
    <div class="qtag turn" style="--c:${q.g >= 0 ? LCOLORS[q.g] : 'var(--ink)'}">${q.g >= 0 ? `${GICON[q.g]} 輪到各組的 <b>${LNAMES[q.g]}</b> 同學搶答` : '全班搶答！'}${q.bonus ? '　<span class="bn">★ 成語題</span>' : ''}</div>${whoLine(q.g)}
    <div class="sent">${esc(q.s).replace('＿＿', `<span class="blank ${G.solved ? 'fill' : ''}">${G.solved ? esc(q.w) : '　'}</span>`)}</div>
    <div class="opts">${q.o.map(w => `<button class="opt ${G.tried.includes(w) ? 'no' : ''} ${G.solved && w === q.w ? 'ok' : ''}" data-w="${esc(w)}" ${G.solved || G.tried.includes(w) ? 'disabled' : ''}>${esc(w)}</button>`).join('')}</div>
    <div class="bar">${barHTML(q)}</div>
  </section>
  <div class="shop" style="--n:${G.n}">${G.score.map((s, g) => chair(g, s, false, lead > 0 && s === lead)).join('')}</div>${foot()}`;
}
function barHTML(q) {
  if (G.solved && G.pick === null) return `<span class="msg ok">答對了！是哪一󠇢組答對的？</span>
    <div class="who">${G.score.map((_, g) => `<button class="btn" style="--c:${COLORS[g % COLORS.length]}" data-g="${g}">${GNAMES[g]}</button>`).join('')}
    <button class="btn ghost" data-g="-1">都沒有</button></div>`;
  if (G.solved) return `<span class="msg ok">${G.pick >= 0 ? `${GNAMES[G.pick]}的客人剪掉一󠇡撮頭髮！` : '答案是「' + esc(q.w) + '」'}</span>
    <button class="btn" id="next">${G.i + 1 < G.qs.length ? '下一󠇢題 →' : '看改造結果！'}</button>`;
  return `${G.tried.length ? (q.g >= 0 ? `<span class="msg no">不󠇡對喔！其他組的${LNAMES[q.g]}同學可以舉手搶答。</span>` : '<span class="msg no">不󠇡對喔！其他組可以舉手搶答。</span>') : (q.g >= 0 ? `<span class="msg">各組的${LNAMES[q.g]}同學先舉手的先回答，老師點選他說的語詞。</span>` : '<span class="msg">先舉手的組回答，老師點選他們說的語詞。</span>')}
    <button class="btn ghost" id="reveal">公布答案</button>`;
}
function chair(g, s, win = false, lead = false) {
  return `<div class="chair ${win ? 'win' : ''} ${lead ? 'lead' : ''}" style="--c:${COLORS[g % COLORS.length]}" data-chair="${g}">
    <span class="crown" aria-hidden="true">👑</span>
    <h2>${GNAMES[g]}</h2>${guestSVG(g, s)}${SCIS}<span class="sc">剪了 ${s} 刀</span></div>`;
}
const sign = prog => `<header class="sign"><span class="pole" aria-hidden="true"></span><h1>魔法理髮店：語詞大改造</h1><span class="prog">${prog}</span></header>`;
const foot = () => `<div class="foot">第八課〈魔「髮」哥哥󠇡〉語詞遊戲・© 范范老師（老師媽咪）設計</div>`;

// ===== 操作 =====
function award(g) {
  G.pick = g;
  if (g >= 0) {
      const before = G.score[g]; G.score[g]++;
      render();
      const ch = document.querySelector(`[data-chair="${g}"]`);
      // 先畫出還沒剪的樣子󠇡，再剪掉
      if (before < STRANDS) { const st = ch.querySelector(`.strand[data-k="${before}"]`); st && st.classList.remove('cut'); requestAnimationFrame(() => requestAnimationFrame(() => st && st.classList.add('cut'))); }
      const sc = ch.querySelector('.scis'); sc.classList.add('go'); snipSound();
    } else render();
}
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  ac();
  if (t.dataset.n) { G.n = +t.dataset.n; render(); return; }
  if (t.dataset.b) { G.bonus = t.dataset.b === '1'; render(); return; }
  if (t.id === 'go' || t.id === 'again') { G.qs = buildQs(); G.i = 0; G.score = Array(G.n).fill(0); G.tried = []; G.pick = null; G.solved = false; G.phase = 'play'; render(); return; }
  if (t.classList.contains('opt')) {
    const q = G.qs[G.i]; const w = t.dataset.w;
    if (w === q.w) { G.solved = true; tone([523, 659, 784]); } else { G.tried.push(w); tone([220, 180], 0.15); }
    render(); return;
  }
  if (t.id === 'reveal') { G.solved = true; G.pick = -1; render(); return; }
  if (t.dataset.g !== undefined) { award(+t.dataset.g); return; }
  if (t.id === 'next') {
    if (G.i + 1 < G.qs.length) { G.i++; G.tried = []; G.pick = null; G.solved = false; } else { G.phase = 'end'; tone([523, 659, 784, 1046], 0.16); }
    render(); return;
  }
});
render();
</script>
</body>
</html>
