<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>第八課 成語練功房</title>
<style>
/* 教育部標準楷書（中華民國教育部，CC BY-ND 3.0 TW）：依序使用裝置已安裝的字型、網站 fonts 資料夾內的原始字型檔 */
@font-face{
  font-family:"EduKai";
  src:local("TW-MOE-Std-Kai"),local("教育部標準楷書"),
      
      url("https://teacher-liujikan.github.io/idiompractice/fonts/edukai-4.0.ttf") format("truetype");
  font-display:swap;
}
:root{
  --paper:#F5F8F0; --card:#FFFFFF; --grid:#7DB58A; --grid-soft:#D6E9DA;
  --ink:#1F2D3A; --muted:#5A6A63; --red:#D2373B; --red-soft:#FCE6E4;
  --blue:#2A68AD; --blue-soft:#E3EEFA; --yellow:#FFE07A; --ok:#2E8B57; --ok-soft:#E1F3E8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#151D18; --card:#1F2922; --grid:#4F8C5E; --grid-soft:#2A3B2F;
    --ink:#ECF2EC; --muted:#A3B5AA; --red:#FF6F6A; --red-soft:#402424;
    --blue:#82B5F0; --blue-soft:#1F2F44; --yellow:#7A6620; --ok:#5CC98A; --ok-soft:#1E3A2A;
  }
}
:root[data-theme="dark"]{
  --paper:#151D18; --card:#1F2922; --grid:#4F8C5E; --grid-soft:#2A3B2F;
  --ink:#ECF2EC; --muted:#A3B5AA; --red:#FF6F6A; --red-soft:#402424;
  --blue:#82B5F0; --blue-soft:#1F2F44; --yellow:#7A6620; --ok:#5CC98A; --ok-soft:#1E3A2A;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;color:var(--ink);
  font-family:"EduKai","TW-MOE-Std-Kai","教育部標準楷書","DFKai-SB","BiauKai","標楷體",serif;
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid-soft) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-soft) 1px,transparent 1px);
  background-size:32px 32px;
  font-size:18px;line-height:1.6;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 48px}

/* 田字格 */
.tz{display:inline-flex;gap:0}
.tz span{
  width:var(--s,64px);height:var(--s,64px);display:inline-flex;align-items:center;justify-content:center;
  font-size:calc(var(--s,64px)*.68);font-weight:700;line-height:1;
  border:2px solid var(--grid);margin-left:-2px;background-color:var(--card);
  background-image:
    linear-gradient(to right,transparent calc(50% - .5px),var(--grid-soft) calc(50% - .5px),var(--grid-soft) calc(50% + .5px),transparent calc(50% + .5px)),
    linear-gradient(to bottom,transparent calc(50% - .5px),var(--grid-soft) calc(50% - .5px),var(--grid-soft) calc(50% + .5px),transparent calc(50% + .5px));
}
.tz span:first-child{margin-left:0}
.tz span.hole{color:var(--red);background-color:var(--red-soft)}
.tz span.filled{color:var(--blue)}

/* Home */
.hero{text-align:center;padding:12px 0 8px}
.hero .tz{--s:clamp(52px,14vw,84px)}
.hero p{margin:12px 0 0;color:var(--muted)}
.panel{background:var(--card);border:2px solid var(--grid);border-radius:18px;padding:18px;margin-top:22px}
.panel h2{margin:0 0 4px;font-size:22px}
.panel .hint{margin:0 0 14px;color:var(--muted);font-size:16px}
.lessons{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:620px){.lessons{grid-template-columns:repeat(6,1fr)}}
.lesson{
  border:2px solid var(--grid);background:var(--paper);border-radius:14px;padding:10px 6px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
.lesson b{font-size:22px}
.lesson small{color:var(--muted);font-size:14px}
.lesson[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.lesson[aria-pressed="true"] small{color:#fff;opacity:.9}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.pill{border:2px solid var(--grid);background:var(--paper);border-radius:999px;padding:6px 16px;font-size:16px}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.row .label{color:var(--muted);font-size:16px;margin-right:4px}
.srcrow{margin:0 0 6px}

.games{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:560px){.games{grid-template-columns:1fr 1fr}}
.game{
  display:flex;gap:14px;align-items:center;text-align:left;
  border:2px solid var(--grid);background:var(--paper);border-radius:16px;padding:14px;
  transition:transform .12s;
}
.game:active{transform:scale(.98)}
.game .ico{font-size:34px;width:56px;height:56px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--card);border-radius:14px;border:2px dashed var(--grid)}
.game b{display:block;font-size:20px}
.game small{color:var(--muted);font-size:15px;line-height:1.4;display:block}
.warn{color:var(--red);font-size:16px;min-height:1.6em;margin:8px 0 0}

.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.gr{border:2px solid var(--grid);background:var(--paper);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.gr b{font-size:clamp(18px,5vw,22px)}
.gr small{color:var(--muted);font-size:13px}
.gr[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.gr[aria-pressed="true"] small{color:#fff;opacity:.9}

.tz span,.choice,.tile,.mcard,.blank,.witem b,.qtext,.feedback p,.back-side p,.zy{font-synthesis:none;font-synthesis-weight:none}
.tz span,.choice,.tile,.mcard.idiom,.witem b{font-weight:400}
.pron{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:8px 0 4px}
.tagmoe{display:inline-block;font-size:14px;color:#fff;background:var(--ok);border-radius:8px;padding:0 8px}
.zy{font-size:clamp(17px,4.6vw,21px);color:var(--ink)}
a.moe{font-size:15px;color:var(--blue);text-underline-offset:3px}
.zy-s{font-size:16px;color:var(--ink);letter-spacing:.05em}
.bian{font-size:15px;color:var(--muted);margin:0 0 4px}
a.moe{display:inline-block;margin:0 0 6px}
.sy{white-space:nowrap;display:inline-block;margin-right:.4em}
.bar h2{font-size:clamp(18px,4.8vw,22px)}

/* Game screen */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.back{border:2px solid var(--grid);background:var(--card);border-radius:12px;padding:6px 14px;font-size:16px}
.bar h2{margin:0;font-size:22px;flex:1}
.score{font-size:16px;color:var(--muted)}
.score b{color:var(--red);font-size:20px}
.progress{height:10px;background:var(--card);border:2px solid var(--grid);border-radius:999px;overflow:hidden;margin:12px 0 18px}
.progress i{display:block;height:100%;background:var(--grid);width:0;transition:width .3s}

.qcard{position:relative;background:var(--card);border:2px solid var(--grid);border-radius:18px;padding:22px 18px;text-align:center}
.qtag{display:inline-block;font-size:15px;color:var(--muted);margin-bottom:8px}
.qtext{font-size:clamp(20px,5vw,26px);line-height:1.7;margin:0}
.blank{display:inline-block;min-width:4.4em;border-bottom:3px solid var(--red);color:var(--red);margin:0 4px}
.qcard .tz{--s:clamp(58px,17vw,84px);margin:6px 0}

.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.choice{
  position:relative;background:var(--card);border:2px solid var(--ink);border-radius:16px;
  padding:16px 8px;font-size:clamp(22px,6vw,28px);font-weight:700;min-height:72px;
}
.choice.big{font-size:clamp(32px,10vw,44px)}
.choice:disabled{cursor:default}
.choice.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.choice.wrong{background:var(--red-soft);border-color:var(--red);color:var(--red);text-decoration:line-through}
.choice.dim{opacity:.45}

.circle{
  position:absolute;inset:-6px;border:4px solid var(--red);border-radius:50%;pointer-events:none;
  animation:draw .35s ease-out;
}
@keyframes draw{from{transform:scale(1.4);opacity:0}to{transform:scale(1);opacity:1}}

.feedback{margin-top:16px;border-radius:16px;padding:14px 16px;text-align:left;display:none}
.feedback.show{display:block;animation:pop .25s ease-out}
.feedback.good{background:var(--ok-soft);border:2px solid var(--ok)}
.feedback.bad{background:var(--red-soft);border:2px solid var(--red)}
.feedback h3{margin:0 0 6px;font-size:22px}
.feedback p{margin:4px 0;font-size:17px}
.feedback .fx{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}

.btn{border:2px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:14px;padding:10px 20px;font-size:18px;font-weight:700}
.btn.ghost{background:var(--card);color:var(--ink)}
.vbtn{border:2px solid var(--blue);background:var(--card);color:var(--blue);border-radius:12px;padding:6px 14px;font-size:17px;cursor:pointer}
.vlist{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:560px){.vlist{gap:12px}}
.vcard{display:flex;flex-direction:column;align-items:stretch;text-align:left;border:2px solid var(--grid);background:var(--paper);border-radius:14px;padding:0;overflow:hidden;cursor:pointer}
.vcard img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#fff8ec}
.vcard span{padding:6px 8px}.vcard b{display:block;font-size:17px}.vcard small{color:var(--muted);font-size:12px}
@media (min-width:560px){.vcard span{padding:8px 12px}.vcard b{font-size:20px}.vcard small{font-size:14px}}
.vmodal{position:fixed;inset:0;background:rgba(30,22,18,.72);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.vbox{background:var(--card);border-radius:16px;width:min(960px,100%);overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.vhead{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 8px 16px;font-size:20px}
.vclose{border:0;background:transparent;font-size:24px;line-height:1;padding:6px 10px;cursor:pointer;color:var(--ink)}
.vbox video{display:block;width:100%;aspect-ratio:16/9;background:#000}
.speak{border:2px solid var(--grid);background:var(--card);border-radius:12px;padding:4px 12px;font-size:16px}

/* scramble */
.tiles{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.tile{
  width:clamp(62px,18vw,80px);height:clamp(62px,18vw,80px);font-size:clamp(34px,10vw,44px);font-weight:700;
  border:2px solid var(--ink);border-radius:14px;background:var(--yellow);color:var(--ink);
}
.tile:disabled{visibility:hidden}
.slots .tz span{cursor:pointer}

/* memory */
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:620px){.mem{grid-template-columns:repeat(4,1fr)}}
.mcard{
  min-height:118px;border-radius:14px;border:2px solid var(--grid);background:var(--grid);
  padding:8px;display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:15px;line-height:1.45;color:transparent;transition:transform .25s,background .2s;
}
.mcard::before{content:"？";font-size:34px;color:var(--card);font-weight:700}
.mcard.open,.mcard.done{background:var(--card);color:var(--ink)}
.mcard.open::before,.mcard.done::before{content:none}
.mcard.open{transform:rotateY(0);border-color:var(--blue);box-shadow:0 0 0 2px var(--blue) inset}
.mcard.idiom{font-size:clamp(20px,5vw,26px);font-weight:700}
.mcard.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);cursor:default}
.mcard.miss{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* flashcards */
.flash{min-height:300px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.flash .back-side{text-align:left;width:100%}
.flash .back-side p{margin:8px 0;font-size:19px}
.tagred,.tagblue{display:inline-block;font-size:15px;color:#fff;border-radius:8px;padding:0 8px;margin-right:6px;vertical-align:2px}
.tagred{background:var(--red)}
.tagblue{background:var(--blue)}
.flash-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}


/* comic */
.strip{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 14px}
.panel-c{position:relative;aspect-ratio:1/1;border:3px solid var(--ink);border-radius:6px;background:var(--paper);overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:8px}
.panel-c .scene{position:absolute;right:6px;bottom:4px;font-size:clamp(40px,12vw,72px);opacity:.35}
.panel-c .who{white-space:nowrap;font-size:clamp(30px,10vw,68px);line-height:1;text-align:left;position:relative}
.bubble{position:relative;background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:6px 10px;font-size:clamp(14px,3.8vw,18px);line-height:1.45;text-align:left;align-self:flex-start;max-width:100%}
.bubble::after{content:"";position:absolute;left:18px;bottom:-10px;width:14px;height:14px;background:var(--card);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}
.bubble.narr{border-radius:4px;background:var(--yellow);color:var(--ink)}
.bubble.narr::after{content:none}
.pnum{position:absolute;left:0;top:0;background:var(--ink);color:var(--paper);font-size:13px;padding:0 7px;border-bottom-right-radius:6px}

.note{margin:28px 0 0;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}
/* result */
.result{text-align:center}
.stamp{
  display:inline-flex;align-items:center;justify-content:center;width:150px;height:150px;border-radius:50%;
  border:6px double var(--red);color:var(--red);font-size:44px;font-weight:700;transform:rotate(-12deg);
  margin:10px auto;animation:stamp .45s cubic-bezier(.3,1.6,.6,1);
}
@keyframes stamp{from{transform:rotate(-12deg) scale(2.2);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}
.result .big{font-size:24px;margin:6px 0}
.wronglist{text-align:left;margin-top:18px}
.wronglist h3{font-size:20px;margin:0 0 8px}
.witem{background:var(--card);border:2px solid var(--grid);border-radius:14px;padding:10px 14px;margin-bottom:8px}
.witem b{font-size:21px;color:var(--blue)}
.witem p{margin:2px 0;font-size:16px;color:var(--muted)}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const DATA = {
 3:{lessons:[{"n": 1, "items": [["拖泥帶水", "泥", "比喻做事、說話、寫作等不夠簡潔、乾脆。", "哥哥收拾書包從不拖泥帶水，三分鐘就準備好出門了。", "j"], ["千變萬化", "化", "形容變化很多，沒有極限。", "魔術師的手法千變萬化，看得大家目不轉睛。", "j"], ["千鈞一髮", "髮", "用一根頭髮懸掛著幾萬斤的重物。比喻情況非常危險。", "千鈞一髮之際，守門員撲倒在地，擋下了對方的射門。", "j"], ["風平浪靜", "平", "無風無浪。比喻平靜無事或情勢穩定。", "颱風過後，港口又恢復了風平浪靜，漁船紛紛出海。", "j"], ["手足無措", "足", "指手腳無處安放。形容人恐懼不安，不知如何是好。", "第一次上台表演，妹妹緊張得手足無措，連台詞都忘了。", "j"]]}, {"n": 2, "items": [["按部就班", "班", "比喻做事依照一定的層次、步驟進行。", "只要按部就班的複習，就不用擔心考試。", "j"], ["約法三章", "約", "泛指事先約好或規定的事。", "出發露營前，爸爸和我們約法三章，不准單獨離開營地。", "j"], ["興高采烈", "烈", "形容興致勃勃，情緒熱烈的樣子。", "聽到下午要上體育課，同學們都興高采烈的換上運動服。", "j"], ["耳提面命", "提", "比喻對人懇切教誨、叮嚀。", "教練每次比賽前都對我們耳提面命，要我們注意安全。", "j"], ["愁眉不展", "愁", "眉頭皺在一起。形容很憂愁的樣子。", "找不到心愛的小狗，弟弟整天愁眉不展。", "j"]]}, {"n": 3, "items": [["神出鬼沒", "鬼", "形容行動快速，出現、消失無法預測。", "森林裡的松鼠神出鬼沒，一眨眼就不見了。", "j"], ["無理取鬧", "無鬧", "比喻不合情理的吵鬧或故意搗亂。", "小表弟為了多吃一顆糖果而無理取鬧，惹得大家很無奈。", "j"], ["赴湯蹈火", "蹈", "比喻奮不顧身，不避艱險。", "為了守護家園，勇敢的戰士願意赴湯蹈火。", "j"], ["不同凡響", "響", "比一般事物出色、不平凡。", "這部電影的特效不同凡響，讓觀眾看得目瞪口呆。", "j"]]}, {"n": 4, "items": [["心煩意亂", "煩", "指心情煩躁，思緒凌亂。", "弄丟了媽媽給的鑰匙，姊姊心煩意亂的到處尋找。", "j"], ["惱羞成怒", "惱", "因羞愧到極點而惱恨發怒。", "輸了遊戲的小明惱羞成怒，把棋子丟得滿地都是。", "j"], ["強詞奪理", "強", "本來無理，卻硬說成有理。", "遲到的同學強詞奪理，說是時鐘走得太快了。", "j"], ["一知半解", "解", "形容知道的內容不完全，了解不深。", "對規則一知半解的他，玩到一半就被判犯規了。", "j"]]}, {"n": 5, "items": [["生龍活虎", "龍", "像有活力的龍虎一般。比喻活潑勇猛，生氣勃勃。", "一到操場，原本無精打采的弟弟又變得生龍活虎。", "j"], ["揚眉吐氣", "吐", "形容擺脫長久的不如意，而感到快慰、舒暢。", "練習了一整年，我們班終於在大隊接力拿下第一名，大家都揚眉吐氣。", "j"], ["防患未然", "防", "在禍患還沒有發生之前就加以防備。", "爸爸定期檢查家裡的滅火器，就是為了防患未然。", "j"], ["兩敗俱傷", "傷", "雙方相爭，同受損害。", "兩隻公雞打了半天架，結果兩敗俱傷，羽毛掉了一地。", "j"], ["出生入死", "死", "本指人從出生到死亡的過程。後形容不畏艱險，將生死置之度外。", "救難隊員出生入死，深入山區尋找失蹤的登山客。", "j"]]}, {"n": 6, "items": [["杯盤狼藉", "杯", "形容酒席結束，杯盤散亂的情形。", "中秋節烤肉結束後，院子裡杯盤狼藉，我們一起動手清理。", "j"], ["一箭雙鵰", "雙", "比喻一次舉動就可以同時達到雙倍的效果。", "幫奶奶澆花既能做家事，又能聽她說故事，真是一箭雙鵰。", "j"], ["如釋重負", "負", "好像放下了沉重的負擔那樣輕鬆。比喻責任已盡，身心輕鬆愉快。", "交出最後一份作業，姊姊如釋重負的伸了個懶腰。", "j"], ["逃之夭夭", "逃", "比喻逃跑得無影無蹤、不知去向。", "偷吃魚的野貓一聽到腳步聲，馬上逃之夭夭。", "j"], ["文不對題", "題", "文章內容和題目的意思不符合，或說話時答非所問。", "題目問的是「我的家人」，他卻寫了一整篇遊樂園，真是文不對題。", "j"]]}, {"n": 7, "items": [["離鄉背井", "背", "離開故鄉，到外地生活。", "阿姨大學畢業後離鄉背井，到很遠的城市工作。"], ["可見一斑", "斑", "從一小部分，就能看出全部的樣子。", "他連鉛筆都削得整整齊齊，做事有多細心可見一斑。"], ["淺顯易懂", "懂", "簡單又容易讓人明白。", "這本圖畫書把地球的知識寫得淺顯易懂，弟弟一看就會。"], ["自命不凡", "凡", "自以為很了不起、和別人不一樣。", "他自命不凡，總覺得班上沒有人比得上他。", "j"], ["內外夾攻", "夾", "從裡面和外面同時受到打擊。", "這座城堡被內外夾攻，很快就守不住了。"], ["笑裡藏刀", "藏", "外表笑咪咪，心裡卻打著壞主意。", "故事裡的狐狸笑裡藏刀，嘴巴說好話，心裡卻想吃掉小雞。", "j"], ["扭扭捏捏", "捏", "不大方、不自然的樣子。", "輪到小美上臺時，她扭扭捏捏的，說話小聲得聽不見。"], ["多才多藝", "藝", "會很多種才能和技藝。", "表姊多才多藝，會彈鋼琴、會畫畫，還會跳舞。"], ["不學無術", "術", "沒有學問，也沒有本領。", "故事裡的小王子不學無術，什麼事都不會做。", "j"], ["創業維艱", "創", "開創事業非常辛苦。", "叔叔開麵包店時創業維艱，每天天還沒亮就起床揉麵團。"]]}, {"n": 8, "items": [["走火入魔", "魔", "太過著迷於某件事，方法又不對，反而傷害了自己。", "哥哥打電動打到走火入魔，連飯都忘了吃。"], ["巾幗英雄", "巾", "指女性英雄。", "那位勇敢救人的女消防員，是大家心中的巾幗英雄。"], ["一視同仁", "視", "對待每個人都一樣，沒有偏心。", "老師一視同仁，每位同學都有機會上臺發表。", "j"], ["誤入歧途", "誤", "一時迷糊，走上錯誤的路。", "他因為交到壞朋友而誤入歧途，後來很後悔。"], ["濫竽充數", "數", "沒有真本事的人，混在行家裡面湊數。", "他根本不會吹笛子，只是站在樂隊裡濫竽充數。"], ["牛刀小試", "刀", "很有本事的人，先在小事上露一手。", "數學小天才解這題只是牛刀小試，一下子就算出來了。", "j"], ["似曾相識", "曾", "好像以前見過，卻又想不起來。", "走進這間教室，我覺得似曾相識，好像在夢裡來過。"], ["當機立斷", "機", "把握時機，馬上做決定。", "看到烏雲飄過來，隊長當機立斷，帶大家先下山。", "j"], ["破鏡重圓", "鏡", "比喻分開的夫妻重新團聚。", "失散多年的夫妻終於破鏡重圓，一家人又住在一起了。", "j"], ["參差不齊", "齊", "長短、高低、好壞不一樣，很不整齊。", "這排小樹長得參差不齊，有的高、有的矮。", "j"]]}, {"n": 9, "items": [["諱疾忌醫", "醫", "有病卻怕人知道、不肯看醫生。比喻怕人批評，隱藏自己的缺點。", "牙齒痛還不去看醫生，這樣諱疾忌醫，只會越痛越嚴重。"], ["望穿秋水", "穿", "形容非常急切的盼望。", "爺爺望穿秋水，終於等到在國外讀書的孫子回家。"], ["披星戴月", "戴", "早出晚歸，非常辛苦。", "農夫伯伯披星戴月，天還沒亮就下田，天黑才回家。", "j"], ["有備無患", "備", "事先準備好，就不怕發生困難。", "出門前帶把傘，有備無患，下雨也不怕。", "j"], ["埋頭苦幹", "幹", "專心一意的努力做事。", "姊姊為了完成作品，一個人在房間埋頭苦幹。"], ["旁敲側擊", "敲", "不直接問，而是從旁邊繞著彎打聽。", "媽媽旁敲側擊，想知道我想要什麼生日禮物。"], ["以毒攻毒", "毒", "用狠毒的方法對付狠毒的人或事。", "故事裡的勇士以毒攻毒，用妖怪的毒藥打敗了妖怪。"], ["溫故知新", "溫", "複習學過的東西，又能學到新的道理。", "哥哥每天溫故知新，把舊課本再讀一遍，常常有新發現。", "j"], ["對症下藥", "藥", "找出問題在哪裡，再用對的方法解決。", "老師對症下藥，先教他把九九乘法背熟，他的數學就進步了。", "j"]]}, {"n": 10, "items": [["樂極生悲", "極", "高興過頭，反而發生難過的事。", "他高興得在走廊上跳來跳去，結果樂極生悲，跌了一跤。"], ["虎背熊腰", "熊", "形容人的身體又高又壯。", "那位舉重選手虎背熊腰，一看就很有力氣。"], ["雪中送炭", "雪", "在別人最需要的時候，給予幫助。", "我忘了帶彩色筆，同學借我一盒，真是雪中送炭。", "j"], ["絞盡腦汁", "腦", "用盡所有心思，努力的想。", "為了想出故事的結局，我絞盡腦汁，想了一整個晚上。"], ["腳踏實地", "實", "做事認真、實在，一步一步來。", "他做事腳踏實地，從不偷懶，所以大家都信任他。", "j"], ["根深蒂固", "根", "像樹根長得很深，非常牢固，很難改變。", "過年要吃年夜飯的習俗，在大家心裡根深蒂固。"], ["舉一反三", "反", "學會一件事，就能想通其他類似的事。", "弟弟學會了一題，其他類似的題目也會了，真是舉一反三。", "j"], ["含沙射影", "射", "不直接說，用暗示的話偷偷說別人壞話。", "他說話含沙射影，雖然沒說名字，大家都知道他在說誰。"], ["切膚之痛", "膚", "和自己密切相關、親身感受到的痛苦。", "經歷過地震的爺爺，對那場災難有切膚之痛。"], ["目瞪口呆", "呆", "因為吃驚或害怕，愣住說不出話。", "魔術師變出一隻鴿子，大家看得目瞪口呆。", "j"], ["氣象萬千", "象", "景色變化很多，非常壯觀。", "山頂的雲海氣象萬千，讓人看得捨不得離開。", "j"], ["滾瓜爛熟", "滾", "背得或讀得非常熟練流利。", "妹妹把這首兒歌背得滾瓜爛熟，一個字都不會錯。"]]}, {"n": 11, "items": [["焦頭爛額", "額", "忙得很辛苦、很狼狽的樣子。", "園遊會快到了，班長忙得焦頭爛額。", "j"], ["虎視眈眈", "虎", "像老虎一樣緊緊盯著，想找機會搶東西。", "小貓對魚缸裡的金魚虎視眈眈。"], ["近水樓臺", "臺", "靠近水邊的樓臺先看到月亮，比喻因為靠得近，先得到好處。", "他家就在學校旁邊，近水樓臺，每天都第一個到校。"], ["獨當一面", "獨", "一個人就能負責一整方面的工作。", "經過練習，姊姊已經能獨當一面，自己主持班會了。"], ["萬紫千紅", "萬", "各種花開得很多，顏色非常美麗。", "春天的花園萬紫千紅，蝴蝶飛來飛去。", "j"], ["數典忘祖", "祖", "比喻忘了自己的根本，或不了解自己的歷史。", "我們要記得家鄉的故事，不要數典忘祖。"], ["井底之蛙", "蛙", "比喻見識很少的人。", "多讀書、多看看世界，才不會變成井底之蛙。"], ["捕風捉影", "捉", "說話或做事沒有根據，只憑猜測。", "沒有看清楚就說他偷東西，這是捕風捉影。"], ["觸類旁通", "類", "懂了一件事，就能推想到其他同類的事。", "學會了一種摺紙方法，她觸類旁通，又摺出好多動物。", "j"], ["鳩占鵲巢", "占", "斑鳩住進喜鵲的巢，比喻霸占別人的東西或成果。", "他沒有幫忙，卻說作品是他做的，真是鳩占鵲巢。"], ["呆若木雞", "雞", "因為害怕或吃驚，愣在那裡像木頭做的雞。", "聽到打雷聲，弟弟嚇得呆若木雞，站著不動。"], ["心驚肉跳", "肉", "非常害怕，心跳得很快。", "看到小狗衝到馬路上，我嚇得心驚肉跳。", "j"], ["威風凜凜", "威", "很有氣勢，讓人敬佩。", "儀隊踏著整齊的步伐，看起來威風凜凜。", "j"]]}, {"n": 12, "items": [["攻其不備", "攻", "趁對方沒有防備時發動攻擊。", "躲避球比賽時，他攻其不備，一下就打中對手。"], ["無懈可擊", "擊", "沒有任何缺點可以挑剔。", "她的鋼琴演奏無懈可擊，評審都給了滿分。", "j"], ["明哲保身", "保", "只顧保護自己，不肯為對的事站出來。", "看到同學被欺負，他卻明哲保身，假裝沒看見。"], ["安身立命", "命", "有地方住、生活有著落，心裡也有依靠。", "爺爺說，這個小鎮是他安身立命的好地方。"], ["插翅難飛", "翅", "就算長了翅膀也飛不走，比喻很難逃走。", "小偷被警察團團圍住，插翅難飛。"], ["勢均力敵", "敵", "雙方力量差不多，分不出高下。", "兩隊拔河勢均力敵，繩子一直停在中間。", "j"], ["眾所周知", "周", "大家都知道。", "地球繞著太陽轉，這是眾所周知的事。"], ["在所難免", "免", "無論如何都很難避免。", "剛學騎腳踏車，跌倒是在所難免的。"], ["胸有成竹", "竹", "心裡早有計畫，很有把握。", "他胸有成竹的走上臺，流利的說完了故事。"], ["開源節流", "節", "增加收入，也節省支出。", "為了買新書包，我開源節流，幫忙做家事賺零用錢，也少買零食。", "j"], ["雕蟲小技", "技", "比喻很小、不重要的本領。", "他說會轉筆只是雕蟲小技，真正厲害的是會寫書法。"], ["打退堂鼓", "退", "做事做到一半就退縮、放棄。", "游泳才練了兩天，他就想打退堂鼓了。"], ["屁滾尿流", "屁", "非常害怕、狼狽的樣子。", "故事裡的妖怪被小英雄打得屁滾尿流，趕快逃走了。"]]}],

 4:{lessons:[{"n": 1, "items": [["家喻戶曉", "戶", "家家戶戶都知道，形容事情或名聲傳播極廣。", "白蛇傳是家喻戶曉的民間故事，連小朋友都能說出大概。", "j"], ["繁文縟節", "繁", "繁瑣的儀式禮節。", "爺爺喜歡簡單的生日聚會，不想要太多繁文縟節。", "j"], ["花團錦簇", "簇", "形容五彩繽紛、繁華美麗的樣子。", "春天一到，公園裡花團錦簇，吸引許多人來拍照。", "j"], ["迎刃而解", "迎", "比喻事情很容易解決。", "找到關鍵的線索後，這道難題就迎刃而解了。", "j"]]}, {"n": 2, "items": [["刻骨銘心", "骨", "形容感受深刻，難以忘懷。", "第一次登上玉山看日出的感動，讓我刻骨銘心。", "j"], ["脫胎換骨", "換", "比喻人澈底改變。", "經過一個暑假的練習，他的球技脫胎換骨，進步好多。", "j"], ["一觸即發", "即", "比喻情勢非常緊急，隨時會發生變化。", "兩隊球迷互相叫罵，現場氣氛緊張，衝突一觸即發。", "j"], ["矯枉過正", "矯", "糾正偏差、缺失，卻超過了適當的程度。", "為了改掉說話太小聲的毛病，他現在大吼大叫，真是矯枉過正。", "j"]]}, {"n": 3, "items": [["民不聊生", "民", "形容百姓生活非常困苦。", "古時候連年乾旱，農作物歉收，百姓民不聊生。", "j"], ["志同道合", "志", "彼此的志趣和理想一致。", "爸爸在登山社認識了許多志同道合的朋友，常常一起爬山。", "j"], ["樂不可支", "支", "形容快樂到了極點。", "看到小丑滑稽的表演，小朋友們樂不可支。", "j"], ["未雨綢繆", "未", "比喻禍患還沒有發生之前，就事先防備。", "爸爸每個月存下一點錢，未雨綢繆，以備不時之需。", "j"]]}, {"n": 4, "items": [["一針見血", "針", "比喻議論透澈，切中要點。", "記者一針見血的提問，讓市長一時答不出話來。", "j"], ["提綱挈領", "領", "比喻抓住事情的重點。", "班長提綱挈領的整理出討論重點，大家一看就懂。", "j"], ["冥頑不靈", "頑", "愚昧頑固而不通靈性。", "那個冥頑不靈的國王，聽不進任何大臣的勸告。", "j"], ["天翻地覆", "翻", "形容大大改變原有的情況、狀態。", "搬新家那天，整個屋子被我們弄得天翻地覆。", "j"]]}, {"n": 5, "items": [["不勝枚舉", "舉", "形容數量太多。", "臺灣的美食不勝枚舉，像珍珠奶茶、小籠包都很受歡迎。", "j"], ["背水一戰", "戰", "比喻在絕境中奮死戰鬥。", "這是最後一次報名機會，姊姊決定背水一戰，全力準備考試。", "j"], ["鵬程萬里", "程", "比喻前程遠大，不可限量。", "畢業典禮上，校長祝福每位畢業生鵬程萬里。", "j"], ["恃才傲物", "傲", "依仗本身有才幹而驕傲自大，什麼都不放在眼裡。", "他雖然聰明，卻恃才傲物，所以沒有什麼朋友。", "j"]]}, {"n": 6, "items": [["垂涎三尺", "尺", "形容非常想吃，口水流了三尺長。", "夜市飄來陣陣烤香腸的香味，讓人垂涎三尺。", "j"], ["層出不窮", "層", "接連不斷的出現，似乎沒有窮盡。", "這位發明家的點子層出不窮，常常讓人眼睛一亮。", "j"], ["融會貫通", "融", "形容將各種知識或事物加以融合，進而獲得全面透澈的理解。", "把課本內容融會貫通之後，再難的題目也難不倒他。", "j"], ["七竅生煙", "煙", "形容焦急或氣憤到了極點。", "有人在剛粉刷好的牆上亂塗鴉，管理員氣得七竅生煙。", "j"]]}, {"n": 7, "items": [["作育英才", "育", "培養優秀的人才。", "這位老校長作育英才，教出了許多優秀的學生。"], ["晴空萬里", "晴", "天空晴朗，一點雲也沒有。", "今天晴空萬里，最適合去放風箏。"], ["一目十行", "目", "形容讀書速度非常快。", "姊姊看書一目十行，一個下午就讀完一本小說。", "j"], ["鋒芒畢露", "芒", "把才能全都表現出來，愛出風頭，不夠謙虛。", "他才剛轉學就鋒芒畢露，什麼都要搶第一。"], ["樂而忘返", "返", "玩得太開心，忘了回去。", "遊樂園太好玩了，我們樂而忘返，直到天黑才離開。", "j"], ["星移斗轉", "斗", "星星移動了位置，比喻時間慢慢過去。", "星移斗轉，當年的小樹苗已經長成大樹了。"], ["不假思索", "索", "不用想就馬上回答，反應很快。", "老師一問問題，他不假思索就說出答案。", "j"], ["弱不禁風", "禁", "身體非常瘦弱，好像風一吹就會倒。", "生病很久的表弟弱不禁風，要多吃飯、多運動。", "j"], ["遠渡重洋", "渡", "飄洋過海，到很遠的國外。", "叔叔遠渡重洋，到國外學做蛋糕。"], ["一念之差", "念", "一個念頭想錯了，造成錯誤。", "他一念之差沒有帶雨衣，結果被淋成落湯雞。"], ["清湯掛麵", "麵", "形容女生直直、整齊、齊耳的短髮。", "姊姊剪了清湯掛麵的短髮，看起來很清爽。"], ["不成體統", "統", "不合規矩、不像樣。", "在圖書館大聲吵鬧，真是不成體統。"], ["一文不值", "值", "一點價值也沒有。", "這顆石頭別人看來一文不值，卻是我最珍貴的回憶。"]]}, {"n": 8, "items": [["嚴陣以待", "陣", "做好萬全準備，等待對方到來。", "颱風要來了，大家嚴陣以待，把門窗都關好。"], ["披荊斬棘", "披", "砍掉路上的荊棘，比喻克服種種困難。", "探險隊披荊斬棘，終於找到了瀑布。", "j"], ["熱淚盈眶", "眶", "心情激動，眼眶裡充滿淚水。", "看到小狗平安回家，我感動得熱淚盈眶。"], ["乘風破浪", "乘", "坐船順著風衝破大浪，比喻勇敢向前。", "帆船選手乘風破浪，第一個衝過終點。", "j"], ["龐然大物", "龐", "又高又大的東西。", "博物館裡的恐龍化石是個龐然大物，比房子還高。"], ["蛛絲馬跡", "絲", "可以用來追查的小小線索。", "小偵探從地上的腳印找到蛛絲馬跡，知道是誰拿了餅乾。", "j"], ["一板一眼", "板", "說話做事照規矩，有條有理。", "班長做事一板一眼，每一項都檢查得很仔細。"], ["挺身而出", "挺", "勇敢的站出來。", "有人亂丟垃圾，小明挺身而出，提醒他要撿起來。"], ["魂飛魄散", "散", "非常害怕。", "鬼屋裡突然跳出一個人，把我嚇得魂飛魄散。", "j"], ["千里鵝毛", "里", "從很遠送來的小禮物，禮物雖輕，心意很重。", "表姊從國外寄來一張明信片，千里鵝毛，我好開心。", "j"]]}, {"n": 9, "items": [["促膝長談", "促", "兩人靠得很近，親切的談了很久。", "畢業前，我和好朋友促膝長談，聊了一整個下午。"], ["一蹶不振", "振", "失敗一次以後，就再也振作不起來。", "輸了一場比賽沒關係，不要從此一蹶不振。"], ["支離破碎", "碎", "破破爛爛、零零碎碎，不完整。", "花瓶摔到地上，變得支離破碎。"], ["始作俑者", "者", "第一個開始做壞事的人。", "教室亂成一團，大家都在找誰是始作俑者。"], ["無獨有偶", "偶", "兩件事剛好相同，不只一件。", "哥哥今天生日，無獨有偶，他的好朋友也是今天生日。", "j"], ["花言巧語", "巧", "虛假卻好聽的話。", "不要相信陌生人的花言巧語，要先問爸爸媽媽。"], ["趨吉避凶", "凶", "靠近好事，避開壞事。", "過馬路看紅綠燈，就是趨吉避凶的好方法。"], ["餘音繞梁", "繞", "歌聲或音樂非常美妙，好像還一直在耳邊。", "合唱團的歌聲餘音繞梁，表演結束了大家還在回味。", "j"], ["怒髮衝冠", "衝", "非常生氣的樣子。", "看到有人欺負小狗，爸爸氣得怒髮衝冠。", "j"], ["如雷貫耳", "雷", "名氣很大，大家都聽過。", "這位作家的名字如雷貫耳，每個小朋友都讀過他的書。"], ["金字招牌", "牌", "讓人驕傲、很有名的招牌或代表。", "奶奶做的蘿蔔糕是我們家的金字招牌。"], ["豐功偉業", "豐", "偉大的功勞和成就。", "爺爺常說起他年輕時蓋大橋的豐功偉業。"], ["庸人自擾", "擾", "沒事自己找煩惱。", "明天的事還沒發生，你就擔心一整晚，真是庸人自擾。", "j"]]}, {"n": 10, "items": [["江郎才盡", "郎", "比喻文思枯竭，再也寫不出好作品。", "這位作家寫不出新故事，大家都說他江郎才盡了。", "j"], ["雄心萬丈", "丈", "志向非常遠大。", "弟弟雄心萬丈，說長大要當太空人上月球。"], ["哄堂大笑", "哄", "在場的人一起大笑。", "小新扮了一個鬼臉，全班哄堂大笑。"], ["眾望所歸", "眾", "大家都支持、擁護。", "熱心的小美當上班長，真是眾望所歸。"], ["阮囊羞澀", "羞", "口袋裡沒有錢，經濟困難。", "他月底阮囊羞澀，只好在家煮泡麵吃。", "j"], ["差強人意", "強", "大致上還算令人滿意。", "這次的成績差強人意，下次再努力一點會更好。"], ["為人作嫁", "嫁", "為別人辛苦忙碌，自己卻沒有得到好處。", "他熬夜做的海報，最後寫的卻是別人的名字，真是為人作嫁。"], ["疊床架屋", "架", "重複又多餘。", "作文裡同樣的話寫了好幾遍，顯得疊床架屋。"], ["初出茅廬", "初", "剛進入社會，經驗還不多。", "這位初出茅廬的新老師，第一天上課有點緊張。", "j"], ["丟三落四", "丟", "因為馬虎或健忘，常常忘東忘西。", "他總是丟三落四，不是忘了水壺，就是忘了作業。"], ["既往不咎", "既", "過去的錯不再追究。", "你已經道歉了，這件事就既往不咎吧！", "j"], ["成群結隊", "隊", "很多人或動物聚在一起行動。", "候鳥成群結隊的飛往南方過冬。"]]}, {"n": 11, "items": [["三姑六婆", "婆", "比喻喜歡說閒話、搬弄是非的人。", "巷口的三姑六婆每天聊別人的事，讓人很困擾。"], ["齒頰留香", "頰", "食物非常好吃，吃完還一直回味。", "阿嬤做的鳳梨酥齒頰留香，讓人吃了還想再吃。"], ["陽奉陰違", "陰", "表面上答應，私底下卻不照著做。", "他答應不吃零食，卻陽奉陰違，偷偷躲在房間吃。"], ["嘔心瀝血", "血", "用盡所有的心思和力氣。", "這幅畫是畫家嘔心瀝血的作品，畫了整整三年。", "j"], ["哀鴻遍野", "哀", "到處都是流離失所、悲傷的難民。", "大地震過後哀鴻遍野，大家都趕快捐物資幫忙。"], ["臥薪嘗膽", "嘗", "睡在柴草上、嘗苦膽，比喻刻苦自我激勵，努力奮發。", "輸了比賽後，他臥薪嘗膽，每天練球，終於拿到冠軍。", "j"], ["蝦兵蟹將", "蟹", "神話中龍王手下的兵將，比喻不厲害的小角色。", "大魔王還沒出現，先跑出來的只是一群蝦兵蟹將。"], ["痛定思痛", "痛", "痛苦過去後，再回想當時的教訓，提醒自己。", "上次忘了帶作業被扣分，他痛定思痛，每天睡前都先整理書包。"]]}, {"n": 12, "items": [["一貧如洗", "貧", "非常貧窮，什麼都沒有。", "故事裡的樵夫一貧如洗，家裡連一粒米都沒有。", "j"], ["賢妻良母", "妻", "懂事明理，能好好照顧家人的妻子和母親。", "故事裡的王太太是位賢妻良母，把家照顧得很好。"], ["神機妙算", "算", "計策高明，預料得很準。", "軍師神機妙算，早就猜到敵人會從哪裡來。"], ["夜以繼日", "繼", "晚上接著白天，一直不休息。", "工人夜以繼日的工作，終於把橋修好了。", "j"], ["狗尾續貂", "續", "用不好的東西接在好東西後面，前後不相稱。", "故事明明已經很完美，他硬加了一段，反而狗尾續貂。"], ["因地制宜", "宜", "依照當地的情況，想出合適的辦法。", "山上的農夫因地制宜，種植適合高山生長的高麗菜。"], ["刻苦耐勞", "耐", "非常勤勞，不怕辛苦。", "阿伯刻苦耐勞，每天天還沒亮就去菜市場擺攤。"], ["流離失所", "離", "到處流浪，沒有地方住。", "被丟掉的小狗流離失所，我們幫牠找到新主人。", "j"], ["隱惡揚善", "隱", "不宣揚別人的缺點，多稱讚別人的好行為。", "老師常提醒我們要隱惡揚善，多說同學的優點。"], ["所託非人", "託", "把事情交給不適當的人，結果弄得更糟。", "他把金魚交給弟弟照顧，結果所託非人，魚缸好幾天都沒換水。"], ["藏汙納垢", "納", "藏著髒東西，也比喻包藏壞人壞事。", "沙發底下很久沒打掃，藏汙納垢，灰塵好多。"], ["漸入佳境", "漸", "情況越來越好。", "剛開始學鋼琴很難，練習一段時間後就漸入佳境了。", "j"]]}],

 5:{lessons:[{"n": 1, "items": [["疲於奔命", "疲", "形容事情繁多，奔波勞累。", "颱風過後到處都要搶修，電力公司的工作人員疲於奔命。", "j"], ["孜孜不倦", "倦", "指勤勉而不知疲倦。", "那位老科學家孜孜不倦的研究，終於找到了答案。", "j"], ["隨遇而安", "遇", "指能安於所處的環境。", "搬到鄉下後，小安隨遇而安，很快就交到了新朋友。", "j"], ["如願以償", "償", "指心願得以實現。", "存了半年的零用錢，弟弟終於如願以償買到了望遠鏡。", "j"], ["錙銖必較", "較", "連很少的錢或很小的事情都非常計較。", "做蛋糕時，材料的份量必須錙銖必較，差一點都可能失敗。", "j"]]}, {"n": 2, "items": [["延年益壽", "延", "拉長歲數，增加壽命。", "醫生說，規律運動和充足睡眠才是延年益壽的好方法。", "j"], ["穩如泰山", "穩", "形容安定穩固如泰山一般，不可動搖。", "不管對手怎麼進攻，我們的守門員都穩如泰山。", "j"], ["熟能生巧", "熟", "做事熟練了，自然能領悟出其中的關鍵、要領。", "剛學打字時很慢，但熟能生巧，現在我一分鐘能打好幾十個字。", "j"], ["當務之急", "務", "當前最迫切需要處理的事。", "期中考快到了，當務之急是把錯的題目再複習一遍。", "j"], ["口碑載道", "碑", "眾人稱頌的話語，就像刻在記功碑上一樣。比喻廣受好評。", "這位醫師醫術高明又親切，在地方上口碑載道。", "j"]]}, {"n": 3, "items": [["手不釋卷", "卷", "手裡總是拿著書卷。形容人勤奮好學。", "爺爺退休後手不釋卷，每天都到圖書館看書。", "j"], ["楚楚可憐", "楚", "姿態嬌媚動人，惹人憐愛。亦形容柔弱哀悽或處境不佳，令人憐憫。", "迷路的小女孩站在路口哭泣，楚楚可憐的樣子讓人心疼。", "j"], ["道聽塗說", "塗", "泛指沒有經過證實、缺乏根據的話。", "網路上的消息常常是道聽塗說，我們要先查證再轉傳。", "j"], ["後起之秀", "秀", "稱譽後輩中的優秀人才。", "這位年輕的畫家是藝術界的後起之秀，作品受到許多人喜愛。", "j"], ["自慚形穢", "慚", "泛指與人相比自愧不如。", "看到學長流利的英文演講，我不禁自慚形穢，決定更加努力。", "j"]]}, {"n": 4, "items": [["名列前茅", "列", "比喻成績優異，名次排在前面。", "小傑每天認真練跑，在全市運動會中名列前茅。", "j"], ["耀武揚威", "耀", "形容得意、輕視別人的樣子。", "那隻大公雞在院子裡耀武揚威，其他小雞都不敢靠近。", "j"], ["殊途同歸", "殊", "比喻採取的方法雖不同，所得的結果卻相同。", "有人先寫數學、有人先寫國語，只要都完成作業，就是殊途同歸。", "j"], ["道貌岸然", "貌", "形容外表莊重嚴肅的樣子。", "那位道貌岸然的教授一開口，同學們都不敢交頭接耳。", "j"]]}, {"n": 5, "items": [["懸崖勒馬", "崖", "比喻到了危險的邊緣而及時回頭。", "差點跟著壞朋友去偷東西的他，最後懸崖勒馬，轉身離開。", "j"], ["班門弄斧", "斧", "比喻在專家面前賣弄本事，不自量力。", "在專業廚師面前教人做菜，真是班門弄斧。", "j"], ["一決雌雄", "雄", "比喻互相較量以決定勝敗、高下。", "兩位棋手實力不相上下，將在明天的決賽中一決雌雄。", "j"], ["臨深履薄", "臨", "臨近深淵，踩踏薄冰。比喻戒慎恐懼，十分小心。", "第一次操作實驗器材，大家都臨深履薄，深怕弄壞了。", "j"], ["醉生夢死", "醉", "形容人缺乏目標，生活過得糊里糊塗。", "他以前過著醉生夢死的日子，直到生了一場大病才開始反省。", "j"]]}, {"n": 6, "items": [["應接不暇", "暇", "形容景物繁多，來不及觀賞。亦比喻事情繁忙，難以應付。", "遊覽車開進山區，窗外美景一幕接一幕，讓人應接不暇。", "j"], ["微乎其微", "乎", "形容非常少或事物極其細小。", "只要確實戴好安全帽，發生嚴重傷害的機會就微乎其微。", "j"], ["腹背受敵", "腹", "前、後都受到敵人的攻擊。", "下棋時我太大意，結果國王腹背受敵，很快就輸了。", "j"], ["悲天憫人", "悲", "憂傷時局多變，哀憐百姓疾苦。", "這位醫生懷著悲天憫人的心，到偏鄉為窮苦的病人看診。", "j"], ["歷歷在目", "歷", "清楚明白的呈現在眼前。", "去年畢業旅行的點點滴滴，至今仍歷歷在目。", "j"]]}, {"n": 7, "items": [["設身處地", "設", "把自己想成站在別人的位置，體會對方的心情。", "吵架時如果能設身處地想一想，就比較不會說出傷人的話。", "j"], ["汗牛充棟", "棟", "形容書非常非常多。", "外公的書房汗牛充棟，從地板一路堆到天花板。", "j"], ["雪上加霜", "霜", "糟糕的事情接連發生，讓情況更壞。", "腳踏車破胎已經很倒楣，偏偏又下起大雨，真是雪上加霜。", "j"], ["不著邊際", "際", "說話或想法離題太遠，不切實際。", "討論班遊時，他說要搭火箭去月球，大家都覺得太不著邊際了。", "j"], ["不遺餘力", "遺", "用盡全部的力氣，一點也不保留。", "志工媽媽不遺餘力的推動晨讀，讓全校愛上閱讀。", "j"]]}, {"n": 8, "items": [["衣錦還鄉", "鄉", "在外地有了成就，風風光光的回到家鄉。", "表哥在國外得到廚藝大獎後衣錦還鄉，全村都替他高興。", "j"], ["撲朔迷離", "撲", "事情複雜難懂，很難看清真相。", "這本偵探小說的情節撲朔迷離，不看到最後猜不出真相。", "j"], ["千篇一律", "律", "每一個都一樣，沒有變化。", "如果每篇作文都用同樣的開頭，就會顯得千篇一律。", "j"], ["分庭抗禮", "抗", "雙方實力差不多，可以平起平坐。", "新成立的棒球隊進步神速，已經能和老牌強隊分庭抗禮。", "j"], ["欲蓋彌彰", "蓋", "想要掩飾錯誤，反而讓錯誤更明顯。", "他把打翻的果汁用書本蓋住，結果欲蓋彌彰，書全溼了。", "j"]]}, {"n": 9, "items": [["同心協力", "協", "大家團結一條心，一起努力。", "全班同心協力，一個下午就把教室布置好了。", "j"], ["以鄰為壑", "鄰", "把自己的麻煩丟給別人承擔。", "把垃圾掃到隔壁班門口，這種以鄰為壑的做法很不應該。", "j"], ["反求諸己", "諸", "遇到問題先檢查自己，從自己身上找原因。", "比賽輸了，隊長沒有怪別人，而是反求諸己，檢討自己哪裡沒做好。", "j"]]}, {"n": 10, "items": [["指桑罵槐", "罵", "表面上罵這個，其實是在罵另一個人。", "他對著小狗說「有人都不洗碗」，其實是指桑罵槐，在說弟弟。", "j"], ["循規蹈矩", "規", "遵守規矩，行為端正。", "姊姊在學校一向循規蹈矩，從來不遲到。", "j"], ["同仇敵愾", "仇", "大家一起對同一個敵人生氣，團結起來對抗。", "面對來搗蛋的猴子，全村同仇敵愾，一起想辦法保護果園。", "j"], ["瑕瑜互見", "互", "缺點和優點同時都有。", "這部卡通畫面很美，劇情卻有點拖，可以說是瑕瑜互見。", "j"]]}, {"n": 11, "items": [["垂頭喪氣", "垂", "失望、提不起精神的樣子。", "比賽輸了，隊員們垂頭喪氣的走回休息區。", "j"], ["精衛填海", "衛", "傳說中的精衛鳥想把大海填平，比喻意志堅定、不怕困難。", "他每天練一點英文，像精衛填海一樣，三年後已經能跟外國人聊天。", "j"], ["惡貫滿盈", "盈", "做的壞事多到滿出來，罪大惡極。", "故事裡惡貫滿盈的海盜，最後終於被抓起來了。", "j"], ["奇貨可居", "貨", "把少見的東西囤起來，等機會賣好價錢。比喻靠特別的本領或東西謀取好處。", "限量卡牌一推出，就有人覺得奇貨可居，買了一大堆等著漲價。", "j"], ["氣宇軒昂", "昂", "精神飽滿、很有氣勢的樣子。", "畢業典禮上，穿著西裝的哥哥看起來氣宇軒昂。", "j"]]}, {"n": 12, "items": [["心煩意亂", "煩", "心裡煩躁，思緒很亂。", "作業還沒寫完，外面又一直施工，讓我心煩意亂。", "j"], ["眾志成城", "城", "大家團結一心，就像堅固的城牆一樣。", "全校眾志成城，在一週內募到了救災物資。", "j"], ["義不容辭", "辭", "按道理不能推辭，應該去做。", "看到奶奶提重物上樓梯，哥哥義不容辭的上前幫忙。", "j"], ["心猿意馬", "猿", "心思像跳來跳去的猴子、奔跑的馬，定不下來。", "窗外的煙火一直響，弟弟寫作業寫得心猿意馬。", "j"], ["同舟共濟", "舟",  6:{lessons:[{"n": 1, "items": [["風塵僕僕", "塵", "形容奔波忙碌，旅途勞累。", "叔叔從國外出差回來，風塵僕僕的拖著行李進門。", "j"], ["蓬頭垢面", "垢", "形容人頭髮散亂、面容骯髒的樣子。", "熬夜趕報告的哥哥蓬頭垢面，連臉都忘了洗。", "j"], ["鳳毛麟角", "鳳", "比喻稀罕珍貴的人、物。", "能同時精通五種樂器的人，在我們學校可說是鳳毛麟角。", "j"], ["野人獻曝", "曝", "比喻平凡人所貢獻的平凡事物。", "我只是野人獻曝，提出一點小小的想法，希望對大家有幫助。", "j"]]}, {"n": 2, "items": [["錦上添花", "添", "比喻美上加美，喜上加喜。", "原本就很美味的蛋糕，再加上新鮮草莓，更是錦上添花。", "j"], ["白駒過隙", "隙", "比喻時間過得很快。", "光陰如白駒過隙，轉眼間我們就要升上國中了。", "j"], ["禮尚往來", "尚", "形容別人如何對待你，你也如何對待別人。", "同學請我吃了一包餅乾，我也禮尚往來，請他喝一杯飲料。", "j"], ["朝三暮四", "暮", "比喻人心意不定、反覆無常。", "他做事朝三暮四，今天想學鋼琴，明天又想改學畫畫。", "j"], ["一瀉千里", "瀉", "形容水奔流直下，通暢快速。或比喻文筆流暢，氣勢奔放。", "大雨過後，瀑布的水量大增，一瀉千里，氣勢驚人。", "j"]]}, {"n": 3, "items": [["退避三舍", "舍", "比喻主動退讓，不與人相爭。", "那隻大白鵝脾氣很兇，路過的人都對牠退避三舍。", "j"], ["草木皆兵", "皆", "形容疑神疑鬼、驚恐不安。", "看完鬼故事後，弟弟晚上聽到一點聲音就草木皆兵。", "j"], ["蓬蓽生輝", "蓬", "比喻他人所贈之物或貴客之來訪令人倍感光彩。", "謝謝您送來的名家字畫，讓我們的小店蓬蓽生輝。", "j"], ["深居簡出", "簡", "指人平日待在家裡，很少外出。", "那位作家深居簡出，很少在公開場合露面。", "j"], ["萬籟俱寂", "寂", "萬物無聲，一片寂靜。", "露營的夜晚萬籟俱寂，只看得到滿天閃爍的星星。", "j"]]}, {"n": 4, "items": [["揚湯止沸", "沸", "比喻暫時紓解困境，無法根本解決問題。", "只把垃圾藏到床底下，不過是揚湯止沸，房間還是很亂。", "j"], ["飛黃騰達", "騰", "比喻仕途得意，很快到達高位。", "故事裡的窮書生考上狀元，從此飛黃騰達。", "j"], ["唯唯諾諾", "唯", "比喻順從而無所違逆。用於貶義。", "他對老闆總是唯唯諾諾，從來不敢說出自己的意見。", "j"], ["搖旗吶喊", "吶", "比喻為他人助長聲勢。", "運動會上，全班同學為參加接力賽的選手搖旗吶喊。", "j"], ["本末倒置", "置", "比喻不知事情的輕重緩急。", "為了買漂亮的文具而沒錢買課本，真是本末倒置。", "j"]]}, {"n": 5, "items": [["車載斗量", "載", "用車裝，拿斗量。形容數量很多，不可勝數。", "秋天到了，果園裡的柿子多得車載斗量。", "j"], ["多多益善", "益", "指愈多愈好。", "環保志工說，回收的寶特瓶多多益善，歡迎大家踴躍捐出。", "j"], ["名副其實", "副", "名聲或名稱與實際相符合。", "這家店的牛肉麵又大碗又好吃，真是名副其實的「巨無霸麵」。", "j"], ["大義滅親", "滅", "比喻為了維護公理正義，不徇私情，滅了犯罪的親人，或讓他們接受法律制裁。", "故事裡的包青天大義滅親，依法處罰了犯錯的姪子。", "j"], ["觸目驚心", "觸", "形容事情景況，令人震驚。", "海灘上堆滿了塑膠垃圾，景象觸目驚心。", "j"]]}, {"n": 6, "items": [["荒謬絕倫", "荒", "形容荒唐、錯誤到了極點。", "有人說吃肥皂可以變聰明，這種說法真是荒謬絕倫。", "j"], ["永垂不朽", "朽", "永遠流傳而不可磨滅。", "這位科學家的偉大發明，將會永垂不朽。", "j"], ["駕輕就熟", "駕", "比喻對事情很熟悉，做起來很輕鬆。", "姊姊做了好幾年的蛋糕，現在做起來駕輕就熟。", "j"], ["盛氣凌人", "凌", "用傲慢的氣勢壓迫別人。", "他仗著自己是班長，常常盛氣凌人的命令同學做事。", "j"], ["巧奪天工", "奪", "雖然是人工所製，但是精巧勝過天然。形容技藝巧妙。", "這座用米粒雕刻的小佛像巧奪天工，令人讚嘆。", "j"]]}, {"n": 7, "items": [["一勞永逸", "勞", "辛苦一次，以後就能長久輕鬆。", "把書架重新整理好，以後找書就一勞永逸了。", "j"], ["飢不擇食", "擇", "餓的時候什麼都吃，比喻急著要的時候，來不及挑選。", "露營時食物吃光了，大家飢不擇食，連乾麵包都吃得津津有味。", "j"], ["削足適履", "履", "把腳削小去穿小鞋，比喻不知變通，硬要套用不合適的方法。", "老師說作文要有自己的想法，不必削足適履，硬套範文的格式。", "j"], ["隔靴搔癢", "搔", "隔著靴子抓癢，比喻沒有抓到重點，沒有用。", "他的建議都是隔靴搔癢，根本解決不了問題。", "j"], ["進退維谷", "維", "往前、往後都走不通，非常為難。", "答應了兩個朋友同一天的邀約，他現在進退維谷，不知道該去哪裡。", "j"]]}, {"n": 8, "items": [["怨聲載道", "怨", "到處都是抱怨的聲音，形容大家都很不滿。", "學校冷氣一壞，教室熱得像烤箱，大家怨聲載道。", "j"], ["枕戈待旦", "枕", "枕著武器等天亮，形容隨時準備作戰。", "決賽前一晚，選手們枕戈待旦，早早就把裝備準備好。", "j"], ["三頭六臂", "臂", "比喻本領非常大。", "就算有三頭六臂，也不可能一天寫完一整本練習簿。", "j"], ["生靈塗炭", "炭", "形容百姓生活在極困苦的環境中。", "歷史課本寫到，戰亂讓當時的百姓生靈塗炭。", "j"], ["千頭萬緒", "緒", "事情又多又亂，不知從哪裡開始。", "剛搬家時千頭萬緒，媽媽列了一張清單，一件一件慢慢做。", "j"]]}, {"n": 9, "items": [["寡不敵眾", "寡", "人少的打不過人多的。", "躲避球比賽時，我們班只剩兩個人，最後還是寡不敵眾。", "j"], ["野心勃勃", "勃", "非常想要得到更多、做更大的事。", "故事裡的國王野心勃勃，想把附近的國家都占為己有。", "j"], ["顛沛流離", "顛", "生活困苦，四處漂泊沒有安定的家。", "戰爭讓許多家庭顛沛流離，一直找不到安身的地方。", "j"], ["借花獻佛", "獻", "用別人的東西來做人情。", "同學送我的餅乾太多了，我借花獻佛，分給老師嘗嘗。", "j"], ["群策群力", "策", "大家一起出主意、出力氣。", "為了辦好園遊會，全班群策群力，想出許多好點子。", "j"]]}, {"n": 10, "items": [["亦步亦趨", "亦", "別人怎麼做就跟著怎麼做，沒有自己的主見。", "學畫畫可以先模仿，但不要永遠亦步亦趨，要畫出自己的風格。", "j"], ["過猶不及", "猶", "做得太過頭，和做得不夠一樣不好。", "運動很好，但一次練太久反而受傷，真是過猶不及。", "j"], ["放蕩不羈", "蕩", "個性自由奔放，不受規矩約束。", "故事裡的俠客放蕩不羈，總是一個人四處闖蕩。", "j"], ["靡靡之音", "靡", "讓人提不起精神、意志消沉的音樂。", "考前一直聽讓人想睡的靡靡之音，越聽越沒精神。", "j"], ["愛莫能助", "莫", "心裡很想幫忙，卻沒有能力幫。", "同學問我高中數學題，我實在愛莫能助。", "j"]]}, {"n": 11, "items": [["肅然起敬", "肅", "心裡受到感動，產生尊敬的心情。", "聽到清潔阿姨默默打掃校園三十年，大家都肅然起敬。", "j"], ["敷衍塞責", "敷", "做事不認真，只是隨便應付。", "他打掃時敷衍塞責，桌子底下的垃圾都沒撿。", "j"], ["袖手旁觀", "袖", "把手放在袖子裡，在旁邊看，不肯幫忙。", "看到同學的書掉滿地，我們不能袖手旁觀。", "j"]]}, {"n": 12, "items": [["骨瘦如柴", "瘦", "瘦得像木柴一樣，形容非常瘦。", "被救回來的流浪貓骨瘦如柴，大家細心照顧牠。", "j"], ["亡命之徒", "徒", "不顧性命、什麼壞事都敢做的人。", "電影裡的亡命之徒開著車到處逃，最後還是被警察抓到。", "j"], ["牛衣對泣", "泣", "夫妻一起過著非常貧困的日子。", "爺爺奶奶年輕時曾經牛衣對泣，後來靠努力才讓日子好轉。", "j"]]}],
  comic:{"風塵僕僕": [["🧳", "👨", "坐了十幾個小時的飛機和火車……"], ["🏠", "😮‍💨", "終於到家了！"], "爸爸出差一週，＿＿的趕回家過年。"], "蓬頭垢面": [["⛺", "👦", "在山上露營三天，都沒辦法洗澡……"], ["🪞", "😵", "（頭髮亂翹，臉上都是泥巴）"], "露營回來的弟弟＿＿，媽媽差點認不出他。"], "鳳毛麟角": [["🔍", "👧", "全校兩千人，有誰會說五種語言？"], ["🌟", "👩‍🏫", "只有一位，就是校長！"], "能說五種語言的人非常少，簡直是＿＿。"], "野人獻曝": [["📋", "👦", "我有一個小點子，不知道有沒有用……"], ["💡", "👦", "或許我們可以把回收紙做成筆記本？"], "他謙虛的說自己只是＿＿，提供一點淺見。"], "錦上添花": [["🏆", "👧", "我得到作文比賽第一名了！"], ["🎂", "🥳", "而且今天剛好是我的生日！"], "得獎又剛好過生日，真是＿＿。"], "白駒過隙": [["🎒", "👶", "（一年級第一天上學）"], ["🎓", "🧑", "（一眨眼，已經要畢業了！）"], "時間過得真快，六年就像＿＿一樣。"], "禮尚往來": [["🎁", "👵", "這是我包的粽子，送給你們吃！"], ["🎁", "👩", "謝謝！這是我們烤的鳳梨酥，請您嚐嚐！"], "鄰居送來粽子，媽媽也＿＿，回送鳳梨酥。"], "朝三暮四": [["⚽", "👦", "我要加入足球社！"], ["🎨", "👦", "算了，我改加入美術社……不，還是熱舞社好了！"], "他一下想參加這個，一下又想參加那個，真是＿＿。"], "一瀉千里": [["⛰️", "🌧️", "（山上下了一整夜的大雨）"], ["🏞️", "😲", "哇！河水衝得好快啊！"], "暴雨過後，溪水＿＿，大家都不敢靠近。"], "退避三舍": [["🌳", "🐝", "（花圃旁邊有一個好大的蜂窩）"], ["🏃", "😨", "快走快走，離它遠一點！"], "大家看到那個大蜂窩，都＿＿，不敢靠近。"], "草木皆兵": [["👻", "👦", "剛剛看完恐怖片……"], ["🌳", "😱", "窗外的樹影是不是有人？！那是什麼聲音？！"], "看完恐怖片，他＿＿，連樹影都以為是壞人。"], "蓬蓽生輝": [["🏠", "👴", "歡迎歡迎！您能來我家，真是太榮幸了！"], ["🏠", "👨‍🎨", "您太客氣了！"], "大畫家來家裡作客，爺爺覺得＿＿。"], "深居簡出": [["🏡", "👵", "（老奶奶每天在家種花、看書）"], ["🏡", "👦", "奶奶，您怎麼都不出門呀？"], "隔壁的老奶奶＿＿，很少看到她出門。"], "萬籟俱寂": [["🌙", "🦉", "（深夜兩點）"], ["🌙", "😴", "（連一點聲音都沒有）"], "到了深夜，整個村莊＿＿，大家都睡了。"], "揚湯止沸": [["🏠", "👨", "屋頂漏水，先拿桶子接著吧。"], ["🪣", "😩", "可是桶子一下就滿了，還是一直漏……"], "只拿桶子接水卻不修屋頂，只是＿＿。"], "飛黃騰達": [["📜", "🧑", "（一個窮書生每天認真讀書）"], ["👑", "🤴", "（考上狀元後，當上了大官）"], "那位書生考上狀元後＿＿，當了大官。"], "唯唯諾諾": [["🏢", "👨‍💼", "這個計畫就照我說的做！"], ["🏢", "🙇", "是是是，好好好，您說得都對……"], "不管主管說什麼，他都＿＿，從不表達意見。"], "搖旗吶喊": [["🏟️", "🏃", "（選手正在跑最後一圈）"], ["📣", "🙌", "加油！加油！衝啊！"], "同學們在場邊＿＿，為選手加油打氣。"], "本末倒置": [["📚", "👧", "我花了兩個小時把筆記畫得好漂亮！"], ["📚", "😱", "可是……內容一個字都沒背到！"], "把時間都花在美化筆記，卻沒有讀書，真是＿＿。"], "車載斗量": [["🍊", "👨‍🌾", "今年的橘子大豐收！"], ["🚚", "😄", "一車、兩車、三車……怎麼載都載不完！"], "今年橘子大豐收，多到＿＿。"], "多多益善": [["📚", "👩‍🏫", "圖書館要募集二手書，"], ["📦", "😊", "越多越好，有多少都可以拿來！"], "老師說捐書不限數量，＿＿。"], "名副其實": [["🐟", "👦", "聽說這座湖叫做「魚湖」……"], ["🎣", "😲", "哇！一放下釣竿就釣到魚！"], "這座湖裡到處都是魚，真是＿＿的「魚湖」。"], "大義滅親 const vbtn = w => VIDEO[w] ? `<button class="vbtn" type="button" data-video="${w}">🎬 看動畫</button>` : "";
function openVideo(w){
  const f=VIDEO[w]; if(!f) return;
  closeVideo();
  const d=document.createElement("div"); d.className="vmodal"; d.id="vmodal";
  d.setAttribute("role","dialog"); d.setAttribute("aria-label",w+" 成語動畫");
  d.innerHTML=`<div class="vbox"><div class="vhead"><b>${w}</b><button type="button" class="vclose" aria-label="關閉">✕</button></div>
    <video src="https://teacher-liujikan.github.io/idiompractice/videos/${f}.mp4" poster="https://teacher-liujikan.github.io/idiompractice/videos/${f}.jpg" controls autoplay playsinline preload="auto"></video></div>`;
  document.body.appendChild(d);
  d.addEventListener("click",e=>{ if(e.target===d||e.target.closest(".vclose")) closeVideo(); });
  d.querySelector(".vclose").focus({preventScroll:true});
}
function closeVideo(){ const d=document.getElementById("vmodal"); if(d){ const v=d.querySelector("video"); if(v) v.pause(); d.remove(); } }
document.addEventListener("click",e=>{ const b=e.target.closest("[data-video]"); if(b){ e.preventDefault(); e.stopPropagation(); openVideo(b.dataset.video); } },true);
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeVideo(); });
let GRADE, LESSONS, ALL, COMIC, ALLKEYS, HAS_J;
function loadGrade(g){
  GRADE=g; LESSONS=DATA[g].lessons; COMIC=DATA[g].comic; ALL=[];
  LESSONS.forEach(L => L.items.forEach(([w,k,e,s,src],i) => ALL.push({id:L.n+"-"+i, lesson:L.n, w, keys:[...k], exp:e, sent:s, src:src==="j"?"j":"ext"})));
  HAS_J = ALL.some(x=>x.src==="j") && ALL.some(x=>x.src==="ext");
  ALLKEYS = [...new Set(ALL.flatMap(x=>x.keys))];
}

const GAMES = [
  {id:"comic", ico:"💬", name:"情境漫畫填空",   desc:"看漫畫猜情境，選出最適合的成語。"},
  {id:"exp",   ico:"📖", name:"看解釋，選成語", desc:"讀解釋，從四個成語中選出正確的。"},
  {id:"sent",  ico:"✏️", name:"造句填空",       desc:"句子少了一個成語，把它找回來！"},
  {id:"miss",  ico:"🔍", name:"生字大搜查",     desc:"成語缺了一個生字，選出正確的字。"},
  {id:"order", ico:"🧩", name:"成語排排站",     desc:"四個字亂掉了，依順序點回來。"},
  {id:"mem",   ico:"🃏", name:"翻翻配對",       desc:"翻開卡片，把成語和解釋配成一對。"},
  {id:"flash", ico:"🗂️", name:"成語字卡",       desc:"一張一張看，點卡片看注音、解釋和例句。"}
];

const $app = document.getElementById("app");
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const tz = (str, cls=[]) => `<span class="tz">${[...str].map((c,i)=>`<span class="${cls[i]||""}">${c}</span>`).join("")}</span>`;

/* ---------- settings ---------- */
let S;
function loadS(){
  S = {lessons:LESSONS.map(l=>l.n), count:10, src:"all"};
  try{ const saved=JSON.parse(localStorage.getItem("cy8-g"+GRADE)); if(saved&&Array.isArray(saved.lessons)) S=Object.assign(S,saved); }catch(e){}
  S.lessons=LESSONS.map(l=>l.n);
  if(!["all","ext","j"].includes(S.src)) S.src="all";
}
const saveS = () => { try{ localStorage.setItem("cy8-g"+GRADE, JSON.stringify(S)); }catch(e){} };
function setGrade(g){
  loadGrade(g); loadS();
  try{  }catch(e){}
  try{  }catch(e){}
  document.title = "成語練功房｜南一" + GNAME[g] + "上";
}
function initialGrade(){ return 3;

  const m = (location.hash||"").match(/g([3-6])/) || (location.search||"").match(/g=([3-6])/);
  if(m) return +m[1];
  try{ const v=+localStorage.getItem("cy-grade"); if(DATA[v]) return v; }catch(e){}

const srcOK = x => !HAS_J || S.src==="all" || x.src===S.src;
const pool = () => ALL.filter(x => S.lessons.includes(x.lesson) && srcOK(x));
const lessonCount = n => ALL.filter(x => x.lesson===n && srcOK(x)).length;
const SRCS = [["all","全部"],["j","課本成語"],["ext","延伸成語"]];

/* ---------- 字型狀態 ---------- */
let FONT_OK = null;
function updateFontInfo(){
  const el = document.getElementById("fontinfo");
  if(!el) return;
  if(FONT_OK === true) el.innerHTML = "<br>字型：教育部標準楷書（中華民國教育部，創用CC 姓名標示-禁止改作 3.0 臺灣版）。";
  else if(FONT_OK === false) el.innerHTML = "<br>此裝置未載入教育部標準楷書，目前以系統字型顯示，部分字形可能與課本不同。";
  else el.textContent = "";
}
function checkFont(){
  try{
    if(!document.fonts || !document.fonts.load){ FONT_OK = false; updateFontInfo(); return; }
    document.fonts.load('20px "EduKai"', "成語練功房").then(()=>{
      const faces = [...document.fonts].filter(f => f.family.replace(/["']/g, "") === "EduKai");
      FONT_OK = faces.some(f => f.status === "loaded");
      updateFontInfo();
    }).catch(()=>{ FONT_OK = false; updateFontInfo(); });
  }catch(e){ FONT_OK = false; updateFontInfo(); }
}

/* ---------- game shell ---------- */
let G;
function start(mode, customItems){
  const items = customItems || pool();
  if(mode==="mem") return memory(items);
  if(mode==="flash") return flash(items);
  const n = S.count ? Math.min(S.count, items.length) : items.length;
  G = {mode, items, queue: shuffle(items).slice(0,n), i:0, score:0, wrong:[]};
  question();
}
function bar(title, info){
  return `<div class="bar"><button class="back" id="back">← 回首頁</button><h2>${title}</h2><span class="score">${info}</span></div>`;
}
function bindBack(){ $app.querySelector("#back").onclick=()=>home(); }
const gname = id => GAMES.find(g=>g.id===id).name;

function distractIdioms(item){
  return shuffle(ALL.filter(x=>x.w!==item.w)).slice(0,3).map(x=>x.w);
}

function question(){
  const q = G.queue[G.i], total=G.queue.length;
  const head = bar(gname(G.mode), `第 ${G.i+1}／${total} 題　得分 <b>${G.score}</b>`) +
    `<div class="progress"><i style="width:${G.i/total*100}%"></i></div>`;
  let body="", answer, opts, big=false;

  if(G.mode==="exp"){
    answer=q.w; opts=shuffle([q.w,...distractIdioms(q)]);
    body=`<div class="qcard"><span class="qtag">這是哪一個成語的意思？</span><p class="qtext">${q.exp}</p></div>`;
  } else if(G.mode==="sent"){
    answer=q.w; opts=shuffle([q.w,...distractIdioms(q)]);
    body=`<div class="qcard"><span class="qtag">空格裡應該填哪一個成語？</span><p class="qtext">${q.sent.replace(q.w,'<span class="blank">？</span>')}</p></div>`;
  } else if(G.mode==="miss"){
    const key = q.keys[Math.floor(Math.random()*q.keys.length)];
    const pos = [...q.w].indexOf(key);
    G.pos=pos; answer=key; big=true;
    const others = shuffle(ALLKEYS.filter(c=>c!==key && ![...q.w].includes(c))).slice(0,3);
    opts=shuffle([key,...others]);
    const shown=[...q.w].map((c,i)=>i===pos?"？":c).join("");
    const cls=[...q.w].map((c,i)=>i===pos?"hole":"");
    body=`<div class="qcard"><span class="qtag">缺了哪一個字？</span><div id="tzbox">${tz(shown,cls)}</div><p class="qtext" style="font-size:17px;color:var(--muted)">提示：${q.exp}</p></div>`;
  } else if(G.mode==="comic"){
    const cm=COMIC[q.w]; answer=q.w; opts=shuffle([q.w,...distractIdioms(q)]);
    const panel=(p,n)=>`<div class="panel-c"><span class="pnum">${n}</span><span class="scene">${p[0]}</span><div class="bubble${p[2].startsWith("（")?" narr":""}" style="margin-top:14px">${p[2].startsWith("（")?p[2]:"「"+p[2]+"」"}</div><div class="who">${p[1]}</div></div>`;
    body=`<div class="qcard"><span class="qtag">看漫畫，想一想要填哪個成語？</span>
      <div class="strip">${panel(cm[0],1)}${panel(cm[1],2)}</div>
      <p class="qtext">${cm[2].replace("＿＿",'<span class="blank">？</span>')}</p></div>`;
  } else if(G.mode==="order"){
    return orderQ(head, q);
  }

  $app.innerHTML = head + body +
    `<div class="choices">${opts.map(o=>`<button class="choice${big?" big":""}" data-o="${o}">${o}</button>`).join("")}</div>
     <div class="feedback" id="fb"></div>`;
  bindBack();
  $app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
    const ok = b.dataset.o===answer;
    $app.querySelectorAll(".choice").forEach(c=>{
      c.disabled=true;
      if(c.dataset.o===answer){ c.classList.add("right"); c.insertAdjacentHTML("beforeend",'<span class="circle"></span>'); }
      else if(c===b) c.classList.add("wrong");
      else c.classList.add("dim");
    });
    if(G.mode==="miss"){
      const cls=[...q.w].map((c,i)=>i===G.pos?(ok?"filled":"hole"):"");
      $app.querySelector("#tzbox").innerHTML=tz(q.w,cls);
    }
    if(G.mode==="sent"||G.mode==="comic"){ const bl=$app.querySelector(".blank"); bl.textContent=q.w; bl.style.color="var(--blue)"; bl.style.borderColor="var(--blue)"; }
    finish(ok,q);
  });
}

function finish(ok,q){
  if(ok) G.score++; else G.wrong.push(q);
  $app.querySelector(".score").innerHTML=`第 ${G.i+1}／${G.queue.length} 題　得分 <b>${G.score}</b>`;
  const fb=$app.querySelector("#fb");
  const last = G.i===G.queue.length-1;
  fb.className="feedback show "+(ok?"good":"bad");
  fb.innerHTML=`<h3>${ok?"⭕ 答對了！":"再想想～正確答案是「"+q.w+"」"}</h3>
    ${pron(q.w)}
    <p><span class="tagred">解釋</span>${q.exp}</p>
    <p><span class="tagblue">例句</span>${q.sent}</p>
    <div class="fx">${vbtn(q.w)}<button class="btn" id="next">${last?"看成績":"下一題"}</button></div>`;
  const nx=fb.querySelector("#next"); nx.focus({preventScroll:true});
  fb.scrollIntoView({behavior:"smooth",block:"nearest"});
  nx.onclick=()=>{ G.i++; if(G.i<G.queue.length) question(); else result(); };
}

/* ---------- 成語排排站 ---------- */
function orderQ(head,q){
  const chars=[...q.w];
  let order; do{ order=shuffle(chars.map((c,i)=>i)); }while(order.map(i=>chars[i]).join("")===q.w);
  let picked=[];
  const draw=()=>{
    const slots=chars.map((_,i)=>picked[i]!==undefined?chars[picked[i]]:"　");
    $app.innerHTML = head + `<div class="qcard"><span class="qtag">依照正確順序點字，排出成語</span>
      <div class="slots" id="slots">${tz(slots.join(""), slots.map(s=>s==="　"?"":"filled"))}</div>
      <p class="qtext" style="font-size:17px;color:var(--muted)">提示：${q.exp}</p>
      <div class="tiles">${order.map(i=>`<button class="tile" data-i="${i}" ${picked.includes(i)?"disabled":""}>${chars[i]}</button>`).join("")}</div>
      </div><div class="feedback" id="fb"></div>`;
    bindBack();
    $app.querySelectorAll(".slots .tz span").forEach((s,idx)=>s.onclick=()=>{ if(picked[idx]!==undefined && !G.locked){ picked=picked.slice(0,idx); draw(); } });
    $app.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{
      picked.push(+t.dataset.i); draw();
      if(picked.length===chars.length){
        G.locked=true;
        const got=picked.map(i=>chars[i]).join("");
        const ok=got===q.w;
        $app.querySelectorAll(".tile").forEach(x=>x.disabled=true);
        $app.querySelector("#slots").innerHTML = ok ? tz(q.w,chars.map(()=>"filled")) : tz(got,chars.map(()=>"hole"));
        finish(ok,q);
        setTimeout(()=>{G.locked=false},0);
      }
    });
  };
  G.locked=false; draw();
}

/* ---------- result ---------- */
function result(){
  const total=G.queue.length, pct=G.score/total;
  try{ parent.postMessage({type:'idiom8', mode:G.mode, score:G.score, total}, '*'); }catch(e){}
  const mark = pct===1?"滿分":pct>=.8?"優":pct>=.6?"甲":"加油";
  const words = pct===1?"太厲害了，全部答對！":pct>=.8?"很棒！只差一點點就滿分了。":pct>=.6?"不錯喔，把錯的再練一次會更好。":"多練幾次一定會進步！";
  $app.innerHTML = bar(gname(G.mode),"") + `
  <div class="qcard result">
    <div class="stamp">${mark}</div>
    <p class="big">答對 <b style="color:var(--red)">${G.score}</b> 題，共 ${total} 題</p>
    <p>${words}</p>
    <div class="actions">
      ${G.wrong.length?'<button class="btn" id="redo">只練錯的題目</button>':""}
      <button class="btn ghost" id="again">再玩一次</button>
      <button class="btn ghost" id="home2">換別的遊戲</button>
    </div>
    ${G.wrong.length?`<div class="wronglist"><h3>要再記熟的成語</h3>${G.wrong.map(w=>`<div class="witem"><b>${w.w}</b><span style="color:var(--muted);font-size:14px">　第${w.lesson}課</span><p class="zy-s">${zy(w.w)}</p><p>${w.exp}</p></div>`).join("")}</div>`:""}
  </div>`;
  bindBack();
  const mode=G.mode, items=G.items, wrong=[...G.wrong];
  if(wrong.length) $app.querySelector("#redo").onclick=()=>{ G={mode,items:wrong,queue:shuffle(wrong),i:0,score:0,wrong:[]}; question(); };
  $app.querySelector("#again").onclick=()=>start(mode,items);
  $app.querySelector("#home2").onclick=()=>home();
  window.scrollTo(0,0);
}

/* ---------- 翻翻配對 ---------- */
function memory(items){
  const chosen=shuffle(items).slice(0,Math.min(6,items.length));
  let cards=shuffle(chosen.flatMap(x=>[{id:x.id,t:"w",x},{id:x.id,t:"e",x}]));
  let open=[], done=0, moves=0, busy=false;
  const draw=()=>{
    $app.innerHTML = bar(gname("mem"),`翻了 <b>${moves}</b> 次`) +
      `<p style="color:var(--muted);margin:12px 0">把「成語」和它的「解釋」翻出來配成一對。共 ${chosen.length} 對。</p>
       <div class="mem">${cards.map((c,i)=>`<button class="mcard ${c.t==="w"?"idiom":""} ${c.done?"done":""} ${open.includes(i)?"open":""}" data-i="${i}" aria-label="${c.done||open.includes(i)?(c.t==="w"?c.x.w:c.x.exp):"蓋著的卡片"}">${c.t==="w"?c.x.w:c.x.exp}</button>`).join("")}</div>
       <div class="feedback" id="fb"></div>`;
    bindBack();
    $app.querySelectorAll(".mcard").forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i, c=cards[i];
      if(busy||c.done||open.includes(i)) return;
      open.push(i);
      if(open.length===2){
        moves++; const [a,b2]=open;
        if(cards[a].id===cards[b2].id && a!==b2){
          cards[a].done=cards[b2].done=true; open=[]; done++; draw();
          if(done===chosen.length) setTimeout(memDone,500);
        } else {
          busy=true; draw();
          $app.querySelectorAll(".mcard.open").forEach(el=>el.classList.add("miss"));
          setTimeout(()=>{open=[];busy=false;draw();},1000);
        }
      } else draw();
    });
  };
  const memDone=()=>{
    try{ parent.postMessage({type:'idiom8', mode:'mem', score:chosen.length, total:chosen.length}, '*'); }catch(e){}
    const best=chosen.length, mark=moves<=best+2?"優":moves<=best*2?"甲":"完成";
    $app.innerHTML = bar(gname("mem"),"") + `<div class="qcard result">
      <div class="stamp">${mark}</div>
      <p class="big">全部配對成功！翻了 <b style="color:var(--red)">${moves}</b> 次</p>
      <p>翻越少次越厲害，最少只要 ${best} 次喔。</p>
      <div class="actions"><button class="btn" id="again">再玩一局</button><button class="btn ghost" id="home2">換別的遊戲</button></div>
      <div class="wronglist"><h3>這局的成語</h3>${chosen.map(w=>`<div class="witem"><b>${w.w}</b><p class="zy-s">${zy(w.w)}</p><p>${w.exp}</p></div>`).join("")}</div></div>`;
    bindBack();
    $app.querySelector("#again").onclick=()=>memory(items);
    $app.querySelector("#home2").onclick=()=>home();
  };
  draw(); window.scrollTo(0,0);
}

/* ---------- 成語字卡 ---------- */
function flash(items){
  let deck=[...items], i=0, flipped=false;
  const draw=()=>{
    const c=deck[i];
    $app.innerHTML = bar(gname("flash"),`第 <b>${i+1}</b>／${deck.length} 張`) +
      `<div class="progress"><i style="width:${(i+1)/deck.length*100}%"></i></div>
      <div class="qcard flash" id="card" role="button" tabindex="0" aria-label="點一下翻面">
        ${flipped?`<div class="back-side">
            <div style="text-align:center">${tz(c.w,[...c.w].map(ch=>c.keys.includes(ch)?"filled":""))}</div>
            ${pron(c.w)}
            <p><span class="tagred">解釋</span>${c.exp}</p>
            <p><span class="tagblue">例句</span>${c.sent}</p>
            <p style="font-size:15px;color:var(--muted)">第${c.lesson}課・生字「${c.keys.join("、")}」</p>
            ${VIDEO[c.w]?`<p style="text-align:center">${vbtn(c.w)}</p>`:""}
          </div>`
        :`<span class="qtag">第${c.lesson}課${VIDEO[c.w]?"・🎬 有動畫":""}</span>${tz(c.w)}<span class="qtag">點一下看解釋</span>`}
      </div>
      <div class="flash-nav">
        <button class="btn ghost" id="prev" ${i===0?"disabled style='opacity:.4'":""}>← 上一張</button>
        <button class="speak" id="mix">🔀 打亂順序</button>
        <button class="btn" id="next">${i===deck.length-1?"完成":"下一張 →"}</button>
      </div>`;
    bindBack();
    const card=$app.querySelector("#card");
    card.onclick=()=>{flipped=!flipped;draw();};
    card.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();flipped=!flipped;draw();} };
    $app.querySelector("#mix").onclick=()=>{deck=shuffle(deck);i=0;flipped=false;draw();};
    $app.querySelector("#prev").onclick=()=>{ if(i>0){i--;flipped=false;draw();} };
    $app.querySelector("#next").onclick=()=>{ if(i<deck.length-1){i++;flipped=false;draw();} else home(); };
  };
  draw(); window.scrollTo(0,0);
}

setGrade(initialGrade());
home();
checkFont();
</script>
<script data-goatcounter="https://teacher-liujikan.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
