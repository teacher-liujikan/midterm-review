/* 關卡 */
.crumbs{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:.9rem}
.stage-title{font-family:var(--f-disp);font-size:1.9rem;margin:.4em 0 .1em}
.intro{max-width:60ch;color:var(--muted);margin-top:0}
.text-card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:18px 22px;margin:16px 0}
.text-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.text-head h2{margin:0;font-size:1.6rem}
.para{font-size:1.4rem;line-height:2;margin:.6em 0;max-width:34em}
.pno{font-family:var(--f-kai);border:1.5px solid var(--accent);color:var(--accent);background:none;border-radius:4px;min-width:1.6em;width:auto;white-space:nowrap;padding:0 .15em!important;height:1.6em;line-height:1;margin-right:.5em;font-size:1rem;vertical-align:.15em;padding:0}
.markbox,.words{margin:12px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:.25em .9em;font-family:var(--f-kai);font-size:1.05rem}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.words summary{cursor:pointer;font-weight:700}
.word-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:10px}
.word{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;display:grid}
.word b{font-size:1.3rem}.word span{font-size:.92rem;color:var(--muted)}
.group-banner{display:flex;gap:12px;align-items:baseline;border-radius:12px;padding:12px 18px;margin:12px 0}
.group-banner strong{font-size:1.4rem}
.qlist{display:grid;gap:14px;margin-top:16px}
.q{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px 18px;margin:0;min-width:0}
.q.miss{border-color:var(--no)}
.q legend{display:flex;gap:10px;align-items:flex-start;padding:0;font-weight:500;font-size:1.1rem;float:left;width:100%;margin-bottom:10px}
.q legend+*{clear:both}
.qno{flex:none;width:1.8em;height:1.8em;border-radius:50%;background:var(--ink);color:var(--card);display:grid;place-items:center;font-size:.85rem;font-variant-numeric:tabular-nums}
.qtag{flex:none;font-size:.78rem;border:1px solid var(--line);border-radius:4px;padding:.1em .45em;color:var(--muted);margin-top:.2em}
.qtext{min-width:0}

td.c.ok{background:var(--ok-soft);color:var(--ok);font-weight:700}td.c.no{background:var(--no-soft);color:var(--no);font-weight:700}td.c.txt{background:var(--teal-soft);color:var(--teal)}
tr.clickable{cursor:pointer}tr.clickable:hover td{outline:1px solid var(--line)}
.pill{display:inline-block;font-size:.78rem;border-radius:999px;padding:.05em .6em;background:var(--paper);border:1px solid var(--line)}.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}

.switch input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.two-col{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:16px}

.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:10px}

.opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}

.stars{display:flex;gap:4px;flex:0 0 auto}
.star{font-size:2rem;line-height:1;width:48px;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:#cfc6ba;padding:0}
.star.on{color:#f0a500;border-color:#f0a500;background:#fff7e0}
.peer-res{margin-top:12px;border:2px solid #f0a500;background:#fffaf0;border-radius:14px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:#2d2420}
.peer-res.big{font-size:1.3rem}
.peer-avg{display:flex;flex-wrap:wrap;gap:6px 18px;width:100%}
.peer-avg i{font-style:normal;color:#86766a;font-size:.85em}
.peer-pr{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.starbar{display:inline-block;letter-spacing:.05em;background:linear-gradient(90deg,#f0a500 var(--v),#d9d0c4 var(--v));-webkit-background-clip:text;background-clip:text;color:transparent;font-size:1.25em}
.peer-tv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2vh 2vw;width:100%}
.peer-tvc{background:#fffdf8;color:#2d2420;border-radius:18px;padding:1.6vh 1.4vw;text-align:left;display:flex;flex-direction:column;gap:.8vh}
.peer-tvc h3{margin:0;font-size:clamp(20px,3vh,34px)}
.peer-poem{margin:0;font-size:clamp(16px,2.5vh,28px);line-height:1.5}
.peer-tvc .peer-avg{font-size:clamp(16px,2.4vh,28px)}
.peer-top{margin:0;font-size:clamp(15px,2.2vh,26px)}
@media (max-width:700px){.peer-grid,.peer-tv{grid-template-columns:1fr}}
.lad-one #peerGo{position:absolute;top:18px;right:24px;left:auto;width:auto;font-size:1.05rem;padding:.5em 1em}
.one-all p span{display:block}
.swall-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:10px;align-items:start}
.swall-card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.swall-card.mine{border-color:var(--accent)}
.swall-card h2{margin:0 0 8px;font-size:1.3rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.swall-card h2 em{font-style:normal;font-size:.8rem;background:var(--accent);color:#fff;border-radius:999px;padding:2px 10px}
.swall-poem{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.swall-poem li{border-left:5px solid var(--line);padding:2px 0 2px 10px}
.swall-poem li.sw-rose{border-color:var(--rose)}.swall-poem li.sw-gold{border-color:var(--gold)}.swall-poem li.sw-teal{border-color:var(--teal)}.swall-poem li.sw-blue{border-color:#4258b8}
.swall-poem p{margin:4px 0 0;font-size:1.3rem;line-height:1.5}
@media (max-width:700px){.swall-grid{grid-template-columns:1fr}}
.link-go{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin-top:14px}.big-link{display:inline-block;font-size:1.5rem;padding:16px 28px;border-radius:16px;text-decoration:none}
.para-h{margin:.8em 0 .2em;font-size:1.15em;color:var(--accent)}
.vcol.vhead{font-weight:700;color:var(--accent);margin-top:1.2em}
</style>

function myRec(stageId) {

let saveTimers = {};
function queueSave(stageId, now) {

  LS.set(`${LESSON.key}-me-${st.cls}-${st.seat}`, st.recs);

async function flush() {
  const ids = Object.keys(pending);
  if (!ids.length) { setSync('ok'); return; }
  for (const id of ids) {
    try { await API.save(st.cls, st.seat, id, pending[id]); delete pending[id]; LS.set(PKEY(), pending); }

async function refreshMine() {

function stageStatus(s) {
  const r = st.recs[s.id];
  if (!isOpen(s.id)) return ['lock', '未開放'];
  if (s.id === 'review') return st.preview ? ['go', '預覽'] : st.recs.post?.done ? (r?.done ? ['done', '完成'] : ['go', '可以開始']) : ['lock', '先完成後測'];
  if (s.bonus) { if (!st.preview && !st.recs.pre?.done) return ['lock', '先完成預習單']; if (!st.preview && !st.recs.pre?.extra?.check?.ok) return ['lock', '等老師檢核']; const b = r?.extra || {}; const n = (b.radical?.done ? 1 : 0) + (b.diff?.done ? 1 : 0) + (Object.keys(b.strokes || {}).length ? 1 : 0) + (Object.keys(b.idiom || {}).length ? 1 : 0); return n ? ['doing', `玩了 ${n} / 4 個`] : ['go', '可以開始']; }
  if (s.wallView) return ['go', '可以看'];
  if (s.link) return ['go', '可以開始'];
  if (s.frame) return ['go', '可以開始'];
  if (s.peer) { const n = Object.values(r?.ans || {}).filter(peerFull).length; return n >= THEMES.length - 1 ? ['done', '完成'] : n ? ['doing', `評了 ${n} 組`] : ['go', '可以開始']; }
  if (s.id === 'stroke') { const n = (r?.extra?.written || []).length; return n >= CHARS.length ? ['done', '完成'] : n ? ['doing', `${n}/15`] : ['go', '可以開始']; }
  if (s.review && r?.done && !r.extra?.check?.ok) return ['wait', r.extra?.check ? '要訂正' : '等老師檢核'];
  if (r?.done) return ['done', '完成'];
  if (r && Object.keys(r.ans).length) return ['doing', '進行中'];
  if (s.diff && !s.themed && (!myGroup(s.diff) || (!st.preview && !st.cfg?.ov?.[s.diff] && !gRec(s.diff, x => st.recs[x])?.reviewed))) return ['wait', gTests(s.diff).length ? '先做檢測和󠇡檢討' : '等老師分組'];
  return ['go', '可以開始'];
}

let _PZ = null;

  return _PZ[i];
}

  const h = LESSON.heads?.[i]; if (!h) return ''; const zy = (typeof HEAD_ZY !== 'undefined' && HEAD_ZY[i]) || []; let k = 0;
  return [...h].map(ch => { if (/[一-鿿]/.test(ch)) { const z = zy[k++]; const v = typeof ZY_IVS !== 'undefined' && (ZY_IVS[ch] || {})[z]; return v ? ch + String.fromCodePoint(0xE01E0 + v) : ch; } return ch; }).join('');
}

  </article>

function speak(text) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(sayFix(String(text).replace(/[\u{E0100}-\u{E01EF}]/gu, '')));
    const v = speechSynthesis.getVoices().find(v => /zh[-_]TW/i.test(v.lang)) || speechSynthesis.getVoices().find(v => /^zh/i.test(v.lang));
    if (v) u.voice = v; u.lang = 'zh-TW'; u.rate = 0.85;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function bindText() {
  $('#readAll') && ($('#readAll').onclick = () => speak(LESSON.paras.join('')));
  document.querySelectorAll('.pno').forEach(b => b.onclick = () => speak(LESSON.paras[+b.dataset.p]));

  document.querySelectorAll('.chip[data-read]').forEach(b => b.onclick = () => {

    document.querySelectorAll('.chip[data-read]').forEach(x => x.classList.toggle('on', +x.dataset.read <= rec.extra.reads)); queueSave(st.stage);
  });
  document.querySelectorAll('.chip[data-w]').forEach(b => b.onclick = () => {
    const rec = myRec(st.stage); const m = rec.extra.marked || [];
    const w = b.dataset.w; rec.extra.marked = m.includes(w) ? m.filter(x => x !== w) : [...m, w];
    b.classList.toggle('on'); queueSave(st.stage);
  });
}

// ===== 關卡頁 =====
function renderStage() {

  else if (s.id === 'stroke') body = strokeBody();

}

// ===== 小組互評（學生端）：別組上臺時給星星和󠇡一󠇡句好話 =====
const peerFull = v => v && Array.isArray(v.c) && v.c.length === PEER.crit.length && v.c.every(x => x >= 1) && !!v.p;
// 老師指定「現在報告」的組（存在 unlocked 的 peer:N）；沒有指定時，每一󠇢組都可以評
function peerNow(list) { const u = (list || []).find(x => /^peer:[1-4]$/.test(x)); return u ? +u.slice(5) : 0; }
function peerBody(s) {
  const rec = myRec(s.id); const home = st.preview ? (st.pvHome || 1) : (myHome() || rec.extra.home || null);
  if (!home) return `<div class="notice"><p>你的原組是第幾組？（看電視上的名單）</p><div class="home-pick">${THEMES.map((t, i) => `<button type="button" class="primary" data-phome="${i + 1}">第 ${i + 1} 組</button>`).join('')}</div></div>`;
  const now = st.preview ? 0 : peerNow(st.cfg?.unlocked);
  const card = g => { const v = rec.ans['g' + g] || { c: [], p: '' }; const mine = g === home; const full = peerFull(v);
    const open = !mine && (!now || now === g || full || (v.c || []).some(Boolean));
    return `<section class="peer-card ${mine ? 'mine' : ''} ${now === g ? 'now' : ''} ${full ? 'full' : ''}" data-pg="${g}">
      <h2><span class="peer-n">第 ${g} 組</span><span class="kai">${esc(THEMES[g - 1])}</span>${now === g && !mine ? '<em>現在上臺</em>' : ''}${full ? '<em class="ok">已送出 ✓</em>' : ''}</h2>
      ${mine ? '<p class="muted">這是你們這一󠇢組，不󠇡用評分。上臺時，念得󠇡大聲又清楚！</p>'
        : !open ? '<p class="muted">還沒輪到這一󠇢組，等他們上臺再評。</p>'
        : `${PEER.crit.map(([n, d], k) => `<div class="peer-row"><div class="peer-lab"><b>${esc(n)}</b><span>${esc(d)}</span></div>
            <div class="stars" role="group" aria-label="${esc(n)}">${[1, 2, 3].map(x => `<button type="button" class="star ${(v.c[k] || 0) >= x ? 'on' : ''}" data-star="${g}|${k}|${x}" aria-label="${x} 顆星" aria-pressed="${(v.c[k] || 0) >= x}">★</button>`).join('')}</div></div>`).join('')}
          <div class="peer-row col"><div class="peer-lab"><b>送一󠇡句好話</b><span>選一󠇡個󠇡他們做得󠇡最好的地方</span></div>
            <div class="chips">${PEER.praise.map(pz => `<button type="button" class="chip ${v.p === pz ? 'on' : ''}" data-praise="${g}|${esc(pz)}">${esc(pz)}</button>`).join('')}</div></div>`}
    </section>`; };
  return `<div class="group-banner g-teal"><span>你的原組</span><strong>第 ${home} 組</strong><span class="theme-tag">主角「<b>${esc(THEMES[home - 1])}</b>」</span></div>
    ${st.preview ? `<div class="pv-switch"><span class="label">預覽原組</span>${THEMES.map((t, i) => `<button type="button" class="chip ${(st.pvHome || 1) === i + 1 ? 'on' : ''}" data-pvh="${i + 1}">第 ${i + 1} 組・${t}</button>`).join('')}</div>` : ''}
    <p class="muted">星星愈多愈棒：★ 還可以更好　★★ 不󠇡錯　★★★ 太棒了</p>

function bindPeer(s) {
  const rec = myRec(s.id);
  const keep = () => { const y = window.scrollY; renderStage(); window.scrollTo(0, y); };
  document.querySelectorAll('[data-phome]').forEach(b => b.onclick = () => { rec.extra.home = +b.dataset.phome; queueSave(s.id, true); keep(); });
  document.querySelectorAll('[data-pvh]').forEach(b => b.onclick = () => { st.pvHome = +b.dataset.pvh; keep(); });
  const cur = g => { if (!rec.ans['g' + g]) rec.ans['g' + g] = { c: [], p: '' }; return rec.ans['g' + g]; };
  const after = () => { rec.done = Object.values(rec.ans).filter(peerFull).length >= THEMES.length - 1; queueSave(s.id, true); keep(); };
  document.querySelectorAll('[data-star]').forEach(b => b.onclick = () => { const [g, k, x] = b.dataset.star.split('|').map(Number); const v = cur(g); v.c[k] = v.c[k] === x && x === 1 ? 0 : x; for (let i = 0; i < PEER.crit.length; i++) v.c[i] = v.c[i] || 0; sfx && sfx('tap'); after(); });
  document.querySelectorAll('[data-praise]').forEach(b => b.onclick = () => { const [g, pz] = b.dataset.praise.split('|'); const v = cur(+g); v.p = v.p === pz ? '' : pz; after(); });
}

// ===== 小短文作品牆（學生端）：讀每個󠇡座號的專家任務句子󠇡，照原組排成四篇小短文 =====
let swallT = null, swallData = null;
async function swallLoad() {
  const ex = stageById('expert'); const lvOf = {}; Object.keys(ex.byGroup).forEach(k => { const it = ex.byGroup[k].find(x => x.t === 'text'); if (it) lvOf[it.id] = k; });
  const size = st.cfg?.size || 16; const seats = Array.from({ length: size }, (_, i) => i + 1);
  const rows = await Promise.all(seats.map(async n => { try { const j = n === +st.seat && !st.preview ? { cfg: st.cfg, recs: [st.recs.expert].filter(Boolean) } : await API.mine(st.cls, n);
    const r = (j.recs || []).find(x => x.stage === 'expert'); if (!r) return null;
    const id = Object.keys(lvOf).find(k => r.ans && String(r.ans[k] || '').trim()); if (!id) return null;
    const v = j.cfg?.ov?.v; const home = v && /^[1-4]$/.test(String(v)) ? +v : +(r.extra?.home || 0); if (!home) return null;
    return { seat: n, home, lv: lvOf[id], v: String(r.ans[id]).trim() }; } catch (e) { return null; } }));

}
function swallHtml() {

        return `<li class="sw-${GROUPS[k].tone}"><span class="gchip g-${GROUPS[k].tone}">${j + 1}. ${LADDER[k]}</span>${rs.length ? rs.map(r => `<p class="kai">${esc(r.v)}</p>`).join('') : '<p class="muted">（還沒寫）</p>'}</li>`; }).join('')}</ol></section>`; }).join('')}</div>`;
}
function swallBody() { return `<div class="quick"><button type="button" class="ghost sm" id="swRe">🔄 重󠇡新整理</button><span class="muted" id="swT"></span></div><div id="swall">${swallHtml()}</div>`; }
function bindSwall() {

    if (!group || (!st.preview && !st.cfg?.ov?.[s.diff] && !gRec(s.diff, x => st.recs[x])?.reviewed)) return gTests(s.diff).length ? `<div class="notice">先完成${gNames(s.diff)}並看完檢討，網站會自動幫你分組，再回來這裡。</div>` : `<div class="notice">老師還沒幫你分組喔！等老師分好組，按右上角「重󠇡新整理」。</div>`;

  const items = itemsFor(s, group);

    s.themed && st.preview ? `<div class="pv-switch"><span class="label">預覽原組</span>${THEMES.map((t, i) => `<button type="button" class="chip ${(st.pvHome || 1) === i + 1 ? 'on' : ''}" data-pvh="${i + 1}">第 ${i + 1} 組・${t}</button>`).join('')}</div>` : '',

  if (locked) {

    const lastOne = s.group && hasDiff(s.group) && gTests(s.group).filter(t => t.id !== s.id).every(t => st.recs[t.id]?.done && st.recs[t.id]?.extra?.reviewed);
    if (s.group && !rec.extra.reviewed && s.holdReview && !revealed(s.id)) {

        ${it.t === 'cut' ? `<p class="rv-line"><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '答對' : '再想想'}</span>你縮短的句子󠇡：<b class="kai">${esc(cutResult(it, v))}</b></p><p class="rv-line">參考答案：<b class="kai">${cutRef(it).map(esc).join('　或　')}</b></p>`
        : `<p class="rv-line"><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '答對' : '答錯'}</span>你選：${esc(it.o[v] ?? '沒作答')}${ok ? '' : `　正確答案：<b>${esc(it.o[it.a])}</b>`}</p>`}

      if (s.paged) { const i = items.indexOf(it); if (i < items.length - 1) setTimeout(() => { if ((PAGE[s.id] || 0) === i) goPage(s, i + 1); }, 450); }
    }
  });
  form.querySelectorAll('[data-cut]').forEach(b => b.onclick = () => {
    const it = items.find(x => x.id === b.dataset.cut); const k = +b.dataset.k;
    const cur = Array.isArray(rec.ans[it.id]) ? rec.ans[it.id] : [];
    rec.ans[it.id] = cur.includes(k) ? cur.filter(x => x !== k) : [...cur, k].sort((a, b) => a - b);
    rec.ok[it.id] = cutOk(it, rec.ans[it.id]);
    if (s.group) rec.extra.group = s.group;
    queueSave(s.id); const y = scrollY; renderStage(); scrollTo(0, y);
  });
  form.querySelectorAll('[data-cutreset]').forEach(b => b.onclick = () => { const id = b.dataset.cutreset; rec.ans[id] = []; rec.ok[id] = false; queueSave(s.id); const y = scrollY; renderStage(); scrollTo(0, y); });
  bindGames(s, items, rec, () => { const y = scrollY; renderStage(); scrollTo(0, y); });
  form.querySelectorAll('.mitem').forEach(b => b.onclick = () => {
    const id = b.dataset.mid; const it = items.find(x => x.id === id); const m = rec.ans[id] = rec.ans[id] || {};
    if (b.dataset.l != null) { matchSel[id] = +b.dataset.l; form.querySelectorAll(`.mitem.L[data-mid="${id}"]`).forEach(x => x.classList.toggle('sel', x === b)); return; }
    const L = matchSel[id]; if (L == null) { b.classList.add('shake'); setTimeout(() => b.classList.remove('shake'), 300); return; }
    const R = +b.dataset.r;
    if (R === L) { m[L] = R; delete matchSel[id]; try { sfx('ok'); } catch (e) {} }
    else { rec.extra.mmiss = rec.extra.mmiss || {}; rec.extra.mmiss[id] = (rec.extra.mmiss[id] || 0) + 1; b.classList.add('shake'); try { sfx('no'); } catch (e) {} setTimeout(() => b.classList.remove('shake'), 300); queueSave(s.id); return; }
    if (Object.keys(m).length === it.pairs.length) { const miss = (rec.extra.mmiss || {})[id] || 0; rec.ok[id] = true; if (rec.first[id] == null) rec.first[id] = miss === 0; }
    queueSave(s.id); const y = scrollY; renderStage(); scrollTo(0, y);
  });
  form.querySelectorAll('.topic').forEach(b => b.onclick = () => {
    const it = items.find(x => x.id === b.dataset.tid); const [t, idm, start] = it.topics[+b.dataset.tk];
    const ta = $(`#ta-${it.id}`); const cur = (ta.value || '').trim();
    if (!cur || it.topics.some(x => cur === x[2])) { ta.value = start; rec.ans[it.id] = start; queueSave(s.id); updateLeft(); }
    ta.placeholder = `接著寫，記得󠇡用上一󠇡個󠇡成語（例如：${idm}）。`;
    form.querySelectorAll(`.topic[data-tid="${it.id}"]`).forEach(x => x.classList.toggle('on', x === b));
    ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  });
  form.querySelectorAll('textarea').forEach(t => t.oninput = () => { rec.ans[t.dataset.id] = t.value; queueSave(s.id); updateLeft(); });
  form.querySelectorAll('.hbtn').forEach(b => b.onclick = () => { rec.hints[b.dataset.id] = (rec.hints[b.dataset.id] || 0) + 1; queueSave(s.id); const y = scrollY; renderStage(); scrollTo(0, y); });
  form.onsubmit = (e) => {
    e.preventDefault();
    const need = items.filter(it => !it.opt);
    const miss = need.filter(it => !answered(it, rec));
    if (miss.length) {
      if (s.paged) goPage(s, items.indexOf(miss[0]));
      const q = form.querySelector(`.q[data-id="${miss[0].id}"]`); q.classList.add('miss'); q.scrollIntoView({ behavior: 'smooth', block: 'center' });
      $('#left').textContent = `還有 ${miss.length} 題沒寫`; return;
    }
    const mcs = items.filter(it => it.t === 'mc' || it.t === 'cut' || it.t === 'match' || GAME_T.includes(it.t));
    rec.max = mcs.length;
    rec.score = mcs.filter(it => (isTest || s.holdReview ? rec.ok[it.id] : rec.first[it.id])).length;
    if (group) rec.extra.group = group;
    rec.done = true; queueSave(s.id, true);
    renderStage(); scrollTo(0, 0);
  };
  updateLeft();
}


// ===== 課文遊戲題：點圖、點句子󠇡、分類、排序 =====
// 課文提問點一點的圖：HAND_SVG 放在 content.js
const splitSents = p => p.match(/[^。！？]*[。！？]」?/g) || [p];
function gameState(rec, it) { rec.extra.g = rec.extra.g || {}; return rec.extra.g[it.id] = rec.extra.g[it.id] || {}; }
function gameHtml(s, it, rec) {
  const G = gameState(rec, it); const done = rec.ans[it.id] === 'done'; const miss = (rec.extra.gmiss || {})[it.id] || 0;
  const fb = done ? `<p class="fb ok">答對了！${miss ? `（錯了 ${miss} 次）` : '一󠇡次就答對！'}</p><p class="ex"><b>課文這樣寫</b>${esc(it.ex)}</p>` : (G.msg ? `<p class="fb no">${esc(G.msg)}</p>` : '');
  if (it.t === 'hotspot') return `<div class="hot ${done ? 'is-done' : ''}" data-gid="${it.id}">${HAND_SVG(done ? it.target : '')}</div>${fb}`;
  if (it.t === 'tap') {
    const sents = splitSents(paraZ(it.para));
    return `<p class="muted">第${ZH_NUM[it.para]}段：</p><div class="tap-para kai">${sents.map((x, k) => `<button type="button" class="sent ${done && it.a.includes(k) ? 'right' : ''} ${(G.wrong || []).includes(k) ? 'wrong' : ''}" data-gid="${it.id}" data-k="${k}" ${done ? 'disabled' : ''}>${esc(x)}</button>`).join('')}</div>${fb}`;
  }
  if (it.t === 'sort') {
    const placed = G.placed || {}; const order = G.order || (G.order = shuffle(it.cards.map((_, k) => k)));
    const pool = order.filter(k => placed[k] == null);
    return `<p class="muted">先點一󠇢張卡片，再點它屬於哪一󠇢邊。</p>
      <div class="pool">${pool.map(k => `<button type="button" class="card-chip ${G.sel === k ? 'sel' : ''}" data-gid="${it.id}" data-card="${k}">${esc(it.cards[k][0])}</button>`).join('') || '<span class="muted">全部分好了！</span>'}</div>
      <div class="buckets">${it.buckets.map((b, bi) => `<button type="button" class="bucket b${bi}" data-gid="${it.id}" data-bucket="${bi}"><b>${esc(b)}</b><span class="bucket-in">${Object.keys(placed).filter(k => placed[k] === bi).map(k => `<span class="placed">${esc(it.cards[k][0])}</span>`).join('')}</span></button>`).join('')}</div>${fb}`;
  }
  if (it.t === 'order') {
    const seq = G.seq || []; const order = G.order || (G.order = shuffle(it.cards.map((_, k) => k)));
    return `<p class="muted">從第一段開始，依序點卡片。</p>
      <ol class="seq">${it.cards.map((c, k) => `<li class="${k < seq.length ? 'filled' : ''}"><span class="seq-no">${'一二三四五六'[k]}</span>${k < seq.length ? esc(it.cards[seq[k]]) : '　'}</li>`).join('')}</ol>
      <div class="pool">${order.filter(k => !seq.includes(k)).map(k => `<button type="button" class="card-chip" data-gid="${it.id}" data-ord="${k}">${esc(it.cards[k])}</button>`).join('')}</div>${fb}`;
  }

}
function gameMiss(rec, it, msg) { rec.extra.gmiss = rec.extra.gmiss || {}; rec.extra.gmiss[it.id] = (rec.extra.gmiss[it.id] || 0) + 1; gameState(rec, it).msg = msg; try { sfx('no'); } catch (e) {} }
function gameDone(rec, it) { rec.ans[it.id] = 'done'; rec.ok[it.id] = true; if (rec.first[it.id] == null) rec.first[it.id] = !((rec.extra.gmiss || {})[it.id]); gameState(rec, it).msg = ''; try { sfx('win'); } catch (e) {} }
function bindGames(s, items, rec, rerender) {
  const find = id => items.find(x => x.id === id);
  document.querySelectorAll('.hot:not(.is-done) .hs, .hot:not(.is-done) .hand-svg').forEach(el => el.onclick = e => {
    e.stopPropagation();
    const box = el.closest('.hot'); const it = find(box.dataset.gid); const part = e.target.closest('[data-part]')?.dataset.part;
    if (part === it.target) gameDone(rec, it);
    else gameMiss(rec, it, (HOT_MISS[part] || '再找找看，點在圖上的東西󠇡。'));
    queueSave(s.id); rerender();
  });
  document.querySelectorAll('.sent[data-gid]').forEach(b => b.onclick = () => {
    const it = find(b.dataset.gid); const k = +b.dataset.k; const G = gameState(rec, it);
    if (it.a.includes(k)) gameDone(rec, it); else { G.wrong = [...(G.wrong || []), k]; gameMiss(rec, it, '這一󠇡句不󠇡是答案，再讀一讀其他句子󠇡。'); }
    queueSave(s.id); rerender();
  });
  document.querySelectorAll('[data-card]').forEach(b => b.onclick = () => { const it = find(b.dataset.gid); gameState(rec, it).sel = +b.dataset.card; gameState(rec, it).msg = ''; rerender(); });
  document.querySelectorAll('[data-bucket]').forEach(b => b.onclick = () => {
    const it = find(b.dataset.gid); const G = gameState(rec, it); if (G.sel == null) { G.msg = '先點上面的一󠇢張卡片。'; return rerender(); }
    if (it.cards[G.sel][1] === +b.dataset.bucket) { G.placed = Object.assign({}, G.placed, { [G.sel]: +b.dataset.bucket }); G.sel = null; G.msg = ''; try { sfx('ok'); } catch (e) {}
      if (Object.keys(G.placed).length === it.cards.length) gameDone(rec, it); }
    else gameMiss(rec, it, `「${it.cards[G.sel][0]}」不󠇡是放這邊喔。`);
    queueSave(s.id); rerender();
  });
  document.querySelectorAll('[data-ord]').forEach(b => b.onclick = () => {
    const it = find(b.dataset.gid); const G = gameState(rec, it); G.seq = G.seq || []; const k = +b.dataset.ord;
    if (k === G.seq.length) { G.seq = [...G.seq, k]; G.msg = ''; try { sfx('ok'); } catch (e) {} if (G.seq.length === it.cards.length) gameDone(rec, it); }
    else gameMiss(rec, it, `這張不󠇡是第${'一二三四五六'[G.seq.length]}段，再想一想。`);
    queueSave(s.id); rerender();
  });
}

}

// --- 找不同 ---
const DIFF_SEC = 12;
function diffGame() {
  const S = bonusState;
  if (!S.diff) S.diff = { qs: shuffle(DIFF_Q).slice(0, 10), i: 0, score: 0, pts: 0, combo: 0, pick: null, t0: Date.now(), gain: 0 };
  const D = S.diff; const g = $('#game');
  clearInterval(S.diffTimer);
  if (D.i >= D.qs.length) {
    const stars = D.score / D.qs.length >= .9 ? 3 : D.score / D.qs.length >= .7 ? 2 : 1;
    g.innerHTML = `<div class="result-card"><p class="big-stars">${starRow(stars)}</p><p>答對 <b>${D.score}</b> / ${D.qs.length} 題，總分 <b>${D.pts}</b> 分！</p><p class="muted">答得󠇡越快分數越高，連續答對還有加分。</p><button class="primary" id="dfAgain">再挑戰一󠇡次</button></div>`;
    $('#dfAgain').onclick = () => { S.diff = null; diffGame(); };
    return;

  const q = D.qs[D.i];

  g.innerHTML = `<div class="hud"><span>第 ${D.i + 1} / ${D.qs.length} 題</span><span>⭐ ${D.pts} 分</span>${D.combo >= 2 ? `<span class="combo">🔥 連對 ${D.combo}</span>` : ''}</div>
  <div class="tbar ${answered ? 'stop' : ''}"><i id="tfill"></i></div>

    D.i++; D.pick = null; D.t0 = Date.now();
    if (D.i >= D.qs.length) {
      const prev = myRec('bonus').extra.diff;
      if (!prev?.done || D.score / D.qs.length > prev.score / prev.max || (D.score / D.qs.length === prev.score / prev.max && D.pts > (prev.pts || 0))) saveBonus('diff', { done: true, score: D.score, max: D.qs.length, pts: D.pts });
      sfx('win'); confetti();
    }
    diffGame();
  });
}

// --- 筆順挑戰（依課本筆順） ---
const PAD_AR = 487 / 421; // 高 / 寬，和󠇡課本筆順圖同比例
const PAD_CX = 0.5; // 田字格中線位置
function resample(pts, n) {

    const t = L * k / (n - 1); let i = 1; while (i < d.length - 1 && d[i] < t) i++;

const plen = p => { let s = 0; for (let i = 1; i < p.length; i++) s += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); return s; };

function strokeMatch(u, t, loose) { // loose：挑戰模式（沒有灰字）放寬位置

  // 防亂畫：超出格子󠇡太多就不󠇡算
  if (u.some(p => p[0] < -0.4 || p[0] > 10.4 || p[1] < -0.4 || p[1] > 10.4)) return { ok: false, why: 'out', score: 99 };

  if (tl < 1.7) { // 點、短筆
    if (sl > tl * 2.5 + 1.5) return { ok: false, why: 'scribble', rev, score: 99 };
    const dot = (uN[0] - u0[0]) * (tN[0] - t0[0]) + (uN[1] - u0[1]) * (tN[1] - t0[1]);

  }

  if (sl > tl * 1.9 + 1.2 || turns(smooth(u, 2)) > turns(t) + 2) return { ok: false, why: 'scribble', rev, score: 99 }; // 來回塗

const GLYPH_CACHE = {};
function glyphImg(i) { if (!GLYPH_CACHE[i]) { const im = new Image(); im.src = GLYPH_IMG[i]; GLYPH_CACHE[i] = im; } return GLYPH_CACHE[i]; }
function strokeGame() {
  const S = bonusState;
  if (!S.skMode) S.skMode = 'trace';
  if (!S.sk) S.sk = newSk(Math.floor(Math.random() * CHARS.length));
  const K = S.sk; K.trace = S.skMode === 'trace'; const c = CHARS[K.ci]; const best = myRec('bonus').extra.strokes || {};
  K.onDone = () => {
    const all = Object.assign({}, myRec('bonus').extra.strokes || {});
    const prev = all[c[0]];
    if (!prev || (!K.trace && prev.mode === 'trace') || ((K.trace ? 'trace' : 'blank') === prev.mode && K.miss < prev.miss)) all[c[0]] = { miss: K.miss, mode: K.trace ? 'trace' : 'blank' };
    saveBonus('strokes', all); sfx('win'); if (!K.miss) confetti(); strokeGame();
  };
  const g = $('#game');
  g.innerHTML = `<div class="game-head"><div class="seg" role="group" aria-label="練習方式">
      <button class="seg-b ${K.trace ? 'on' : ''}" data-mode="trace">描一描</button><button class="seg-b ${!K.trace ? 'on' : ''}" data-mode="blank">挑戰（沒有灰字）</button></div>
    <p class="muted">${K.trace ? '跟著灰色的字，照筆順一󠇢筆一筆描。' : '格子󠇡裡沒有字，照筆順自己寫出來。'}寫錯會提醒你，錯兩次會出現起筆的提示。</p></div>
  <div class="sk-wrap">
    <div class="sk-side">
      <p class="sk-target"><span class="kai sk-big">${c[0]}</span><span class="zy">${c[1]}</span></p>
      <p class="sk-count">第 <b>${Math.min(K.k + 1, K.data.length)}</b> / ${K.data.length} 筆</p>
      <p class="game-msg" id="skMsg">${esc(K.msg)}</p>
      <div class="row"><button class="ghost sm" id="skClear">重󠇡寫</button><button class="ghost sm" id="skNext">換一󠇡個󠇡字</button></div>
      <div class="sk-chips">${CHARS.map((x, i) => `<button class="chip kai ${i === K.ci ? 'on' : ''} ${best[x[0]] ? 'got' : ''}" data-ci="${i}">${x[0]}</button>`).join('')}</div>
    </div>
    <div class="sk-pad-wrap">
      <canvas id="pad" class="pad" aria-label="寫字板"></canvas>
      ${K.done ? `<div class="sk-done"><p class="fb ok">寫完了！錯了 ${K.miss} 次 ${starRow(K.miss === 0 ? 3 : K.miss <= 2 ? 2 : 1)}　看看課本的筆順，和󠇡你寫的一󠇡樣嗎？</p><button class="primary sm" id="skAnother">再來一󠇡個󠇡字</button><img src="${STROKE_IMG[K.ci]}" alt="「${c[0]}」課本筆順圖" class="stroke-img"></div>` : ''}
    </div>
  </div>`;
  setupPad(K);
  g.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { S.skMode = b.dataset.mode; S.sk = newSk(K.ci); strokeGame(); });
  $('#skClear').onclick = () => { S.sk = newSk(K.ci); strokeGame(); };
  $('#skAnother') && ($('#skAnother').onclick = () => $('#skNext').click());
  $('#skNext').onclick = () => { let i; do { i = Math.floor(Math.random() * CHARS.length); } while (i === K.ci); S.sk = newSk(i); strokeGame(); };
  g.querySelectorAll('[data-ci]').forEach(b => b.onclick = () => { S.sk = newSk(+b.dataset.ci); strokeGame(); });
}
function newSk(ci) { return { ci, data: STROKE_DATA[CHARS[ci][0]], k: 0, ink: [], miss: 0, missHere: 0, done: false, msg: '從第一筆開始寫。', bad: null, off: [0, 0] }; }
function setupPad(K) {
  const cv = $('#pad'); if (!cv) return;
  cv.onpointerdown = cv.onpointermove = cv.onpointerup = cv.onpointercancel = null; const box = cv.parentElement;
  const W = Math.min(box.clientWidth, 430); const H = W * PAD_AR; const dpr = window.devicePixelRatio || 1;
  cv.style.width = W + 'px'; cv.style.height = H + 'px'; cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const col = n => css.getPropertyValue(n).trim();
  const toU = (x, y) => [x / W * 10, y / H * 10];

  const lw = W * 0.034;

    ctx.fillStyle = col('--card'); ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = col('--line'); ctx.lineWidth = 2; ctx.setLineDash([]); ctx.strokeRect(1, 1, W - 2, H - 2);
    ctx.setLineDash([6, 6]); ctx.beginPath(); ctx.moveTo(W * PAD_CX, 0); ctx.lineTo(W * PAD_CX, H); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke(); ctx.setLineDash([]);

    K.ink.forEach(s => line(s, col('--ink'), lw));
    if (K.bad) line(K.bad, col('--no'), lw);

    if (!K.done && K.missHere >= 2) { // 起筆提示

}

// ===== 啟動 =====
(async function boot() {
  const saved = LOGIN.get();
  if (saved?.role === 'student') {
    st.role = 'student'; st.cls = saved.cls; st.seat = saved.seat;
    loadPending();
    st.recs = LS.get(`${LESSON.key}-me-${st.cls}-${st.seat}`, {});
    await refreshMine(); go('home'); flush();
  } else if (saved?.role === 'teacher') {
    st.role = 'teacher'; st.cls = saved.cls; st.key = saved.key;
    await tLoad(); renderTeacher(); startTeacherPoll();
  } else renderLogin();
  startStudentPoll(); checkVer();
  try { speechSynthesis.getVoices(); } catch (e) {}
})();
