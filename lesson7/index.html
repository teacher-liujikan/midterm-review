<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style></head><body><title>最年輕的奶奶 學習站</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
/* 版面概念：田字格練習簿。淡格線紙底、墨藍字、窗花紅點綴；三組顏色取自課文的星星、群山、窗花。 */
:root{
  --paper:#f5f7f4; --grid:#dfe7e2; --card:#ffffff; --ink:#1f2b3d; --muted:#5d6b78;
  --line:#cfd8d3; --accent:#c8323f; --accent-ink:#ffffff; --accent-soft:#fbe6e8;
  --ok:#1f7a4d; --ok-soft:#e1f2e8; --no:#b33a2e; --no-soft:#fbe7e3; --warn-soft:#fff3d6;
  --gold:#a8710b; --gold-soft:#fdf1d3; --teal:#14706f; --teal-soft:#dcf0ee; --rose:#b8365f; --rose-soft:#fbe3ec;
  --f-ui:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  --f-disp:"Noto Serif TC","PMingLiU",serif;
  --f-kai:"BiauKai","DFKai-SB","標楷體","TW-Kai","Kaiti TC","Noto Serif TC",serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141a20; --grid:#1d252c; --card:#1b232b; --ink:#e7ecef; --muted:#9aa8b3; --line:#2e3a44;
  --accent:#ef6b75; --accent-ink:#1b0d0f; --accent-soft:#3a1d22; --ok:#5fcf93; --ok-soft:#173326; --no:#f08a7c; --no-soft:#3b1e1a; --warn-soft:#3a3018;
  --gold:#f0c262; --gold-soft:#3a2f14; --teal:#5fd0cb; --teal-soft:#123331; --rose:#f08aab; --rose-soft:#3b1a28; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141a20; --grid:#1d252c; --card:#1b232b; --ink:#e7ecef; --muted:#9aa8b3; --line:#2e3a44;
  --accent:#ef6b75; --accent-ink:#1b0d0f; --accent-soft:#3a1d22; --ok:#5fcf93; --ok-soft:#173326; --no:#f08a7c; --no-soft:#3b1e1a; --warn-soft:#3a3018;
  --gold:#f0c262; --gold-soft:#3a2f14; --teal:#5fd0cb; --teal-soft:#123331; --rose:#f08aab; --rose-soft:#3b1a28; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:17px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.kai{font-family:var(--f-kai)}
.zy{font-family:var(--f-kai);letter-spacing:.05em}
.muted{color:var(--muted)}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.label{font-size:.85rem;color:var(--muted);letter-spacing:.06em;margin:.8em 0 .3em}
.eyebrow{font-size:.85rem;letter-spacing:.12em;color:var(--accent);margin:0}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:.6em 1.4em;font-weight:700}
.ghost{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:.45em 1em;text-decoration:none;display:inline-block}
.ghost:hover{border-color:var(--ink)}
.sm{font-size:.88rem;padding:.3em .8em}
.link-btn{background:none;border:0;color:var(--muted);text-decoration:underline;margin-top:14px}
/* 登入 */
.login{min-height:100%;display:grid;place-items:start center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px}
.login-card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:28px;width:min(560px,100%);box-shadow:0 10px 30px -18px rgba(0,0,0,.25)}
.lesson-title{font-family:var(--f-kai);font-size:clamp(2rem,6vw,2.8rem);margin:.15em 0 .05em;text-wrap:balance;line-height:1.2}
.lesson-title.sm{font-size:1.8rem}
.field{display:flex;flex-direction:column;gap:4px;margin:14px 0}
.field span{font-size:.85rem;color:var(--muted)}
.field input,.field select,textarea{background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:.5em .7em;width:100%}
.field.inline{margin:0;flex-direction:row;align-items:center;gap:8px}
.field.inline input,.field.inline select{width:auto;min-width:0}
.field.grow{flex:1 1 280px;min-width:0}.field.grow select{flex:1;min-width:0;width:100%}
.field.check input{width:auto}
.seat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.seat{aspect-ratio:1;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;font-size:1.2rem;font-weight:700;font-variant-numeric:tabular-nums;max-width:100%}
.seat:hover{border-color:var(--accent);color:var(--accent)}
.demo-note{background:var(--warn-soft);border-radius:8px;padding:.5em .8em;font-size:.88rem;margin-top:14px}
.err{color:var(--no);min-height:1.2em;margin:0}
/* 頂欄 */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1.5px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.topbar-in{max-width:960px;margin:0 auto;display:flex;gap:12px;align-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.brand{background:none;border:0;font-weight:700;padding:0;margin-right:auto;text-align:left;min-width:0}
.brand .kai{color:var(--accent)}
.me{font-variant-numeric:tabular-nums;font-weight:500}
.sync{font-size:.8rem;color:var(--muted)}.sync[data-s=err]{color:var(--no)}
.live{font-size:.8rem;color:var(--ok)}
/* 地圖 */
.home-head{margin-bottom:8px}
.path{list-style:none;padding:0;margin:0;display:grid;gap:18px}
.sec-name{font-family:var(--f-disp);font-size:1.15rem;margin:0 0 8px;display:flex;align-items:center;gap:10px}
.sec-name::after{content:"";flex:1;border-top:1.5px dashed var(--line)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tile{display:grid;gap:4px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 16px;position:relative;min-width:0}
.tile-when{font-size:.8rem;color:var(--muted)}
.tile-name{font-size:1.15rem;font-weight:700}
.tile-st{font-size:.85rem;justify-self:start;border-radius:999px;padding:.1em .7em;background:var(--paper)}
.st-go{border-color:var(--accent)}.st-go .tile-st{background:var(--accent);color:var(--accent-ink)}
.st-doing .tile-st{background:var(--warn-soft)}
.st-done .tile-st{background:var(--ok-soft);color:var(--ok)}
.st-lock{opacity:.55;cursor:not-allowed}.st-wait .tile-st{background:var(--warn-soft)}
.gchip{display:inline-block;border-radius:999px;padding:.1em .7em;font-size:.85rem;font-weight:700;justify-self:start}
.g-gold{background:var(--gold-soft);color:var(--gold)}.g-teal{background:var(--teal-soft);color:var(--teal)}.g-rose{background:var(--rose-soft);color:var(--rose)}
/* 關卡 */
.crumbs{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:.9rem}
.stage-title{font-family:var(--f-disp);font-size:1.9rem;margin:.4em 0 .1em}
.intro{max-width:60ch;color:var(--muted);margin-top:0}
.text-card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:18px 22px;margin:16px 0}
.text-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.text-head h2{margin:0;font-size:1.6rem}
.para{font-size:1.4rem;line-height:2;margin:.6em 0;max-width:34em}
.pno{font-family:var(--f-kai);border:1.5px solid var(--accent);color:var(--accent);background:none;border-radius:4px;width:1.6em;height:1.6em;line-height:1;margin-right:.5em;font-size:1rem;vertical-align:.15em;padding:0}
.markbox,.words{margin:12px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:.25em .9em;font-family:var(--f-kai);font-size:1.05rem}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.words summary{cursor:pointer;font-weight:700}
.word-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:10px}
.word{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;display:grid}
.word b{font-size:1.3rem}.word span{font-size:.92rem;color:var(--muted)}
.group-banner{display:flex;gap:12px;align-items:baseline;border-radius:12px;padding:12px 18px;margin:12px 0}
.group-banner strong{font-size:1.4rem}
.qlist{display:grid;gap:14px;margin-top:16px}
.q{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px 18px;margin:0;min-width:0}
.q.miss{border-color:var(--no)}
.q legend{display:flex;gap:10px;align-items:flex-start;padding:0;font-weight:500;font-size:1.1rem;float:left;width:100%;margin-bottom:10px}
.q legend+*{clear:both}
.qno{flex:none;width:1.8em;height:1.8em;border-radius:50%;background:var(--ink);color:var(--card);display:grid;place-items:center;font-size:.85rem;font-variant-numeric:tabular-nums}
.qtag{flex:none;font-size:.78rem;border:1px solid var(--line);border-radius:4px;padding:.1em .45em;color:var(--muted);margin-top:.2em}
.qtext{min-width:0}
.opts{display:grid;gap:8px;grid-template-columns:1fr;clear:both}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:.55em .9em;cursor:pointer;background:var(--paper);min-width:0}
.opts.two .opt{justify-content:center;font-size:1.35rem;font-family:var(--f-kai)}
.opt input{accent-color:var(--accent);flex:none}
.opt.sel{border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}.opt.wrong{border-color:var(--no);background:var(--no-soft)}
textarea{font-size:1.15rem;line-height:1.7;resize:vertical;clear:both;display:block}
.fb{margin:.6em 0 0;border-radius:8px;padding:.4em .8em}.fb.ok{background:var(--ok-soft);color:var(--ok)}.fb.no{background:var(--no-soft);color:var(--no)}
.hints{margin-top:10px;display:grid;gap:6px;justify-items:start}
.hint{margin:0;background:var(--warn-soft);border-radius:8px;padding:.4em .8em}.hint b{margin-right:.6em}
.submit-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:8px}
.notice{background:var(--card);border:1.5px dashed var(--line);border-radius:12px;padding:18px;margin:16px 0;font-size:1.1rem}
.notice.done{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.notice.warn{background:var(--warn-soft);border-style:solid}
/* 生字 */
.stroke-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0 14px}
.char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.char{display:grid;justify-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:8px 4px;position:relative}
.char .big{font-size:2.2rem;line-height:1.1}.char .zy{font-size:.85rem;color:var(--muted)}
.char.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.char.got::after{content:"✓";position:absolute;top:4px;right:6px;color:var(--ok);font-weight:700}
.char-card{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:22px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:18px;margin-top:16px}
.stroke-img{width:100%;border-radius:8px;background:#fff;border:1px solid var(--line)}
.char-head{display:flex;align-items:center;gap:14px;margin:0}
.huge{font-size:4rem;line-height:1}.zy.lg{font-size:1.4rem}
.facts{display:flex;gap:18px;margin:.6em 0;flex-wrap:wrap}.facts div{display:grid}.facts dt{font-size:.8rem;color:var(--muted)}.facts dd{margin:0;font-size:1.2rem;font-weight:700;font-variant-numeric:tabular-nums}
.words-inline{font-size:1.3rem;margin:0}.idiom{font-size:1rem;color:var(--accent)}
/* 檢討 */
.score-strip{display:flex;gap:14px;align-items:baseline;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 18px;margin-top:12px}
.score-strip strong{font-size:1.8rem;font-variant-numeric:tabular-nums}
.rv.is-ok{border-left:6px solid var(--ok)}.rv.is-no{border-left:6px solid var(--no)}
.rv-line{margin:0 0 .4em}
.mark{display:inline-block;border-radius:4px;padding:0 .5em;margin-right:.5em;font-weight:700}.mark.ok{background:var(--ok-soft);color:var(--ok)}.mark.no{background:var(--no-soft);color:var(--no)}
.ex{background:var(--paper);border-radius:8px;padding:.5em .8em;margin:.4em 0}.ex b{margin-right:.6em;color:var(--accent)}
.self{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}.self .label{margin:0}
.self .chip{font-family:var(--f-ui);font-size:.92rem}
.retry{margin-top:10px}
/* 教師端 */
.topbar.t .tabs{display:flex;gap:4px;overflow-x:auto;padding-block:0}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:.5em .9em;font-weight:500;white-space:nowrap}
.tab.on{border-color:var(--accent);color:var(--accent)}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:18px 20px;margin:16px 0;min-width:0}
.panel h2{font-family:var(--f-disp);font-size:1.25rem;margin:0 0 6px}
.panel h3{font-size:1.05rem;margin:18px 0 6px;display:flex;gap:8px;align-items:center}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.scroll{overflow-x:auto;max-width:100%}
.tbl{border-collapse:collapse;width:100%;font-size:.95rem}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:.45em .6em;text-align:left;white-space:nowrap}
.tbl th{font-size:.82rem;color:var(--muted);font-weight:500}
.num{font-variant-numeric:tabular-nums}
.board th,.board td.c{text-align:center}
.board th small{display:block;font-size:.7rem}
.board tr.rate th{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:700}
td.c.ok{background:var(--ok-soft);color:var(--ok);font-weight:700}td.c.no{background:var(--no-soft);color:var(--no);font-weight:700}td.c.txt{background:var(--teal-soft);color:var(--teal)}
tr.clickable{cursor:pointer}tr.clickable:hover td{outline:1px solid var(--line)}
.pill{display:inline-block;font-size:.78rem;border-radius:999px;padding:.05em .6em;background:var(--paper);border:1px solid var(--line)}.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.switch{position:relative;display:inline-block;width:46px;height:26px}.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.15s}
.switch span::before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:var(--card);border-radius:50%;transition:.15s}
.switch input:checked+span{background:var(--accent)}.switch input:checked+span::before{transform:translateX(20px)}
.switch input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.two-col{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:16px}
.two-col .panel{margin:16px 0 0}
.gsum{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.tbl select{padding:.2em .4em;border:1.5px solid var(--line);border-radius:6px;background:var(--paper)}
.wall-q{font-family:var(--f-kai)!important;font-size:1.5rem!important;margin-top:14px!important}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:10px}
.note{margin:0;background:var(--gold-soft);border-radius:4px 14px 4px 14px;padding:14px 16px;display:grid;gap:8px;min-width:0}
.note p{margin:0;font-family:var(--f-kai);font-size:1.3rem;line-height:1.7;overflow-wrap:anywhere}
.note footer{font-size:.8rem;color:var(--muted)}
.proj .note p{font-size:1.8rem}.proj .wall{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.avgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.avgs div{display:grid;border-left:4px solid var(--accent);padding-left:12px}.avgs span{color:var(--muted);font-size:.9rem}.avgs b{font-size:2rem;font-variant-numeric:tabular-nums}.avgs small{font-size:1rem;margin-left:2px}
.ranked{padding-left:1.2em;display:grid;gap:6px}
.bar{display:inline-block;width:50px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--accent) var(--w),var(--line) var(--w));margin-right:8px;vertical-align:middle}
.modal-bg{position:fixed;inset:0;background:rgba(10,15,20,.45);display:grid;place-items:center;z-index:20;padding:16px}
.modal{background:var(--card);border-radius:14px;max-width:640px;width:100%;max-height:85vh;overflow:auto;padding:18px 22px}
.modal header{display:flex;justify-content:space-between;align-items:center;gap:8px}.modal h2{margin:0;font-size:1.2rem}
.d-item{border-bottom:1px solid var(--line);padding:8px 0}.d-q{margin:0;color:var(--muted);font-size:.92rem}.d-item p{margin:.2em 0}
.answer{font-family:var(--f-kai);font-size:1.2rem}
/* 生字教學 */
.teach-sec{margin:26px 0 8px;display:grid;gap:12px}
.teach-head h2{font-family:var(--f-disp);font-size:1.4rem;margin:0;display:flex;align-items:center;gap:10px}
.teach-head h2::after{content:"";flex:1;border-top:1.5px dashed var(--line)}
.teach-head p{margin:.2em 0 0}
.label.try{color:var(--accent);font-weight:700;margin-bottom:-4px}
.pair-grid,.poly-grid,.idiom-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:10px}
.pair,.poly,.idiom-card{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.pair-chars{display:flex;align-items:center;justify-content:space-around;gap:6px}
.pc{display:grid;justify-items:center}.pc-c{font-size:2.6rem;line-height:1.1}.pc-w{font-size:1rem}
.vs{color:var(--muted);font-size:1.4rem}
.pair-tip{margin:.5em 0 0;font-size:.92rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:.5em}
.poly{display:flex;gap:14px;align-items:center}
.poly-c{font-size:3rem;color:var(--accent);line-height:1}
.poly-rows{display:grid;gap:8px;min-width:0}.poly-r{display:flex;gap:10px;align-items:flex-start}
.poly-z{flex:none;font-size:1.1rem;border:1.5px solid var(--line);border-radius:6px;padding:0 .4em;background:var(--paper)}
.poly-r b{font-size:1.15rem}
.word-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.say{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;font-size:.8rem;padding:.1em .7em}
.eg{color:var(--ink)!important;border-top:1px dashed var(--line);padding-top:.35em;margin-top:.35em;font-size:1.02rem!important}
.idiom-card{display:grid;gap:2px}.idiom-card b{font-size:1.5rem;color:var(--accent)}
.pre-sum{background:var(--paper);border-radius:10px;padding:4px 14px;margin-bottom:12px}
.pre-sum .chip{font-size:.92rem;cursor:default}
/* 預習單：直排課文（逐格排版，注音在字右邊） */
.vbook{overflow-x:auto;background:var(--card);border:1.5px solid var(--line);border-radius:14px;margin:16px 0 4px;max-width:100%}

// ===== 第七課〈最年輕的奶奶〉內容（依南一版三上課本） =====
const LESSON = {
  no: 7, title: '最年輕的奶奶', author: '許亞歷',
  paras: [
    '奶奶的手背上有好多斑點和皺紋，淘氣的我最喜歡把食指放在上頭，玩連連看遊戲。',
    '有時，我把奶奶手上的斑點當成星星，連出奇特的星座。奶奶笑說自己不懂星座，只知道凡事努力做。她一起床，雙手就在銀髮上又梳又夾，髮上的銀光，比清晨的陽光還明亮。奶奶常常說：「頭髮整理好，做事難不倒。」奶奶幫花除完蟲，轉身忙洗衣，做得快又好。',
    '有時，我把奶奶手上的皺紋當成群山，連出一條藏寶路線。奶奶笑著捏捏我的臉，說：「你才是我的寶貝呀！」她的手真的會變出寶物，一張紙在手中摺摺剪剪，不一會兒就變成美麗的窗花。奶奶低著頭，瞇著眼，仔細剪出花樣，就像一位大藝術家。',
    '雖然奶奶說：「手背上的不是星座，也不是藏寶圖，是我老了啦！」可是在我心中，她充滿活力和創意，是全世界最年輕的奶奶！'

    '奶奶手上的皺紋像群山，可以連出藏寶路線。奶奶會剪美麗的窗花，像大藝術家。',

const Remote = {
  async get(params) {
    const u = API_URL + '?' + new URLSearchParams(params).toString();

    const j = await r.json();
    if (!j.ok) throw new Error(j.err || 'error');

  },
  async post(body) {
    const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.err || 'error');
    return j;
  },
  mine: (c, s) => Remote.get({ a: 'mine', c, s }),
  all: (c, k) => Remote.get({ a: 'all', c, k }),
  save: (c, s, stage, rec) => Remote.post({ a: 'save', c, s, stage, rec }),
  setCfg: (c, k, cfg) => Remote.post({ a: 'cfg', c, k, cfg }),

const Local = {
  db() { return LS.get('l7-demo-db', { cfg: {}, recs: {} }); },

function myRec(stageId) {
  if (!st.recs[stageId]) st.recs[stageId] = { seat: st.seat, stage: stageId, ans: {}, ok: {}, first: {}, hints: {}, self: {}, retry: {}, extra: {}, done: false };
  return st.recs[stageId];
}
let saveTimers = {};
function queueSave(stageId, now) {
  const rec = myRec(stageId); rec.t = Date.now();
  if (st.preview) return;
  pending[stageId] = rec; LS.set('l7-pending', pending);
  LS.set(`l7-me-${st.cls}-${st.seat}`, st.recs);
  clearTimeout(saveTimers[stageId]);
  saveTimers[stageId] = setTimeout(flush, now ? 0 : 900);
  setSync('saving');
}
async function flush() {
  const ids = Object.keys(pending);
  if (!ids.length) { setSync('ok'); return; }
  for (const id of ids) {
    try { await API.save(st.cls, st.seat, id, pending[id]); delete pending[id]; LS.set('l7-pending', pending); }
    catch (e) { setSync('err'); setTimeout(flush, 5000); return; }
  }
  setSync('ok');
}
function setSync(s) {
  st.sync = s;
  const el = $('#sync'); if (!el) return;
  el.dataset.s = s;
  el.textContent = s === 'ok' ? (DEMO ? '示範模式' : '已儲存') : s === 'saving' ? '儲存中…' : '連線中斷，稍後自動補存';
}
async function refreshMine() {
  try {
    const j = await API.mine(st.cls, st.seat);
    st.cfg = j.cfg;
    for (const r of j.recs) {
      const local = st.recs[r.stage];
      if (!local || (r.t || 0) >= (local.t || 0)) st.recs[r.stage] = Object.assign({ ans: {}, ok: {}, first: {}, hints: {}, self: {}, retry: {}, extra: {} }, r);
    }
    return true;
  } catch (e) { return false; }
}
function isOpen(id) {
  if (st.preview) return true;
  if ((st.cfg ? (st.cfg.unlocked || []) : OFFLINE_UNLOCK).includes(id)) return true;
  // 加分挑戰：老師檢核通過就自動開啟
  if (id === 'bonus' && st.recs.pre?.extra?.check?.ok) return true;
  // 分組任務：做完對應的檢測就自動分組並開啟，不用等老師
  const s = stageById(id);
  if (s?.diff) { const test = STAGES.find(x => x.group === s.diff); return !!st.recs[test.id]?.done; }
  return false;
}
function myGroup(diff) {
  if (st.preview) return st.pvGroup || 'A';
  const ov = st.cfg?.ov?.[diff];
  if (ov) return ov;
  const test = STAGES.find(s => s.group === diff);
  return autoGroup(test, st.recs[test.id]);
}

}
function bindTop() {
  $('#home').onclick = () => go('home');

// ===== 課文 =====
function textBlock(marking) {
  const rec = myRec(st.stage);
  const marked = rec.extra.marked || [];
  const words = ['手背', '斑點', '皺紋', '淘氣', '星座', '凡事', '銀髮', '藏寶', '捏捏', '摺摺剪剪', '窗花', '仔細', '藝術家', '創意'];
  return `
  <article class="text-card">
    <header class="text-head"><h2 class="kai">${esc(LESSON.title)}</h2><button class="ghost sm" id="readAll">朗讀全文</button></header>
    ${LESSON.paras.map((p, i) => `<p class="para kai"><button class="pno" data-p="${i}" title="朗讀這一段">${'一二三四'[i]}</button>${esc(p)}</p>`).join('')}
  </article>
  ${stageById(st.stage).readCount ? `<div class="markbox"><p class="label">我讀了課文幾遍？（大聲讀一遍，就點一下）</p>
    <div class="chips">${[1, 2, 3].map(k => `<button class="chip ${(rec.extra.reads || 0) >= k ? 'on' : ''}" data-read="${k}">第 ${k} 遍</button>`).join('')}</div></div>` : ''}
  ${marking ? `<div class="markbox"><p class="label">我不懂的語詞（點一下做記號）</p>
    <div class="chips">${words.map(w => `<button class="chip ${marked.includes(w) ? 'on' : ''}" data-w="${w}">${w}</button>`).join('')}</div></div>` : ''}`;
}
function speak(text) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = speechSynthesis.getVoices().find(v => /zh[-_]TW/i.test(v.lang)) || speechSynthesis.getVoices().find(v => /^zh/i.test(v.lang));
    if (v) u.voice = v; u.lang = 'zh-TW'; u.rate = 0.85;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function bindText() {
  $('#readAll') && ($('#readAll').onclick = () => speak(LESSON.paras.join('')));
  document.querySelectorAll('.pno').forEach(b => b.onclick = () => speak(LESSON.paras[+b.dataset.p]));
  document.querySelectorAll('[data-say]').forEach(b => b.onclick = () => speak(b.dataset.say));
  document.querySelectorAll('.chip[data-read]').forEach(b => b.onclick = () => {
    const rec = myRec(st.stage); const k = +b.dataset.read; rec.extra.reads = (rec.extra.reads || 0) >= k ? k - 1 : k;
    document.querySelectorAll('.chip[data-read]').forEach(x => x.classList.toggle('on', +x.dataset.read <= rec.extra.reads)); queueSave(st.stage);
  });
  document.querySelectorAll('.chip[data-w]').forEach(b => b.onclick = () => {
    const rec = myRec(st.stage); const m = rec.extra.marked || [];
    const w = b.dataset.w; rec.extra.marked = m.includes(w) ? m.filter(x => x !== w) : [...m, w];
    b.classList.toggle('on'); queueSave(st.stage);
  });
}

// ===== 關卡頁 =====
function renderStage() {
  const s = stageById(st.stage);
  if (!isOpen(s.id)) return go('home');
  let body = '';
  if (s.id === 'stroke') body = strokeBody();
  else if (s.id === 'review') body = reviewBody();
  else if (s.review) body = preReviewBody(s);
  else if (s.bonus) body = bonusBody();
  else body = itemsBody(s);
  $('#app').innerHTML = `${topbar()}
  <main class="wrap">
    <nav class="crumbs"><button class="ghost sm" id="back">← 回闖關地圖</button><span>${esc(s.sec)}・${esc(s.when)}</span></nav>
    <h1 class="stage-title">${esc(s.name)}</h1>
    <p class="intro">${esc(s.intro)}</p>
    ${body}
  </main>`;
  bindTop();
  $('#back').onclick = () => go('home');
  bindText();
  if (s.id === 'stroke') bindStroke();
  else if (s.id === 'review') bindReview();
  else if (s.review) bindPreReview(s);
  else if (s.bonus) bindBonus();
  else bindItems(s);
}

function itemsBody(s) {
  const rec = myRec(s.id);
  let group = null;
  if (s.diff) {
    group = myGroup(s.diff);
    if (!group) return `<div class="notice">老師還沒幫你分組，請等一下再回來。</div>`;
  }
  const pvSwitch = st.preview && s.diff ? `<div class="pv-switch"><span class="label">預覽組別</span>${Object.entries(GROUPS).map(([k, g]) => `<button type="button" class="chip ${group === k ? 'on' : ''}" data-pvg="${k}">${g.name}（${g.level}）</button>`).join('')}</div>` : '';
  const items = itemsFor(s, group);
  const isTest = !!(s.group || s.test);
  const locked = rec.done && isTest;
  const top = [
    s.showText ? textBlock(s.wordMark) : '',
    s.showWords ? wordCards() : '',
    pvSwitch, group ? `<div class="group-banner g-${GROUPS[group].tone}"><span>你的組別</span><strong>${GROUPS[group].name}</strong></div>` : ''
  ].join('');
  if (s.teach) return teachBody(s, rec);
  if (locked) {
    const next = s.group ? STAGES.find(x => x.diff === s.group) : null;
    const g = next ? myGroup(s.group) : null;
    const msg = s.test ? '後測已交卷。到「後測檢討」看看每一題的詳解。'
      : next && g ? `已完成！你答對 ${rec.score} / ${rec.max} 題。你被分到 <b class="g-${GROUPS[g].tone} gchip">${GROUPS[g].name}</b>，「${next.name}」已經打開了。<button class="primary" type="button" id="goNext" data-next="${next.id}">開始${next.name}</button>`
      : `已完成！你答對 ${rec.score} / ${rec.max} 題。等老師開下一關。`;
    return top + `<div class="notice done next-row">${msg}</div>`;
  }
  const doneNote = rec.done && !isTest ? `<div class="notice done">完成這一關了！第一次就答對 ${rec.score} / ${rec.max} 題。想再練習可以往下看，也可以回闖關地圖。</div>` : '';
  return top + doneNote + `<form class="qlist" id="qform">
    ${items.map((it, i) => qHtml(s, it, i, rec)).join('')}
    <div class="submit-row">
      ${isTest ? `<button class="primary" type="submit">交出${s.test ? '後測' : '檢測'}</button>` : rec.done ? '' : `<button class="primary" type="submit">完成這一關</button>`}
      <span class="muted" id="left"></span>
    </div>
  </form>`;
}
function wordCards() {
  return `<details class="words" open><summary>語詞卡（${WORDS.length} 張）</summary>
    <div class="word-grid">${WORDS.map(([w, m]) => `<div class="word"><b class="kai">${esc(w)}</b><span>${esc(m)}</span></div>`).join('')}</div></details>`;
}
function teachBody(s, rec) {
  let n = 0;
  const qs = part => s.items.filter(it => it.part === part).map(it => qHtml(s, it, n++, rec)).join('');
  const sec = (title, sub, cards, part) => `<section class="teach-sec"><header class="teach-head"><h2>${title}</h2><p class="muted">${sub}</p></header>${cards}
    <p class="label try">試試看</p><div class="qlist">${qs(part)}</div></section>`;
  const ws = (c, rows, open) => `<div class="ws-card"><div class="ws-row ws-head"><span class="ws-lab">國字</span><span class="kai ws-c">${c}</span></div>
      <div class="ws-row"><span class="ws-lab">讀音</span><span class="ws-cells">${rows.map(r => `<span class="zy ws-z">${open ? r[0] : '　'}</span>`).join('')}</span></div>
      <div class="ws-row"><span class="ws-lab">造詞</span><span class="ws-cells">${rows.map(r => `<span class="kai ws-w">${open ? r[1] : ''}</span>`).join('')}</span></div></div>`;
  const openP = !!rec.extra.wsPoly, openL = !!rec.extra.wsLook;
  const poly = `<p class="muted">先在學習單上寫注音、造詞，寫好再按「看答案」對對看。</p>
    <div class="ws-grid">${POLY.map(([c, rs]) => ws(c, rs, openP)).join('')}</div>
    <button type="button" class="ghost sm" data-ws="wsPoly">${openP ? '隱藏答案' : '看答案'}</button>
    ${openP ? `<ul class="ws-notes">${POLY.map(([c, rs]) => `<li><b class="kai">${c}</b>：${rs.map(r => `${r[0]} ${esc(r[2])}`).join('；')}</li>`).join('')}</ul>` : ''}`;
  const look = `<p class="muted">先在學習單上寫注音、造詞，寫好再按「看答案」對對看。</p>
    <div class="ws-grid">${LOOKALIKE.map(([a, b]) => `<div class="ws-pair">${ws(a[0], [[a[1], a[2]]], openL)}${ws(b[0], [[b[1], b[2]]], openL)}</div>`).join('')}</div>
    <button type="button" class="ghost sm" data-ws="wsLook">${openL ? '隱藏答案' : '看答案'}</button>
    ${openL ? `<ul class="ws-notes">${LOOKALIKE.map(([a, b, tip]) => `<li><b class="kai">${a[0]}／${b[0]}</b>：${esc(tip)}</li>`).join('')}</ul>` : ''}`;
  const words = `<div class="word-grid">${WORDS.map(([w, m, e]) => `<div class="word"><div class="word-top"><b class="kai">${esc(w)}</b><button type="button" class="say" data-say="${esc(w + '。' + (e || ''))}" aria-label="念「${esc(w)}」">念</button></div><span>${esc(m)}</span>${e ? `<span class="eg kai">${esc(e)}</span>` : ''}</div>`).join('')}</div>`;
  const idioms = `<div class="idiom-grid">${IDIOMS.map(([w, m, e]) => `<div class="idiom-card">${IDIOM_VIDEO[w] ? `<button type="button" class="vthumb" data-video="${w}" aria-label="看「${w}」動畫"><img src="${VIDEO_BASE}${IDIOM_VIDEO[w]}.jpg" alt="" loading="lazy"><span>🎬 看動畫</span></button>` : ''}<b class="kai">${w}</b><span>${esc(m)}</span><p class="copy-lab">造句（可以抄寫）</p><ol class="copy-list kai">${e.map(x => `<li>${esc(x)}</li>`).join('')}</ol></div>`).join('')}</div>`;
  return `<form id="qform">
    ${sec('一、多音字練習', '同一個字，放在不同的語詞裡，念法和意思會不同。', poly, 'sound')}
    ${sec('二、分辨形近字', '長得很像的字，只要一個部件不同，意思就不一樣。', look, 'look')}
    ${sec('語詞', '先讀解釋，再讀例句。按「念」可以聽讀音。', words, 'word')}
    ${sec('延伸成語', '每個成語都藏著一個本課生字。先看動畫，再讀解釋，最後挑一句造句抄在本子上。', idioms, 'idiom')}
    <div class="submit-row">${rec.done ? '<span class="pill ok">已完成這一關</span>' : '<button class="primary" type="submit">完成這一關</button>'}<span class="muted" id="left"></span></div>
  </form>`;
}
const GAME_T = ['hotspot', 'tap', 'sort', 'order'];
function answered(it, rec) {
  const v = rec.ans[it.id];
  if (GAME_T.includes(it.t)) return v === 'done';
  if (it.t === 'match') return !!v && Object.keys(v).length === it.pairs.length;
  return v != null && String(v).trim() !== '';
}
function matchOrder(it, rec) {
  rec.extra.ord = rec.extra.ord || {};
  if (!rec.extra.ord[it.id]) rec.extra.ord[it.id] = shuffle(it.pairs.map((_, k) => k));
  return rec.extra.ord[it.id];
}
const matchSel = {};
function qHtml(s, it, i, rec) {
  const v = rec.ans[it.id];
  const isTest = !!(s.group || s.test);
  const fb = !isTest && it.t === 'mc' && v != null ? (v === it.a ? `<p class="fb ok">答對了！${esc(it.ex || '')}</p>` : `<p class="fb no">再想一想，換一個答案試試看。</p>`) : '';
  const hints = s.hints && it.hs ? `<div class="hints">${(it.hs).map((hh, k) => (rec.hints[it.id] || 0) > k ? `<p class="hint"><b>提示 ${k + 1}</b>${esc(hh)}</p>` : '').join('')}
    ${(rec.hints[it.id] || 0) < it.hs.length ? `<button type="button" class="ghost sm hbtn" data-id="${it.id}">看提示 ${(rec.hints[it.id] || 0) + 1}</button>` : ''}</div>` : '';
  const tag = it.tag ? `<span class="qtag">${esc(it.tag)}</span>` : '';
  let input = '';
  if (GAME_T.includes(it.t)) {
    input = gameHtml(s, it, rec);
  } else if (it.t === 'match') {
    const m = rec.ans[it.id] || {}; const ord = matchOrder(it, rec); const used = Object.values(m);
    const colors = ['c1', 'c2', 'c3', 'c4', 'c5'];
    const done = Object.keys(m).length === it.pairs.length;
    input = `<p class="muted mt-hint">${it.label === '連連看' ? '先點左邊，再點右邊連起來。' : '先點左邊，再點右邊配成一對。'}</p>
    <div class="match ${it.wide ? 'wide' : ''}"><div class="mcol">${it.pairs.map((p, k) => `<button type="button" class="mitem L ${m[k] != null ? 'done ' + colors[k % 5] : ''} ${matchSel[it.id] === k ? 'sel' : ''}" data-mid="${it.id}" data-l="${k}" ${m[k] != null ? 'disabled' : ''}><span class="${it.kaiL ? 'kai' : ''}">${esc(p[0])}</span></button>`).join('')}</div>
      <div class="mcol">${ord.map(r => { const lk = Object.keys(m).find(x => m[x] === r); return `<button type="button" class="mitem R ${lk != null ? 'done ' + colors[lk % 5] : ''}" data-mid="${it.id}" data-r="${r}" ${lk != null ? 'disabled' : ''}><span class="${/^[ㄅ-ㄩ˙]/.test(it.pairs[r][1]) ? 'zy' : ''}">${esc(it.pairs[r][1])}</span></button>`; }).join('')}</div></div>
    ${done ? `<p class="fb ok">全部${it.label === '連連看' ? '連' : '配'}對了！${(rec.extra.mmiss || {})[it.id] ? `（錯了 ${(rec.extra.mmiss || {})[it.id]} 次）` : '一次就全對！'}${it.ex ? esc(it.ex) : ''}</p>` : ''}`;
  } else if (it.t === 'mc') {
    input = `<div class="opts ${it.o.length <= 2 ? 'two' : ''}">${it.o.map((o, k) => `
      <label class="opt ${v === k ? 'sel' : ''} ${!isTest && v === k ? (k === it.a ? 'right' : 'wrong') : ''}">
        <input type="radio" name="${it.id}" value="${k}" ${v === k ? 'checked' : ''}><span class="${/^[ㄅ-ㄩ]/.test(o) ? 'zy' : ''}">${esc(o)}</span></label>`).join('')}</div>`;
  } else {
    const tps = it.topics ? `<p class="label">可以選一個主題（點一下，會幫你寫好開頭）</p><div class="topic-grid">${it.topics.map(([t, idm, start], k) => `<button type="button" class="topic" data-tid="${it.id}" data-tk="${k}"><b>${esc(t)}</b><span>適合用：${esc(idm)}</span></button>`).join('')}</div>` : '';
    input = `${tps}<textarea id="ta-${it.id}" data-id="${it.id}" rows="${it.long ? 4 : 2}" placeholder="${esc(it.hint || '寫下你的答案')}">${esc(v || '')}</textarea>`;
  }
  return `<fieldset class="q" data-id="${it.id}">
    <legend><span class="qno">${i + 1}</span>${it.label ? `<span class="qtag">${esc(it.label)}</span>` : ''}${tag}<span class="qtext">${esc(it.q)}</span></legend>
    ${input}${fb}${hints}
  </fieldset>`;
}
function bindItems(s) {
  const gn = $('#goNext'); if (gn) gn.onclick = () => { st.stage = gn.dataset.next; go('stage'); scrollTo(0, 0); };
  document.querySelectorAll('[data-pvg]').forEach(b => b.onclick = () => { st.pvGroup = b.dataset.pvg; const y = scrollY; renderStage(); scrollTo(0, y); });
  document.querySelectorAll('[data-ws]').forEach(b => b.onclick = () => { const r = myRec(s.id); r.extra[b.dataset.ws] = !r.extra[b.dataset.ws]; queueSave(s.id); const y = scrollY; renderStage(); scrollTo(0, y); });
  const form = $('#qform'); if (!form) return;
  const rec = myRec(s.id);
  const isTest = !!(s.group || s.test);
  const group = s.diff ? myGroup(s.diff) : null;
  const items = itemsFor(s, group);
  const updateLeft = () => {
    const need = items.filter(it => !it.opt);
    const n = need.filter(it => answered(it, rec)).length;
    $('#left').textContent = `已作答 ${n} / ${need.length}`;
  };
  form.querySelectorAll('input[type=radio]').forEach(r => r.onchange = () => {
    const it = items.find(x => x.id === r.name); const k = +r.value;
    rec.ans[it.id] = k; rec.ok[it.id] = k === it.a;
    if (rec.first[it.id] == null) rec.first[it.id] = k === it.a;
    if (s.group) rec.extra.group = s.group;
    queueSave(s.id);
    if (!isTest) { const y = scrollY; renderStage(); scrollTo(0, y); } else {
      r.closest('.opts').querySelectorAll('.opt').forEach(l => l.classList.toggle('sel', l.contains(r)));
      updateLeft();
    }
  });
  bindGames(s, items, rec, () => { const y = scrollY; renderStage(); scrollTo(0, y); });
  form.querySelectorAll('.mitem').forEach(b => b.onclick = () => {
    const id = b.dataset.mid; const it = items.find(x => x.id === id); const m = rec.ans[id] = rec.ans[id] || {};
    if (b.dataset.l != null) { matchSel[id] = +b.dataset.l; form.querySelectorAll(`.mitem.L[data-mid="${id}"]`).forEach(x => x.classList.toggle('sel', x === b)); return; }
    const L = matchSel[id]; if (L == null) { b.classList.add('shake'); setTimeout(() => b.classList.remove('shake'), 300); return; }
    const R = +b.dataset.r;
    if (R === L) { m[L] = R; delete matchSel[id]; try { sfx('ok'); } catch (e) {} }
    else { rec.extra.mmiss = rec.extra.mmiss || {}; rec.extra.mmiss[id] = (rec.extra.mmiss[id] || 0) + 1; b.classList.add('shake'); try { sfx('no'); } catch (e) {} setTimeout(() => b.classList.remove('shake'), 300); queueSave(s.id); return; }
    if (Object.keys(m).length === it.pairs.length) { const miss = (rec.extra.mmiss || {})[id] || 0; rec.ok[id] = true; if (rec.first[id] == null) rec.first[id] = miss === 0; }
    queueSave(s.id); const y = scrollY; renderStage(); scrollTo(0, y);
  });
  form.querySelectorAll('.topic').forEach(b => b.onclick = () => {
    const it = items.find(x => x.id === b.dataset.tid); const [t, idm, start] = it.topics[+b.dataset.tk];
    const ta = $(`#ta-${it.id}`); const cur = (ta.value || '').trim();
    if (!cur || it.topics.some(x => cur === x[2])) { ta.value = start; rec.ans[it.id] = start; queueSave(s.id); updateLeft(); }
    ta.placeholder = `接著寫，記得用上一個成語（例如：${idm}）。`;
    form.querySelectorAll(`.topic[data-tid="${it.id}"]`).forEach(x => x.classList.toggle('on', x === b));
    ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  });
  form.querySelectorAll('textarea').forEach(t => t.oninput = () => { rec.ans[t.dataset.id] = t.value; queueSave(s.id); updateLeft(); });
  form.querySelectorAll('.hbtn').forEach(b => b.onclick = () => { rec.hints[b.dataset.id] = (rec.hints[b.dataset.id] || 0) + 1; queueSave(s.id); const y = scrollY; renderStage(); scrollTo(0, y); });
  form.onsubmit = (e) => {
    e.preventDefault();
    const need = items.filter(it => !it.opt);
    const miss = need.filter(it => !answered(it, rec));
    if (miss.length) {
      const q = form.querySelector(`.q[data-id="${miss[0].id}"]`); q.classList.add('miss'); q.scrollIntoView({ behavior: 'smooth', block: 'center' });
      $('#left').textContent = `還有 ${miss.length} 題沒寫`; return;
    }
    const mcs = items.filter(it => it.t === 'mc' || it.t === 'match' || GAME_T.includes(it.t));
    rec.max = mcs.length;
    rec.score = mcs.filter(it => (isTest ? rec.ok[it.id] : rec.first[it.id])).length;
    if (group) rec.extra.group = group;
    rec.done = true; queueSave(s.id, true);
    renderStage(); scrollTo(0, 0);
  };
  updateLeft();
}

function cellOf(it, rec) {

  if (GAME_T.includes(it.t)) { if (!answered(it, rec)) return ['', '·']; return rec.first?.[it.id] ? ['ok', '✓'] : ['no', '✗']; }
  if (it.t === 'match') { if (!answered(it, rec)) return rec.ans?.[it.id] ? ['', '…'] : ['', '·']; return rec.first?.[it.id] ? ['ok', '✓'] : ['no', '✗']; }

  if (v == null || String(v).trim() === '') return ['', '·'];
  if (it.t === 'text') return ['txt', '寫'];
  const ok = rec.first && rec.first[it.id] != null && !stageById(rec.stage)?.group && !stageById(rec.stage)?.test ? rec.first[it.id] : rec.ok[it.id];
  return ok ? ['ok', '✓'] : ['no', '✗'];
}

function tCompare() {
  const seats = seatsList(); const post = stageById('post');

  const rows = seats.map(n => ({ n, v: pct(recOf(n, 'vtest')), s: pct(recOf(n, 'stest')), p: pct(recOf(n, 'post')), pr: recOf(n, 'post') }));
  const avg = k => { const xs = rows.map(r => r[k]).filter(x => x != null); return xs.length ? Math.round(xs.reduce((a, b) => a + b, 0) / xs.length) : null; };
  const dims = [...new Set(post.items.map(i => i.dim))];
  const dimPct = (pr, d) => { if (!pr?.done) return null; const its = post.items.filter(i => i.dim === d); return Math.round(its.filter(i => pr.ok[i.id]).length / its.length * 100); };
  const itemRate = it => { const rs = rows.map(r => r.pr).filter(r => r?.done); return rs.length ? Math.round(rs.filter(r => r.ok[it.id]).length / rs.length * 100) : null; };
  const ranked = post.items.map(it => ({ it, r: itemRate(it) })).filter(x => x.r != null).sort((a, b) => a.r - b.r);
  const cell = v => v == null ? '<td class="num muted">·</td>' : `<td class="num"><span class="bar" style="--w:${v}%"></span>${v}</td>`;
  return `
  <section class="panel"><h2>全班平均</h2>
    <div class="avgs"><div><span>生字語詞檢測</span><b>${avg('v') ?? '—'}<small>%</small></b></div><div><span>句型修辭檢測</span><b>${avg('s') ?? '—'}<small>%</small></b></div><div><span>後測</span><b>${avg('p') ?? '—'}<small>%</small></b></div></div>
  </section>
  <section class="panel"><h2>後測錯最多的題目</h2>
    ${ranked.length ? `<ol class="ranked">${ranked.slice(0, 5).map(x => `<li><span class="num">${x.r}%</span> <span class="pill">${esc(x.it.dim)}</span> ${esc(x.it.q)}</li>`).join('')}</ol>` : '<p class="muted">還沒有人交後測。</p>'}
  </section>

    <div class="scroll"><table class="tbl"><thead><tr><th>座號</th><th>生字語詞檢測</th><th>句型修辭檢測</th><th>後測</th>${dims.map(d => `<th>後測・${d}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(r => `<tr><td class="num">${r.n}</td>${cell(r.v)}${cell(r.s)}${cell(r.p)}${dims.map(d => cell(dimPct(r.pr, d))).join('')}</tr>`).join('')}
    </tbody></table></div></section>`;
}

const player = { key: null, state: 'idle' };
function paintPlay() {

function togglePlay(key) {

// --- 部首配對 ---

  const left = CHARS.length - R.pile.length;
  g.innerHTML = `<div class="game-head"><p>點一個生字，再點它的部首。越快、越少錯，星星越多！</p>
    <span class="muted">${best?.done ? `最佳紀錄 ${best.secs} 秒` : ''}</span></div>
    <div class="hud"><span>⏱ <b id="radTime">${R.t0 ? Math.round(((R.secs != null ? R.t0 + R.secs * 1000 : Date.now()) - R.t0) / 1000) : 0}</b> 秒</span><span>✔ ${left} / ${CHARS.length}</span><span>✖ ${R.miss}</span>${R.combo >= 2 ? `<span class="combo">🔥 連對 ${R.combo}</span>` : ''}</div>

    <div class="pile">${R.pile.map(c => `<button class="tile-char kai ${R.sel === c ? 'sel' : ''}" data-c="${c}">${c}</button>`).join('')}</div>
    <p class="game-msg" id="radMsg">${esc(R.msg)}</p>
    <div class="bins">${RADICALS.map(r => `<button class="bin ${R.flash === r ? 'pop' : ''}" data-r="${r}"><span class="bin-r kai">${r}</span><span class="bin-in kai">${(R.placed[r] || []).join('')}</span></button>`).join('')}</div>`;
  R.flash = null;

      if (!R.pile.length) {
        R.secs = Math.round((Date.now() - R.t0) / 1000);

// --- 找不同 ---
const DIFF_SEC = 12;

    g.innerHTML = `<div class="result-card"><p class="big-stars">${starRow(stars)}</p><p>答對 <b>${D.score}</b> / ${D.qs.length} 題，總分 <b>${D.pts}</b> 分！</p><p class="muted">答得越快分數越高，連續答對還有加分。</p><button class="primary" id="dfAgain">再挑戰一次</button></div>`;
    $('#dfAgain').onclick = () => { S.diff = null; diffGame(); };
    return;
  }
  const q = D.qs[D.i];
  const answered = D.pick != null;
  g.innerHTML = `<div class="hud"><span>第 ${D.i + 1} / ${D.qs.length} 題</span><span>⭐ ${D.pts} 分</span>${D.combo >= 2 ? `<span class="combo">🔥 連對 ${D.combo}</span>` : ''}</div>
  <div class="tbar ${answered ? 'stop' : ''}"><i id="tfill"></i></div>
  <div class="q"><p class="sq big-q">${esc(q.q)}</p>
    <div class="opts ${q.o.length <= 2 ? 'two' : 'three'}">${q.o.map((o, k) => `<button class="opt ${answered ? (k === q.a ? 'right' : k === D.pick ? 'wrong' : '') : ''}" data-k="${k}" ${answered ? 'disabled' : ''}><span class="${q.o.length <= 2 ? 'kai' : ''}">${esc(o)}</span></button>`).join('')}</div>
    ${answered ? `<p class="fb ${D.pick === q.a ? 'ok' : 'no'}">${D.pick === q.a ? `答對了！<b class="gain">+${D.gain}</b> ` : D.pick === -1 ? '時間到！' : '答錯了。'}${esc(q.tip)}</p><button class="primary" id="dfNext">${D.i + 1 < D.qs.length ? '下一題' : '看結果'}</button>` : ''}
  </div>`;
  const answer = k => {
    if (D.pick != null) return;

    const used = (Date.now() - D.t0) / 1000;
    D.pick = k;
    if (k === q.a) { D.score++; D.combo++; D.gain = 10 + Math.max(0, Math.round((DIFF_SEC - used) * 2)) + (D.combo >= 3 ? 5 : 0); D.pts += D.gain; sfx('ok'); }
    else { D.combo = 0; sfx('no'); }
    diffGame();
  };
  if (!answered) {
    const fill = $('#tfill');
    S.diffTimer = setInterval(() => {
      if (bonusState.tab !== 'diff' || !$('#tfill')) return clearInterval(S.diffTimer);
      const r = Math.max(0, 1 - (Date.now() - D.t0) / 1000 / DIFF_SEC); fill.style.width = r * 100 + '%'; fill.classList.toggle('low', r < .3);
      if (r <= 0) answer(-1);
    }, 100);
  }
  g.querySelectorAll('[data-k]').forEach(b => b.onclick = () => answer(+b.dataset.k));
  $('#dfNext') && ($('#dfNext').onclick = () => {
    D.i++; D.pick = null; D.t0 = Date.now();
    if (D.i >= D.qs.length) {
      const prev = myRec('bonus').extra.diff;
      if (!prev?.done || D.score / D.qs.length > prev.score / prev.max || (D.score / D.qs.length === prev.score / prev.max && D.pts > (prev.pts || 0))) saveBonus('diff', { done: true, score: D.score, max: D.qs.length, pts: D.pts });
      sfx('win'); confetti();
    }
    diffGame();

// --- 筆順挑戰（依課本筆順） ---
const PAD_AR = 569 / 651; // 高 / 寬，和課本筆順圖同比例

  if (tl < 1.7) { // 點、短筆

    return { ok: sD < 1.9 && eD < 1.9 && dot > 0, rev, score: (sD + eD) / 2 };
  }
  if (ul < tl * 0.35) return { ok: false, why: 'short', score: 99 };
  const A = resample(u, 16), B = resample(t, 16);
  const mean = A.reduce((s, p, i) => s + dst(p, B[i]), 0) / 16;

const GLYPH_CACHE = {};
function glyphImg(i) { if (!GLYPH_CACHE[i]) { const im = new Image(); im.src = GLYPH_IMG[i]; GLYPH_CACHE[i] = im; } return GLYPH_CACHE[i]; }
function strokeGame() {
  const S = bonusState;
  if (!S.skMode) S.skMode = 'trace';
  if (!S.sk) S.sk = newSk(Math.floor(Math.random() * CHARS.length));
  const K = S.sk; K.trace = S.skMode === 'trace'; const c = CHARS[K.ci]; const best = myRec('bonus').extra.strokes || {};
  K.onDone = () => {
    const all = Object.assign({}, myRec('bonus').extra.strokes || {});
    const prev = all[c[0]];
    if (!prev || (!K.trace && prev.mode === 'trace') || ((K.trace ? 'trace' : 'blank') === prev.mode && K.miss < prev.miss)) all[c[0]] = { miss: K.miss, mode: K.trace ? 'trace' : 'blank' };
    saveBonus('strokes', all); sfx('win'); if (!K.miss) confetti(); strokeGame();
  };
  const g = $('#game');
  g.innerHTML = `<div class="game-head"><div class="seg" role="group" aria-label="練習方式">
      <button class="seg-b ${K.trace ? 'on' : ''}" data-mode="trace">描一描</button><button class="seg-b ${!K.trace ? 'on' : ''}" data-mode="blank">挑戰（沒有灰字）</button></div>
    <p class="muted">${K.trace ? '跟著灰色的字，照筆順一筆一筆描。' : '格子裡沒有字，照筆順自己寫出來。'}寫錯會提醒你，錯兩次會出現起筆的提示。</p></div>
  <div class="sk-wrap">
    <div class="sk-side">
      <p class="sk-target"><span class="kai sk-big">${c[0]}</span><span class="zy">${c[1]}</span></p>
      <p class="sk-count">第 <b>${Math.min(K.k + 1, K.data.length)}</b> / ${K.data.length} 筆</p>
      <p class="game-msg" id="skMsg">${esc(K.msg)}</p>
      <div class="row"><button class="ghost sm" id="skClear">重寫</button><button class="ghost sm" id="skNext">換一個字</button></div>
      <div class="sk-chips">${CHARS.map((x, i) => `<button class="chip kai ${i === K.ci ? 'on' : ''} ${best[x[0]] ? 'got' : ''}" data-ci="${i}">${x[0]}</button>`).join('')}</div>
    </div>
    <div class="sk-pad-wrap">
      <canvas id="pad" class="pad" aria-label="寫字板"></canvas>
      ${K.done ? `<div class="sk-done"><p class="fb ok">寫完了！錯了 ${K.miss} 次 ${starRow(K.miss === 0 ? 3 : K.miss <= 2 ? 2 : 1)}　看看課本的筆順，和你寫的一樣嗎？</p><button class="primary sm" id="skAnother">再來一個字</button><img src="${STROKE_IMG[K.ci]}" alt="「${c[0]}」課本筆順圖" class="stroke-img"></div>` : ''}
    </div>
  </div>`;
  setupPad(K);
  g.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { S.skMode = b.dataset.mode; S.sk = newSk(K.ci); strokeGame(); });
  $('#skClear').onclick = () => { S.sk = newSk(K.ci); strokeGame(); };
  $('#skAnother') && ($('#skAnother').onclick = () => $('#skNext').click());
  $('#skNext').onclick = () => { let i; do { i = Math.floor(Math.random() * CHARS.length); } while (i === K.ci); S.sk = newSk(i); strokeGame(); };
  g.querySelectorAll('[data-ci]').forEach(b => b.onclick = () => { S.sk = newSk(+b.dataset.ci); strokeGame(); });
}
function newSk(ci) { return { ci, data: STROKE_DATA[CHARS[ci][0]], k: 0, ink: [], miss: 0, missHere: 0, done: false, msg: '從第一筆開始寫。', bad: null, off: [0, 0] }; }
function setupPad(K) {

  cv.onpointerdown = cv.onpointermove = cv.onpointerup = cv.onpointercancel = null; const box = cv.parentElement;
  const W = Math.min(box.clientWidth, 560); const H = W * PAD_AR; const dpr = window.devicePixelRatio || 1;
  cv.style.width = W + 'px'; cv.style.height = H + 'px'; cv.width = W * dpr; cv.height = H * dpr;

    ctx.setLineDash([6, 6]); ctx.beginPath(); ctx.moveTo(W * 0.525, 0); ctx.lineTo(W * 0.525, H); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke(); ctx.setLineDash([]);

    const line = (pts, color, w) => { if (pts.length < 2) return; ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); pts.forEach((p, i) => { const q = toP(p); i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); }); ctx.stroke(); };
    K.ink.forEach(s => line(s, col('--ink'), lw));

    if (cur) line(cur, col('--ink'), lw);
    if (!K.done && K.missHere >= 2) { // 起筆提示
      const t = K.data[K.k]; const p = toP([t[0][0] + K.off[0], t[0][1] + K.off[1]]);
      ctx.fillStyle = col('--accent'); ctx.globalAlpha = 0.8; ctx.beginPath(); ctx.arc(p[0], p[1], lw * 0.9, 0, 7); ctx.fill(); ctx.globalAlpha = 1;

    if (m.ok && !m.rev && later < 0) {
