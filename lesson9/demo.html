/* 關卡 */
.crumbs{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:.9rem}
.stage-title{font-family:var(--f-disp);font-size:1.9rem;margin:.4em 0 .1em}
.intro{max-width:60ch;color:var(--muted);margin-top:0}
.text-card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:18px 22px;margin:16px 0}
.text-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.text-head h2{margin:0;font-size:1.6rem}
.para{font-size:1.4rem;line-height:2;margin:.6em 0;max-width:34em}
.pno{font-family:var(--f-kai);border:1.5px solid var(--accent);color:var(--accent);background:none;border-radius:4px;min-width:1.6em;width:auto;white-space:nowrap;padding:0 .15em!important;height:1.6em;line-height:1;margin-right:.5em;font-size:1rem;vertical-align:.15em;padding:0}
.markbox,.words{margin:12px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:.25em .9em;font-family:var(--f-kai);font-size:1.05rem}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.words summary{cursor:pointer;font-weight:700}
.word-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:10px}
.word{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;display:grid}
.word b{font-size:1.3rem}.word span{font-size:.92rem;color:var(--muted)}
.group-banner{display:flex;gap:12px;align-items:baseline;border-radius:12px;padding:12px 18px;margin:12px 0}
.group-banner strong{font-size:1.4rem}
.qlist{display:grid;gap:14px;margin-top:16px}
.q{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px 18px;margin:0;min-width:0}
.q.miss{border-color:var(--no)}
.q legend{display:flex;gap:10px;align-items:flex-start;padding:0;font-weight:500;font-size:1.1rem;float:left;width:100%;margin-bottom:10px}
.q legend+*{clear:both}
.qno{flex:none;width:1.8em;height:1.8em;border-radius:50%;background:var(--ink);color:var(--card);display:grid;place-items:center;font-size:.85rem;font-variant-numeric:tabular-nums}
.qtag{flex:none;font-size:.78rem;border:1px solid var(--line);border-radius:4px;padding:.1em .45em;color:var(--muted);margin-top:.2em}
.qtext{min-width:0}

td.c.ok{background:var(--ok-soft);color:var(--ok);font-weight:700}td.c.no{background:var(--no-soft);color:var(--no);font-weight:700}td.c.txt{background:var(--teal-soft);color:var(--teal)}
tr.clickable{cursor:pointer}tr.clickable:hover td{outline:1px solid var(--line)}
.pill{display:inline-block;font-size:.78rem;border-radius:999px;padding:.05em .6em;background:var(--paper);border:1px solid var(--line)}.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}

.switch input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.two-col{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:16px}

.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:10px}

.opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}

.stars{display:flex;gap:4px;flex:0 0 auto}
.star{font-size:2rem;line-height:1;width:48px;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:#cfc6ba;padding:0}
.star.on{color:#f0a500;border-color:#f0a500;background:#fff7e0}
.peer-res{margin-top:12px;border:2px solid #f0a500;background:#fffaf0;border-radius:14px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:#2d2420}
.peer-res.big{font-size:1.3rem}
.peer-avg{display:flex;flex-wrap:wrap;gap:6px 18px;width:100%}
.peer-avg i{font-style:normal;color:#86766a;font-size:.85em}
.peer-pr{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.starbar{display:inline-block;letter-spacing:.05em;background:linear-gradient(90deg,#f0a500 var(--v),#d9d0c4 var(--v));-webkit-background-clip:text;background-clip:text;color:transparent;font-size:1.25em}
.peer-tv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2vh 2vw;width:100%}
.peer-tvc{background:#fffdf8;color:#2d2420;border-radius:18px;padding:1.6vh 1.4vw;text-align:left;display:flex;flex-direction:column;gap:.8vh}
.peer-tvc h3{margin:0;font-size:clamp(20px,3vh,34px)}
.peer-poem{margin:0;font-size:clamp(16px,2.5vh,28px);line-height:1.5}
.peer-tvc .peer-avg{font-size:clamp(16px,2.4vh,28px)}
.peer-top{margin:0;font-size:clamp(15px,2.2vh,26px)}
@media (max-width:700px){.peer-grid,.peer-tv{grid-template-columns:1fr}}
.lad-one #peerGo{position:absolute;top:18px;right:24px;left:auto;width:auto;font-size:1.05rem;padding:.5em 1em}
.one-all p span{display:block}

  // 童詩：每一󠇡段裡用換行󠇡分開詩句

    '醫生伯伯，穿著白袍，\n像雲一樣白，看著我走來。\n醫生伯伯，戴上聽筒，\n像啄木鳥，準備抓蟲。\n把我的前胸和後背，當成樹幹，\n仔細聽，輕輕敲：\nㄎㄡˋ ㄎㄡˋ ㄎㄡˋ！ㄎㄡˋ ㄎㄡˋ ㄎㄡˋ！',

  ],

function stageStatus(s) {
  const r = st.recs[s.id];
  if (!isOpen(s.id)) return ['lock', '未開放'];
  if (s.id === 'review') return st.preview ? ['go', '預覽'] : st.recs.post?.done ? (r?.done ? ['done', '完成'] : ['go', '可以開始']) : ['lock', '先完成後測'];
  if (s.bonus) { if (!st.preview && !st.recs.pre?.done) return ['lock', '先完成預習單']; if (!st.preview && !st.recs.pre?.extra?.check?.ok) return ['lock', '等老師檢核']; const b = r?.extra || {}; const n = (b.radical?.done ? 1 : 0) + (b.diff?.done ? 1 : 0) + (Object.keys(b.strokes || {}).length ? 1 : 0) + (Object.keys(b.idiom || {}).length ? 1 : 0); return n ? ['doing', `玩了 ${n} / 4 個`] : ['go', '可以開始']; }
  if (s.frame) return ['go', '可以開始'];
  if (s.peer) { const n = Object.values(r?.ans || {}).filter(peerFull).length; return n >= THEMES.length - 1 ? ['done', '完成'] : n ? ['doing', `評了 ${n} 組`] : ['go', '可以開始']; }
  if (s.id === 'stroke') { const n = (r?.extra?.written || []).length; return n >= CHARS.length ? ['done', '完成'] : n ? ['doing', `${n}/15`] : ['go', '可以開始']; }
  if (s.review && r?.done && !r.extra?.check?.ok) return ['wait', r.extra?.check ? '要訂正' : '等老師檢核'];
  if (r?.done) return ['done', '完成'];
  if (r && Object.keys(r.ans).length) return ['doing', '進行中'];
  if (s.diff && !s.themed && (!myGroup(s.diff) || (!st.preview && !st.cfg?.ov?.[s.diff] && !gRec(s.diff, x => st.recs[x])?.reviewed))) return ['wait', gTests(s.diff).length ? '先做檢測和󠇡檢討' : '等老師分組'];
  return ['go', '可以開始'];
}

// ===== 課文 =====
// 課文加上破音字的異體選擇器（依 LESSON_ZY），給注音字型顯示正確讀音
let _PZ = null;
function paraZ(i) {
  if (!_PZ) _PZ = LESSON.paras.map((p, n) => { let k = 0; const zy = LESSON_ZY[n] || [];
    return (p.match(/[ㄅ-ㄩ]+[ˊˇˋ˙]?| |[\s\S]/g) || []).map(ch => { if (/[一-鿿]/.test(ch)) { const z = zy[k++]; const v = typeof ZY_IVS !== 'undefined' && (ZY_IVS[ch] || {})[z]; return v ? ch + String.fromCodePoint(0xE01E0 + v) : ch; } return ch; }).join(''); });
  return _PZ[i];
}
function textBlock(marking) {
  const rec = myRec(st.stage);
  const marked = rec.extra.marked || [];
  const words = LESSON.marks;
  return `
  <article class="text-card">
    <header class="text-head"><h2 class="kai">${esc(LESSON.title)}</h2><button class="ghost sm" id="readAll">朗讀全文</button></header>
    ${LESSON.paras.map((p, i) => `<p class="para kai"><button class="pno" data-p="${i}" title="朗讀這一󠇡段">${ZH_NUM[i]}</button>${esc(paraZ(i))}</p>`).join('')}
  </article>
  ${stageById(st.stage).readCount ? `<div class="markbox"><p class="label">我讀了課文幾遍？（大聲讀一󠇡遍，就點一󠇡下）</p>
    <div class="chips">${[1, 2, 3].map(k => `<button class="chip ${(rec.extra.reads || 0) >= k ? 'on' : ''}" data-read="${k}">第 ${k} 遍</button>`).join('')}</div></div>` : ''}
  ${marking ? `<div class="markbox"><p class="label">我不懂的語詞（點一󠇡下做記號）</p>
    <div class="chips">${words.map(w => `<button class="chip ${marked.includes(w) ? 'on' : ''}" data-w="${w}">${w}</button>`).join('')}</div></div>` : ''}`;
}
function speak(text) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(sayFix(String(text).replace(/[\u{E0100}-\u{E01EF}]/gu, '')));
    const v = speechSynthesis.getVoices().find(v => /zh[-_]TW/i.test(v.lang)) || speechSynthesis.getVoices().find(v => /^zh/i.test(v.lang));
    if (v) u.voice = v; u.lang = 'zh-TW'; u.rate = 0.85;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function bindText() {
  $('#readAll') && ($('#readAll').onclick = () => speak(LESSON.paras.join('')));
  document.querySelectorAll('.pno').forEach(b => b.onclick = () => speak(LESSON.paras[+b.dataset.p]));
  document.querySelectorAll('[data-say]').forEach(b => b.onclick = () => speak(b.dataset.say));
  document.querySelectorAll('.chip[data-read]').forEach(b => b.onclick = () => {
    const rec = myRec(st.stage); const k = +b.dataset.read; rec.extra.reads = (rec.extra.reads || 0) >= k ? k - 1 : k;
    document.querySelectorAll('.chip[data-read]').forEach(x => x.classList.toggle('on', +x.dataset.read <= rec.extra.reads)); queueSave(st.stage);
  });
  document.querySelectorAll('.chip[data-w]').forEach(b => b.onclick = () => {
    const rec = myRec(st.stage); const m = rec.extra.marked || [];
    const w = b.dataset.w; rec.extra.marked = m.includes(w) ? m.filter(x => x !== w) : [...m, w];
    b.classList.toggle('on'); queueSave(st.stage);
  });
}

// ===== 小組互評（學生端）：別組上臺時給星星和󠇡一󠇡句好話 =====
const peerFull = v => v && Array.isArray(v.c) && v.c.length === PEER.crit.length && v.c.every(x => x >= 1) && !!v.p;
// 老師指定「現在報告」的組（存在 unlocked 的 peer:N）；沒有指定時，每一󠇢組都可以評
function peerNow(list) { const u = (list || []).find(x => /^peer:[1-4]$/.test(x)); return u ? +u.slice(5) : 0; }
function peerBody(s) {
  const rec = myRec(s.id); const home = st.preview ? (st.pvHome || 1) : (myHome() || rec.extra.home || null);
  if (!home) return `<div class="notice"><p>你的原組是第幾組？（看電視上的名單）</p><div class="home-pick">${THEMES.map((t, i) => `<button type="button" class="primary" data-phome="${i + 1}">第 ${i + 1} 組</button>`).join('')}</div></div>`;
  const now = st.preview ? 0 : peerNow(st.cfg?.unlocked);
  const card = g => { const v = rec.ans['g' + g] || { c: [], p: '' }; const mine = g === home; const full = peerFull(v);
    const open = !mine && (!now || now === g || full || (v.c || []).some(Boolean));
    return `<section class="peer-card ${mine ? 'mine' : ''} ${now === g ? 'now' : ''} ${full ? 'full' : ''}" data-pg="${g}">
      <h2><span class="peer-n">第 ${g} 組</span><span class="kai">${esc(THEMES[g - 1])}</span>${now === g && !mine ? '<em>現在上臺</em>' : ''}${full ? '<em class="ok">已送出 ✓</em>' : ''}</h2>
      ${mine ? '<p class="muted">這是你們這一󠇢組，不󠇡用評分。上臺時，念得󠇡大聲又清楚！</p>'
        : !open ? '<p class="muted">還沒輪到這一󠇢組，等他們上臺再評。</p>'
        : `${PEER.crit.map(([n, d], k) => `<div class="peer-row"><div class="peer-lab"><b>${esc(n)}</b><span>${esc(d)}</span></div>
            <div class="stars" role="group" aria-label="${esc(n)}">${[1, 2, 3].map(x => `<button type="button" class="star ${(v.c[k] || 0) >= x ? 'on' : ''}" data-star="${g}|${k}|${x}" aria-label="${x} 顆星" aria-pressed="${(v.c[k] || 0) >= x}">★</button>`).join('')}</div></div>`).join('')}
          <div class="peer-row col"><div class="peer-lab"><b>送一󠇡句好話</b><span>選一󠇡個󠇡他們做得󠇡最好的地方</span></div>
            <div class="chips">${PEER.praise.map(pz => `<button type="button" class="chip ${v.p === pz ? 'on' : ''}" data-praise="${g}|${esc(pz)}">${esc(pz)}</button>`).join('')}</div></div>`}
    </section>`; };
  return `<div class="group-banner g-teal"><span>你的原組</span><strong>第 ${home} 組</strong><span class="theme-tag">主角「<b>${esc(THEMES[home - 1])}</b>」</span></div>
    ${st.preview ? `<div class="pv-switch"><span class="label">預覽原組</span>${THEMES.map((t, i) => `<button type="button" class="chip ${(st.pvHome || 1) === i + 1 ? 'on' : ''}" data-pvh="${i + 1}">第 ${i + 1} 組・${t}</button>`).join('')}</div>` : ''}
    <p class="muted">星星愈多愈棒：★ 還可以更好　★★ 不󠇡錯　★★★ 太棒了</p>
    <div class="peer-grid">${THEMES.map((_, i) => card(i + 1)).join('')}</div>`;
}
function bindPeer(s) {
  const rec = myRec(s.id);
  const keep = () => { const y = window.scrollY; renderStage(); window.scrollTo(0, y); };
  document.querySelectorAll('[data-phome]').forEach(b => b.onclick = () => { rec.extra.home = +b.dataset.phome; queueSave(s.id, true); keep(); });
  document.querySelectorAll('[data-pvh]').forEach(b => b.onclick = () => { st.pvHome = +b.dataset.pvh; keep(); });
  const cur = g => { if (!rec.ans['g' + g]) rec.ans['g' + g] = { c: [], p: '' }; return rec.ans['g' + g]; };
  const after = () => { rec.done = Object.values(rec.ans).filter(peerFull).length >= THEMES.length - 1; queueSave(s.id, true); keep(); };
  document.querySelectorAll('[data-star]').forEach(b => b.onclick = () => { const [g, k, x] = b.dataset.star.split('|').map(Number); const v = cur(g); v.c[k] = v.c[k] === x && x === 1 ? 0 : x; for (let i = 0; i < PEER.crit.length; i++) v.c[i] = v.c[i] || 0; sfx && sfx('tap'); after(); });
  document.querySelectorAll('[data-praise]').forEach(b => b.onclick = () => { const [g, pz] = b.dataset.praise.split('|'); const v = cur(+g); v.p = v.p === pz ? '' : pz; after(); });
}

function itemsBody(s) {

    group && s.paras?.[group] ? `<details class="words my-paras" open><summary>你負責的課文：第${s.paras[group].map(k => ZH_NUM[k]).join('、')}段</summary><div class="kai my-para-text">${s.paras[group].map(k => `<p><span class="pno">${ZH_NUM[k]}</span>${esc(paraZ(k))}</p>`).join('')}</div></details>` : ''

  if (locked) {

    if (s.group && !rec.extra.reviewed && s.holdReview && !revealed(s.id)) {

  form.querySelectorAll('.hbtn').forEach(b => b.onclick = () => { rec.hints[b.dataset.id] = (rec.hints[b.dataset.id] || 0) + 1; queueSave(s.id); const y = scrollY; renderStage(); scrollTo(0, y); });

    rec.max = mcs.length;
    rec.score = mcs.filter(it => (isTest || s.holdReview ? rec.ok[it.id] : rec.first[it.id])).length;
    if (group) rec.extra.group = group;
    rec.done = true; queueSave(s.id, true);
    renderStage(); scrollTo(0, 0);
  };

}

const splitSents = p => p.match(/[^。！？]*[。！？]」?/g) || [p];

function gameHtml(s, it, rec) {
  const G = gameState(rec, it); const done = rec.ans[it.id] === 'done'; const miss = (rec.extra.gmiss || {})[it.id] || 0;

function gameMiss(rec, it, msg) { rec.extra.gmiss = rec.extra.gmiss || {}; rec.extra.gmiss[it.id] = (rec.extra.gmiss[it.id] || 0) + 1; gameState(rec, it).msg = msg; try { sfx('no'); } catch (e) {} }

    queueSave(s.id); rerender();

const HOME_KEY = () => `${LESSON.key}-home-${st.cls}`;
function homeCompute() {
  const lv = {}; const none = [];
  seatsList().forEach(n => { const g = tGroupOf(n, 's')?.g; if (g) lv[n] = g; else none.push(n); });
  const groups = [[], [], [], []];
  for (const k of ['D', 'C', 'B', 'A']) {
    Object.keys(lv).filter(n => lv[n] === k).map(Number).sort((a, b) => a - b).forEach(n => {
      const cand = groups.map((g, i) => ({ i, has: g.some(m => m.lv === k), len: g.length }));
      cand.sort((x, y) => (x.has - y.has) || (x.len - y.len) || (x.i - y.i));
      groups[cand[0].i].push({ seat: n, lv: k });
    });
  }
  const order = ['A', 'B', 'C', 'D'];
  groups.forEach(g => { g.forEach(m => m.role = m.lv); g.sort((x, y) => order.indexOf(x.lv) - order.indexOf(y.lv) || x.seat - y.seat); });
  return { groups, none };
}
async function syncHome() {
  if (!stageById('expert') || !st.t.cfg) return;

  const cur = st.t.cfg.ov.v || {};
  if (JSON.stringify(Object.keys(want).sort().map(k => k + want[k])) === JSON.stringify(Object.keys(cur).sort().map(k => k + cur[k]))) return;
  st.t.cfg.ov.v = want; await tSaveCfg();

function homeData() {
  const locked = LS.get(HOME_KEY(), null);

  if (locked?.groups) {
    // 固定後才做完檢測的人：放到人數最少的組
    const inList = new Set(locked.groups.flat().map(m => m.seat)); const groups = locked.groups;
    h.groups.flat().filter(m => !inList.has(m.seat)).forEach(m => { groups.reduce((a, g) => g.length < a.length ? g : a).push(m); });
    // 名單固定後，老師如果又改了某人的身分󠇡（剪刀、梳子󠇡……），以最新的身分󠇡為準
    const order = ['A', 'B', 'C', 'D'];
    groups.forEach(g => { g.forEach(m => { const cur = tGroupOf(m.seat, 's')?.g; if (cur) m.lv = m.role = cur; }); g.sort((x, y) => order.indexOf(x.lv) - order.indexOf(y.lv) || x.seat - y.seat); });
    h = { locked: true, groups, none: h.none.filter(n => !inList.has(n)) };
  }

  return h;
}

(async function boot() {
  const saved = LOGIN.get();
  if (saved?.role === 'student') {
    st.role = 'student'; st.cls = saved.cls; st.seat = saved.seat;
    loadPending();
    st.recs = LS.get(`${LESSON.key}-me-${st.cls}-${st.seat}`, {});
    await refreshMine(); go('home'); flush();
  } else if (saved?.role === 'teacher') {
    st.role = 'teacher'; st.cls = saved.cls; st.key = saved.key;
    await tLoad(); renderTeacher(); startTeacherPoll();
  } else renderLogin();
  startStudentPoll(); checkVer();
  try { speechSynthesis.getVoices(); } catch (e) {}
})();

</script>
</body></html>
