<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>第九課 形近字</title>
<link rel="stylesheet" href="../fonts/bpmf/bpmf.css">
<style>
@font-face{font-family:"EduKai";src:url("https://teacher-liujikan.github.io/idiompractice/fonts/edukai-4.0.ttf") format("truetype");font-display:swap}
:root{
  --bg:#fbf4ea; --paper:#fffdf8; --ink:#2d2420; --muted:#86766a; --line:#2d2420; --soft:#eadccb;
  --red:#c8372d; --blue:#2f6fb5; --green:#2e8a56; --gold:#e6a817;
  --kai:"EduKai","BiauKai","DFKai-SB","Kaiti TC",serif;
  --zy:"Bpmf Zihi Kai Std";
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--zy),var(--sans)}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.app{height:100vh;min-height:540px;display:flex;flex-direction:column;gap:1.4vh;padding:1.6vh 2vw}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;flex:0 0 auto}
header h1{font-family:var(--zy),var(--kai);font-size:clamp(22px,min(2.6vw,5vh),40px);margin:0}
.tabs{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.tab{border:2px solid var(--ink);background:#fff;border-radius:12px;padding:6px 14px;font-family:var(--zy),var(--kai);font-size:clamp(18px,min(1.8vw,3.4vh),28px)}
.tab[aria-current="true"]{background:var(--ink);color:#fff}
.stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:2vw}
.sheet{display:flex;gap:1.4vw;justify-content:center;min-height:0}
/* 學習單格子󠇡：國字／讀音／造詞 */
.card{display:grid;grid-template-rows:auto 1fr 1.6fr;border:3px solid var(--line);background:var(--paper);min-width:0;flex:1;max-width:560px}
.card .row{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr)) 3.2em;border-bottom:2px solid var(--line);min-height:0}
.card .row:last-child{border-bottom:0}
.lab{writing-mode:vertical-rl;text-orientation:upright;display:flex;align-items:center;justify-content:center;font-family:var(--kai);font-size:clamp(16px,min(1.6vw,3vh),26px);border-left:2px solid var(--line);letter-spacing:.2em;color:var(--muted)}
.cell{border-left:2px solid var(--line);display:flex;align-items:center;justify-content:center;min-width:0;position:relative}
.cell:first-child{border-left:0}
.char{font-family:var(--kai);font-size:clamp(48px,min(5.6vw,11vh),110px);line-height:1.2;padding:.1em 0}
.reveal{width:100%;height:100%;border:0;background:transparent;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:.4em;padding:.4em .2em}
.reveal .q{font-size:clamp(28px,3.6vw,60px);color:var(--soft);font-weight:700}
.zy{font-family:var(--kai);font-size:clamp(28px,min(3.2vw,5.8vh),56px);color:var(--red);font-weight:700;display:inline-flex;align-items:center;gap:.05em}
.zy .col{display:flex;flex-direction:column;align-items:center;line-height:1.05}
.zy .light{font-size:.7em;line-height:.8}
.zy .tone{position:relative;width:.45em;align-self:stretch;font-size:.75em}
.zy .tone i{position:absolute;left:0;font-style:normal}
.words{font-family:var(--zy),var(--kai);display:flex;flex-direction:row-reverse;align-items:flex-start;justify-content:center;gap:.45em;color:var(--blue);font-size:clamp(30px,min(3.4vw,6.4vh),62px);line-height:1.1}
.words span{writing-mode:vertical-rl;text-orientation:upright;white-space:nowrap;letter-spacing:.05em}
.cell.on .reveal{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:none;opacity:1}}
/* 右邊說明 */
.side{background:var(--paper);border:2px solid var(--soft);border-radius:20px;padding:2vh 1.6vw;display:flex;flex-direction:column;gap:1.4vh;min-height:0;overflow:auto}
.side h2{margin:0;font-family:var(--zy),var(--kai);font-size:clamp(24px,min(2.6vw,5vh),42px)}
.side .tip{font-size:clamp(17px,min(1.65vw,3.1vh),27px);line-height:1.65;margin:0}
.side .tip b{color:var(--red)}
.side .pair{display:flex;flex-direction:column;gap:1vh}
.side .pair p{margin:0;font-size:clamp(17px,min(1.6vw,3vh),26px);line-height:1.6}
.k{font-family:var(--kai);font-size:1.3em}
.sent{font-family:var(--zy),var(--kai);font-size:clamp(20px,min(2vw,3.8vh),32px);background:#fff;border:2px dashed var(--soft);border-radius:14px;padding:1vh 1vw;line-height:1.6}
.sent .bl{display:inline-block;min-width:1.6em;border-bottom:3px solid var(--ink);text-align:center;color:var(--green);font-weight:700}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;flex:0 0 auto}
.btn{border:3px solid var(--ink);background:var(--ink);color:#fff;border-radius:14px;padding:8px 18px;font-size:clamp(16px,min(1.6vw,3vh),24px);font-weight:700}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.3;cursor:default}
.hint{color:var(--muted);font-size:clamp(14px,1.3vw,18px)}
.foot{margin-left:auto;font-size:12px;color:var(--muted)}
@media (max-width:900px){.stage{grid-template-columns:1fr}.app{height:auto}}
@media (prefers-reduced-motion:reduce){.cell.on .reveal{animation:none}}
.sent .bl{font-family:var(--kai)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
// 依學習單的順序（由右到左）：袍跑包、戴載、筒同、幹乾、般搬
const K = t => `<span class="k">${t}</span>`;
const PAGES = [
  { part: '分辨形近字', title: '袍・跑・包', cols: [
      { c: '袍', zy: 'ㄆㄠˊ', w: ['白袍', '睡袍'] },
      { c: '跑', zy: 'ㄆㄠˇ', w: ['跑步', '賽跑'] },
      { c: '包', zy: 'ㄅㄠ', w: ['書包', '包裝'] } ],
    tips: ['三個󠇡字都有「包」，看<b>左邊多了什麼</b>就知道意思。', `${K('袍')}：衣字旁（衤），是一󠇢種長衣服。`, `${K('跑')}：足字旁，用腳跑。　${K('包')}：沒有偏旁，把東西󠇡裹起來。`],
    test: [['醫生穿著白', '袍', '。', 'ㄆㄠˊ'], ['下課去操場', '跑', '步。', 'ㄆㄠˇ'], ['把課本放進書', '包', '。', 'ㄅㄠ']] },
  { part: '分辨形近字', title: '戴・載', cols: [
      { c: '戴', zy: 'ㄉㄞˋ', w: ['戴帽子󠇡', '愛戴'] },
      { c: '載', zy: 'ㄗㄞˋ', w: ['載客', '載貨'] } ],
    tips: ['兩個󠇡字只差在<b>左下方</b>。', `${K('戴')}：左下是「${K('異')}」，把東西󠇡套、掛在身上。`, `${K('載')}：左下是「${K('車')}」，用車子󠇡運送人或東西󠇡。`],
    test: [['醫生伯伯󠇡', '戴', '上聽筒。', 'ㄉㄞˋ'], ['媽媽󠇡騎機車', '載', '我上學。', 'ㄗㄞˋ']] },
  { part: '分辨形近字', title: '筒・同', cols: [
      { c: '筒', zy: 'ㄊㄨㄥˇ', w: ['聽筒', '筆筒'] },
      { c: '同', zy: 'ㄊㄨㄥˊ', w: ['同學', '相同'] } ],
    tips: ['「筒」是在「同」上面加<b>竹字頭</b>，聲調󠇡也不一󠇡樣。', `${K('筒')}：像竹子󠇡一󠇡樣細細長長、中間空的東西󠇡，念第三聲。`, `${K('同')}：一󠇡樣的意思，念第二聲。`],
    test: [['把鉛筆放進筆', '筒', '。', 'ㄊㄨㄥˇ'], ['我和󠇡', '同', '學一󠇢起打球。', 'ㄊㄨㄥˊ']] },
  { part: '分辨形近字', title: '幹・乾', cols: [
      { c: '幹', zy: 'ㄍㄢˋ', w: ['樹幹', '能幹'] },
      { c: '乾', zy: 'ㄍㄢ', w: ['乾淨', '餅乾'] } ],
    tips: ['左邊一󠇡樣，差在<b>右邊</b>。', `${K('幹')}：右邊是「人」和「干」，樹幹、能幹。`, `${K('乾')}：右邊是「乞」，沒有水分󠇡，乾淨、餅乾。`],
    test: [['松鼠爬上樹', '幹', '。', 'ㄍㄢˋ'], ['洗完手要擦', '乾', '。', 'ㄍㄢ']] },
  { part: '分辨形近字', title: '般・搬', cols: [
      { c: '般', zy: 'ㄅㄢ', w: ['一󠇢般', '陽光般'] },
      { c: '搬', zy: 'ㄅㄢ', w: ['搬家', '搬動'] } ],
    tips: ['兩個󠇡字念法一󠇡樣。', `${K('般')}：「一󠇡樣、那樣」的意思，像陽光般溫暖。`, `${K('搬')}：多了<b>提手旁</b>，用手移動東西󠇡，搬家、搬桌子󠇡。`],
    test: [['他露󠇡出陽光', '般', '的微笑。', 'ㄅㄢ'], ['大家一󠇢起', '搬', '桌子󠇡。', 'ㄅㄢ']] }
];
// 一󠇢般直式注音：符號由上往下，聲調󠇡寫在最後一󠇡個󠇡符號的右邊，輕聲點在最上面
function zyHTML(z) {
  const light = z.includes('˙'); const m = z.match(/[ˊˇˋ]/); const t = m ? m[0] : '';
  const syms = [...z.replace(/[ˊˇˋ˙]/g, '')];
  const n = syms.length;
  // 聲調󠇡的高度對齊最後一󠇡個󠇡符號（以行高 1.05em × 比例估算）
  const top = ((n - 1) / n * 100).toFixed(0);
  return `<span class="zy"><span class="col">${light ? '<span class="light">˙</span>' : ''}${syms.map(s => `<span>${s}</span>`).join('')}</span>${t ? `<span class="tone"><i style="top:calc(${top}% + .05em)">${t}</i></span>` : ''}</span>`;
}
let P = 0; const open = {}; let testOn = false;
const key = (p, i, r) => `${p}-${i}-${r}`;
function render() {
  const pg = PAGES[P];
  const cols = pg.cols.slice().reverse(); // 學習單由右往左寫：第一個󠇡字在右邊
  const cell = (col, idx, r) => {
    const on = open[key(P, idx, r)];
    const inner = !on ? '<span class="q">？</span>' : r === 'zy' ? zyHTML(col.zy) : `<span class="words">${col.w.map(x => `<span>${x}</span>`).join('')}</span>`;
    return `<div class="cell ${on ? 'on' : ''}"><button class="reveal" data-i="${idx}" data-r="${r}" aria-label="${on ? '收起' : '顯示'}${r === 'zy' ? '讀音' : '造詞'}">${inner}</button></div>`;
  };
  const n = cols.length;
  const sameChar = pg.cols.every(c => c.c === pg.cols[0].c);
  document.getElementById('app').innerHTML = `
  <header><h1>第九課　${pg.part}</h1>
    <nav class="tabs" aria-label="選字">${PAGES.map((x, k) => `<button class="tab" data-p="${k}" aria-current="${k === P}">${x.title}</button>`).join('')}</nav></header>
  <section class="stage">
    <div class="sheet"><div class="card" style="--n:${n}">
      <div class="row">${sameChar ? `<div class="cell" style="grid-column:span ${n}"><span class="char">${pg.cols[0].c}</span></div>` : cols.map(c => `<div class="cell"><span class="char">${c.c}</span></div>`).join('')}<div class="lab">國字</div></div>
      <div class="row">${cols.map(c => cell(c, pg.cols.indexOf(c), 'zy')).join('')}<div class="lab">讀音</div></div>
      <div class="row">${cols.map(c => cell(c, pg.cols.indexOf(c), 'w')).join('')}<div class="lab">造詞</div></div>
    </div></div>
    <aside class="side">
      <h2>${sameChar ? `「${pg.title}」有兩種念法` : `${pg.cols.map(c => '「' + c.c + '」').join('、')}怎麼分？`}</h2>
      <div class="pair">${pg.tips.map(t => `<p class="tip">${t}</p>`).join('')}</div>
      <h2 style="font-size:clamp(20px,min(2vw,4vh),32px)">考考你：${sameChar ? '這裡念什麼？' : '這裡寫哪一󠇡個󠇡字？'}</h2>
      ${pg.test.map(([a, c, b, zy]) => `<div class="sent">${a}<span class="bl">${testOn ? (sameChar ? `${c}（${zy}）` : c) : '　'}</span>${b}</div>`).join('')}
      <div><button class="btn ghost" id="testBtn">${testOn ? '藏起答案' : '看答案'}</button></div>
    </aside>
  </section>
  <div class="bar">
    <button class="btn ghost" id="prev" ${P === 0 ? 'disabled' : ''}>← 上一󠇡個󠇡</button>
    <button class="btn" id="all">${pg.cols.every((c, i) => open[key(P, i, 'zy')] && open[key(P, i, 'w')]) ? '全部藏起來' : '全部顯示'}</button>
    <button class="btn ghost" id="next" ${P === PAGES.length - 1 ? 'disabled' : ''}>下一󠇡個󠇡 →</button>
    <span class="hint">點格子󠇡裡的「？」可以一󠇢格一格打開；鍵盤左右鍵可以換字。</span>
    <span class="foot">© 范范老師（老師媽咪）設計</span>
  </div>`;
}
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.p) { P = +t.dataset.p; testOn = false; render(); return; }
  if (t.classList.contains('reveal')) { const k = key(P, t.dataset.i, t.dataset.r); open[k] = !open[k]; render(); return; }
  if (t.id === 'all') { const pg = PAGES[P]; const all = pg.cols.every((c, i) => open[key(P, i, 'zy')] && open[key(P, i, 'w')]); pg.cols.forEach((c, i) => { open[key(P, i, 'zy')] = !all; open[key(P, i, 'w')] = !all; }); render(); return; }
  if (t.id === 'testBtn') { testOn = !testOn; render(); return; }
  if (t.id === 'prev' && P > 0) { P--; testOn = false; render(); return; }
  if (t.id === 'next' && P < PAGES.length - 1) { P++; testOn = false; render(); return; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && P < PAGES.length - 1) { P++; testOn = false; render(); }
  if (e.key === 'ArrowLeft' && P > 0) { P--; testOn = false; render(); }
});
render();
</script>
</body>
</html>
